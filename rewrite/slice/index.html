<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ARVEXQ 競馬展開AI</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#f3f5f9}.slice-note{background:#fff5da;color:#5e4700;padding:12px;font-size:13px;border-radius:10px}.slice-controls{display:flex;flex-wrap:wrap;gap:8px;padding:12px}.slice-controls input,.slice-controls select,.slice-button{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:white;color:#101828}.slice-button{cursor:pointer;text-align:left}.slice-row{display:grid;grid-template-columns:28px 30px 1fr 65px;gap:5px;align-items:center;padding:10px 0;border-bottom:1px solid #e4e7ec}.slice-name{border:0;background:none;color:#6abaff;text-align:left;font:inherit;cursor:pointer}.slice-stage{margin:12px 0;padding:8px;background:#f3f5f9;border-radius:8px}.slice-stage ol{display:flex;flex-wrap:wrap;gap:7px;padding:0;list-style:none}.slice-stage li{background:white;padding:6px;border:1px solid #cbd5e1;border-radius:6px}.slice-mark{font-size:21px;color:#b77710}dialog{max-width:680px;width:94%;max-height:85vh;border:0;border-radius:14px;padding:18px;color:#101828}dialog::backdrop{background:#0008}.slice-history{padding:10px 0;border-bottom:1px solid #ddd;font-size:13px}.slice-muted{color:#a9b9ca;font-size:13px}a{color:#1558bc}button:focus-visible,a:focus-visible{outline:3px solid #2563eb}.slice-score{font-size:12px;text-align:right}.slice-error{padding:16px;color:#a11}#status{padding:4px 12px;font-size:13px}.card h2{font-size:18px}.slice-source{word-break:break-all;font-size:12px}
</style></head><body><div class="shell"><header class="header"><div class="header-row"><button class="slice-button" id="back" aria-label="戻る">‹ 戻る</button><div class="header-title"><h1>ARVEXQ</h1><small>競馬展開AI</small></div></div></header>
