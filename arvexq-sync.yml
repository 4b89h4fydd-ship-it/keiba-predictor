name: ARVEXQ Realtime Sync

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 22-23 * * *"
    - cron: "*/5 0-14 * * *"

concurrency:
  group: arvexq-realtime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_SYNC_URL: https://kraiz-api.4b89h4fydd.workers.dev/api/sync
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-data
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
      NAR_ON_DEMAND_HISTORY_MONTHS: "12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/arvexq-sync.yml

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            fastapi==0.115.6 "uvicorn[standard]==0.34.0" beautifulsoup4==4.12.3

      - name: Set sync date
        run: echo "SYNC_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"

      - name: Restore ARVEXQ data cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-data-${{ runner.os }}-${{ env.SYNC_DATE }}-${{ github.run_id }}
          restore-keys: |
            arvexq-data-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-

      - name: Start ARVEXQ locally
        run: |
          nohup uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/arvexq.log 2>&1 &
          echo $! > /tmp/arvexq.pid
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/health > /dev/null; then
              echo "ARVEXQ ready"
              exit 0
            fi
            sleep 1
          done
          tail -n 200 /tmp/arvexq.log || true
          exit 1

      - name: Fast bootstrap current card
        run: |
          curl -fsS --max-time 30 \
            "http://127.0.0.1:8000/api/v1/site-bootstrap?date=$SYNC_DATE&force=1" \
            -o bundle.json || true

          for i in $(seq 1 6); do
            curl -fsS --max-time 20 \
              "http://127.0.0.1:8000/api/v1/site-bootstrap?date=$SYNC_DATE" \
              -o bundle.json || true
            RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
            DETAILS=$(jq '.details // [] | length' bundle.json 2>/dev/null || echo 0)
            echo "bootstrap $i races=$RACES details=$DETAILS"
            if [ "$RACES" -gt 0 ] && [ "$DETAILS" -gt 0 ]; then break; fi
            sleep 2
          done

          RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
          if [ "$RACES" -le 0 ]; then
            echo "No current race card"
            tail -n 220 /tmp/arvexq.log || true
            exit 1
          fi

      - name: Push first paint to D1 immediately
        run: |
          jq '{
            summaries: [(.races // [])[] | . + {
              raceStatus: (if ((.result // {}).status // "") == "確定" then "確定" else (.raceStatus // "") end)
            }],
            details: (.details // []),
            meta: {
              source: "github-actions-first-paint-v201",
              sync_date: (.date // ""),
              race_count: ((.races // []) | length),
              detail_count: ((.details // []) | length),
              analysis_count: (.analysisCount // 0),
              display_complete: (.displayComplete // .complete // false)
            }
          }' bundle.json > first-paint.json

          curl --fail-with-body --max-time 20 -X POST "$CLOUDFLARE_SYNC_URL" \
            -H "content-type: application/json" \
            -H "x-sync-token: $SYNC_TOKEN" \
            --data-binary @first-paint.json

      - name: Refresh only live and next races
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timedelta, timezone
          import app

          BASE = "http://127.0.0.1:8000"
          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          today = now.strftime("%Y-%m-%d")
          now_min = now.hour * 60 + now.minute

          with open("bundle.json", encoding="utf-8") as f:
              bundle = json.load(f)
          rows = [r for r in (bundle.get("races") or []) if r.get("id")]

          def start_min(r):
              st = str(r.get("startTime") or "")
              try:
                  h, m = st.split(":", 1)
                  return int(h) * 60 + int(m[:2])
              except Exception:
                  return 9999

          def summary_final(r):
              result = r.get("result") or {}
              status = str(result.get("status") or "")
              if status == "速報":
                  return False
              if status == "確定":
                  return True
              return str(r.get("raceStatus") or "") == "確定"

          def result_complete(d):
              result = (d or {}).get("result") or {}
              ranks = {int(x.get("finish") or 0) for x in (result.get("finishers") or []) if isinstance(x, dict)}
              return str(result.get("status") or "") == "確定" and all(i in ranks for i in (1, 2, 3))

          detail_by_id = {str(d.get("id") or ""): d for d in (bundle.get("details") or []) if d.get("id")}

          # A summary can say 確定 before the actual finishers reach D1.
          # Keep refreshing every started race whose podium is still missing.
          # Complete recent results are refreshed briefly so payouts/official corrections can land.
          incomplete = []
          recent_complete = []
          for r in rows:
              if str(r.get("date") or today) != today:
                  continue
              sm = start_min(r)
              if sm >= 9999 or now_min < sm + 2:
                  continue
              rid = str(r["id"])
              age = now_min - sm
              if not result_complete(detail_by_id.get(rid)):
                  incomplete.append((sm, rid))
              elif age <= 20:
                  recent_complete.append((sm, rid))
          incomplete.sort(reverse=True)
          recent_complete.sort(reverse=True)
          result_targets = [rid for _, rid in incomplete[:20]]
          for _, rid in recent_complete[:8]:
              if rid not in result_targets:
                  result_targets.append(rid)

          # Priority lane: running race + next race of every venue + anything starting within 35 minutes.
          by_track = {}
          for r in rows:
              by_track.setdefault((str(r.get("circuit") or ""), str(r.get("track") or "")), []).append(r)

          priority = []
          for _, group in by_track.items():
              group.sort(key=start_min)
              live = [r for r in group if not summary_final(r) and start_min(r) <= now_min < start_min(r) + 25]
              future = [r for r in group if not summary_final(r) and start_min(r) >= now_min]
              for r in live[:1] + future[:1]:
                  rid = str(r.get("id") or "")
                  if rid and rid not in priority:
                      priority.append(rid)

          for r in sorted(rows, key=lambda x: abs(start_min(x) - now_min)):
              sm = start_min(r)
              rid = str(r.get("id") or "")
              if rid and not summary_final(r) and -5 <= sm - now_min <= 35 and rid not in priority:
                  priority.append(rid)
          priority = priority[:16]

          def refresh_result(rid):
              try:
                  d = app._refresh_result_fast(rid)
                  return d if isinstance(d, dict) and d.get("id") else None
              except Exception as exc:
                  print("result refresh failed", rid, exc)
                  return None

          result_details = []
          with ThreadPoolExecutor(max_workers=8) as ex:
              for fut in as_completed([ex.submit(refresh_result, rid) for rid in result_targets]):
                  d = fut.result()
                  if d:
                      result_details.append(d)

          def call(method, path, timeout):
              try:
                  req = urllib.request.Request(BASE + path, method=method)
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      return res.read()
              except Exception:
                  return None

          def warm(rid):
              enc = urllib.parse.quote(rid, safe="")
              call("POST", f"/api/v1/prepare-race/{enc}", 4)
              call("GET", f"/api/v1/odds-refresh/{enc}?force=1", 8)
              raw = call("GET", f"/api/v1/race/{enc}", 5)
              if not raw:
                  return None
              try:
                  d = json.loads(raw.decode("utf-8"))
                  return d if isinstance(d, dict) and d.get("id") else None
              except Exception:
                  return None

          active_details = []
          with ThreadPoolExecutor(max_workers=12) as ex:
              for fut in as_completed([ex.submit(warm, rid) for rid in priority]):
                  d = fut.result()
                  if d:
                      active_details.append(d)

          with open("result-details.json", "w", encoding="utf-8") as f:
              json.dump(result_details, f, ensure_ascii=False)
          with open("active-details.json", "w", encoding="utf-8") as f:
              json.dump(active_details, f, ensure_ascii=False)

          print("Fast result targets:", len(result_targets), "refreshed:", len(result_details))
          print("Priority live/next targets:", len(priority), "refreshed:", len(active_details))
          PY

      - name: Push freshest active data to D1
        run: |
          python - <<'PY'
          import json

          def read(path, fallback):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return fallback

          def ready(d):
              return bool(((d or {}).get("preparedMeta") or {}).get("diagnosisReady"))

          def final_result(d):
              r = (d or {}).get("result") or {}
              return bool(r.get("status") == "確定" and r.get("finishers"))

          def merge(old, new):
              if not old:
                  return dict(new or {})
              if not new:
                  return dict(old or {})
              out = dict(old)
              old_ready, new_ready = ready(old), ready(new)
              for k, v in new.items():
                  if k in {"horses", "preparedMeta", "result"}:
                      continue
                  if v not in (None, "", [], {}):
                      out[k] = v
              if new_ready or not old_ready:
                  if new.get("horses"):
                      out["horses"] = new["horses"]
              elif new.get("horses"):
                  # Keep the saved diagnosis, but live fields must always win.
                  live_by_no = {
                      int(h.get("horseNumber") or 0): h
                      for h in (new.get("horses") or [])
                      if int(h.get("horseNumber") or 0) > 0
                  }
                  merged_horses = [dict(h or {}) for h in (old.get("horses") or [])]
                  for h in merged_horses:
                      z = live_by_no.get(int(h.get("horseNumber") or 0))
                      if not z:
                          continue
                      for k in ("winOdds","popularity","bodyWeight","bodyWeightChange","status","scratched","oddsSource"):
                          if z.get(k) not in (None, ""):
                              h[k] = z.get(k)
                  out["horses"] = merged_horses
              pm = dict(old.get("preparedMeta") or {})
              npm = dict(new.get("preparedMeta") or {})
              pm.update(npm)
              if old_ready and not new_ready:
                  for k in ("diagnosisReady","diagnosisVersion","diagnosisCoverage","diagnosisPreparedAtEpoch"):
                      if k in (old.get("preparedMeta") or {}):
                          pm[k] = (old.get("preparedMeta") or {})[k]
              out["preparedMeta"] = pm
              if final_result(new) or not final_result(old):
                  if new.get("result"):
                      out["result"] = new["result"]
              else:
                  out["result"] = old.get("result")
              return out

          bundle = read("bundle.json", {})
          result_details = read("result-details.json", [])
          active_details = read("active-details.json", [])
          detail_map = {}
          for group in ((bundle.get("details") or []), result_details, active_details):
              for d in group:
                  rid = str((d or {}).get("id") or "")
                  if rid:
                      detail_map[rid] = merge(detail_map.get(rid), d)

          # Final results always win; pre-race diagnosis remains preserved by merge().
          for d in result_details:
              rid = str((d or {}).get("id") or "")
              if rid and final_result(d) and rid in detail_map:
                  detail_map[rid]["result"] = d.get("result")

          summaries = []
          for r in bundle.get("races") or []:
              z = dict(r)
              d = detail_map.get(str(z.get("id") or ""))
              result = (d or {}).get("result") or z.get("result") or {}
              if result.get("status") == "確定":
                  z["raceStatus"] = "確定"
              elif result.get("status") == "速報" and result.get("finishers"):
                  z["raceStatus"] = "速報"
              summaries.append(z)

          current_ids = {str(r.get("id") or "") for r in summaries if r.get("id")}
          current_details = [d for rid, d in detail_map.items() if rid in current_ids]
          payload = {
              "summaries": summaries,
              "details": list(detail_map.values()),
              "meta": {
                  "source": "github-actions-fastest-v201",
                  "sync_date": bundle.get("date") or "",
                  "race_count": len(summaries),
                  "detail_count": len(current_details),
                  "expected_detail_count": len(current_ids),
                  "missing_detail_count": max(0, len(current_ids) - len({str(d.get('id') or '') for d in current_details})),
                  "analysis_count": sum(1 for d in current_details if ready(d)),
                  "fast_lane": True,
                  "past_detail_count": 0,
                  "display_complete": bool(bundle.get("displayComplete") or bundle.get("complete")),
              }
          }
          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          print("Final push races:", len(summaries), "details:", len(current_details))
          PY

          curl --fail-with-body --max-time 20 -X POST "$CLOUDFLARE_SYNC_URL" \
            -H "content-type: application/json" \
            -H "x-sync-token: $SYNC_TOKEN" \
            --data-binary @payload.json

      - name: Stop ARVEXQ
        if: always()
        run: |
          if [ -f /tmp/arvexq.pid ]; then
            kill "$(cat /tmp/arvexq.pid)" 2>/dev/null || true
          fi

      - name: Decide cache save
        if: always()
        run: |
          SAVE=0
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then SAVE=1; fi
          if [ $((GITHUB_RUN_NUMBER % 3)) -eq 0 ]; then SAVE=1; fi
          echo "SAVE_ARVEXQ_CACHE=$SAVE" >> "$GITHUB_ENV"

      - name: Save ARVEXQ data cache periodically
        if: always() && env.SAVE_ARVEXQ_CACHE == '1'
        uses: actions/cache/save@v4
        with:
          path: .arvexq-data
          key: arvexq-data-${{ runner.os }}-${{ env.SYNC_DATE }}-${{ github.run_id }}

      - name: Show local log on failure
        if: failure()
        run: tail -n 260 /tmp/arvexq.log || true
