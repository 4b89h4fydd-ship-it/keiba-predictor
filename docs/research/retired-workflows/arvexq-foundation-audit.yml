name: ARVEXQ Prediction Audits

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_foundation_priority_audit.py'
      - 'scripts/arvexq_signal_dedup_audit.py'
      - 'scripts/arvexq_signal_dedup_multiday_audit.py'
      - '.github/workflows/arvexq-foundation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare foundation priority
        env:
          PYTHONPATH: '.'
          ARVEXQ_DATE: '2026-10-05'
          ARVEXQ_API_BASE: 'https://kraiz-api.4b89h4fydd.workers.dev'
        run: python scripts/arvexq_foundation_priority_audit.py
      - name: Compare deduplicated evidence families
        env:
          PYTHONPATH: '.'
          ARVEXQ_DATE: '2026-10-05'
          ARVEXQ_API_BASE: 'https://kraiz-api.4b89h4fydd.workers.dev'
        run: python scripts/arvexq_signal_dedup_audit.py
      - name: Validate dedup across seven days
        env:
          PYTHONPATH: '.'
          ARVEXQ_DATE: '2026-10-05'
          ARVEXQ_DAYS: '7'
          ARVEXQ_API_BASE: 'https://kraiz-api.4b89h4fydd.workers.dev'
        run: python scripts/arvexq_signal_dedup_multiday_audit.py
