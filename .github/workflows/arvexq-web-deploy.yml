name: ARVEXQ Web Deploy

on:
  push:
    branches: [main]
    paths:
      - 'arvexq/ui/static/**'
      - 'build_static.py'
      - 'wrangler.toml'
      - 'workers/**'
      - 'scripts/arvexq_build_odds_sources.py'
      - '.github/workflows/arvexq-web-deploy.yml'
      - '.github/workflows/arvexq-webapp-race-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvexq-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gate production on regression and independent module contracts
        env:
          ARVEXQ_DATA_CORE: '0'
          ARVEXQ_BOOTSTRAP_WARM: '0'
          RACEDB_AUTO_UPDATE: '0'
          PYTHONPATH: '.:tests'
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest tests -q
          node scripts/arvexq_production_boundaries_smoke.cjs
          python scripts/arvexq_independence_audit.py
      - name: Build static app
        shell: bash
        run: |
          python build_static.py
          test -s dist/index.html
          test -s dist/version.json
          grep -qi '<html' dist/index.html
          BUILD="$(tr -d '\r\n' < dist/build-version.txt)"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "build=$BUILD"
      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN'
            exit 1
          fi
      - name: Deploy static app to Cloudflare Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          fi
          npx --yes wrangler@4 deploy
      - name: Verify production app
        shell: bash
        run: |
          PROD='https://kraizweb1.4b89h4fydd.workers.dev'
          ok=0
          expected="$(cat dist/version.json)"
          for i in $(seq 1 24); do
            headers="$(mktemp)"
            body="$(mktemp)"
            if curl -fsS --max-time 10 -D "$headers" -o "$body" -H 'Cache-Control: no-cache' "$PROD/?ci=$GITHUB_SHA-$i"; then
              ctype="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)"
              echo "production root attempt $i: ${ctype:-<no-content-type>}"
              if grep -qi 'content-type:.*text/html' "$headers" && grep -qi '<html' "$body" && ! grep -q '"service":"KRAIZ API"' "$body"; then
                version="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "$PROD/version.json?ci=$GITHUB_SHA-$i" 2>/dev/null || true)"
                echo "production version: ${version:-<no-response>}"
                if [ "$version" = "$expected" ]; then
                  ok=1
                  break
                fi
              else
                echo 'production root is not ARVEXQ HTML yet'
                head -c 300 "$body" || true
                echo
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "ARVEXQ production verified at $PROD"
      - name: Verify production home palette CSS matches deployed build
        shell: bash
        run: |
          set -euo pipefail
          PROD='https://kraizweb1.4b89h4fydd.workers.dev'
          URL="$PROD/sports/unified-home.css?palette_check=$GITHUB_SHA"
          curl -fSLsS --retry 6 --retry-delay 3 --max-time 30 -H 'Cache-Control: no-cache' "$URL" -o prod-unified-home.css
          cmp dist/sports/unified-home.css prod-unified-home.css || {
            echo '::error::DEPLOYED_HOME_CSS_DIFFERS_FROM_BUILD'
            exit 1
          }
          grep -Fq 'ARVEXQ light theme v4: single final palette' prod-unified-home.css
          grep -Fq 'background:#fffaf3!important' prod-unified-home.css
          if grep -Fq 'ARVEXQ daylight warm palette final' prod-unified-home.css; then
            echo '::error::OLD_DARK_PALETTE_STILL_PRESENT'
            exit 1
          fi
          echo 'PRODUCTION_HOME_PALETTE_CSS_MATCH_OK'
      - name: Verify horse-only routes and removed boat endpoints
        shell: bash
        run: |
          set -euo pipefail
          PROD='https://kraizweb1.4b89h4fydd.workers.dev'
          ok=0
          for i in $(seq 1 18); do
            curl -fSLsS --retry 3 --retry-delay 2 --max-time 30 -H 'Cache-Control: no-cache' "$PROD/?horse_only=$GITHUB_SHA-$i" -o prod-horse.html
            curl -fSLsS --retry 3 --retry-delay 2 --max-time 30 -H 'Cache-Control: no-cache' "$PROD/keiba/?horse_only=$GITHUB_SHA-$i" -o prod-keiba.html
            if grep -q '/sports/horse-portal.js' prod-horse.html &&
               grep -q '/sports/horse-portal.js' prod-keiba.html &&
               ! grep -Eqi 'kyotei|boat-app|競艇|arvexq-sport-nav' prod-horse.html prod-keiba.html; then
              ok=1
              break
            fi
            echo "Horse-only HTML not fully propagated (attempt $i)"
            grep -inE 'kyotei|boat-app|競艇|arvexq-sport-nav' prod-horse.html prod-keiba.html | cut -c1-200 || true
            sha256sum dist/index.html prod-horse.html prod-keiba.html
            sleep 4
          done
          test "$ok" = 1 || { echo "::error::Production horse-only HTML verification failed"; exit 1; }
          for path in '/kyotei/' '/sports/boat-app/app.js' '/sports/boat-data/2026-10-12.json'; do
            code="$(curl -sS -H 'Cache-Control: no-cache' -o /dev/null -w '%{http_code}' --max-time 20 "$PROD$path?horse_only=$GITHUB_SHA")"
            test "$code" = '404' || { echo "::error::Boat URL $path returned $code instead of 404"; exit 1; }
          done
          echo 'PRODUCTION_HORSE_ONLY_ROUTES_OK'
      - name: Verify current-day racecard fallback is actually deployed
        shell: bash
        run: |
          DAY="$(TZ=Asia/Tokyo date +%F)"
          SOURCE="dist/racecards/$DAY.json"
          if [ ! -s "$SOURCE" ]; then
            echo "::warning::No verified racecard fallback in this build"
            exit 0
          fi
          URL="https://kraizweb1.4b89h4fydd.workers.dev/racecards/$DAY.json?verify=$GITHUB_SHA"
          curl -fsS --retry 5 --retry-delay 2 --max-time 30 \
            -H 'cache-control: no-cache' "$URL" -o production-racecards.json
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          date=datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          source=json.loads((Path("dist/racecards")/(date+".json")).read_text(encoding="utf-8"))
          actual=json.loads(Path("production-racecards.json").read_text(encoding="utf-8"))
          if actual != source:
              raise SystemExit("PRODUCTION_RACECARD_BACKUP_MISMATCH")
          if source.get("raceCount") != len(source.get("races") or []):
              raise SystemExit("PRODUCTION_RACECARD_COUNT_MISMATCH")
          if not all(len(r.get("horses") or [])>=2 and
                     all(h.get("horseNumber") and h.get("name") for h in r["horses"])
                     for r in source["races"]):
              raise SystemExit("PRODUCTION_RACECARD_RUNNER_MISSING")
          print("PRODUCTION_RACECARD_BACKUP_OK",date,"races",source["raceCount"],
                "horses",sum(len(r["horses"]) for r in source["races"]))
          PY
      - name: Verify deployed official-odds roster manifest matches the build
        shell: bash
        run: |
          DAY="$(TZ=Asia/Tokyo date +%F)"
          CARD="dist/racecards/$DAY.json"
          SOURCE="dist/odds-sources/$DAY.json"
          if [ ! -s "$CARD" ]; then
            echo "No verified dated racecard in this build; odds manifest check not applicable"
            exit 0
          fi
          test -s "$SOURCE" || { echo "::error::ODDS_SOURCE_MANIFEST_MISSING"; exit 1; }
          URL="https://kraizweb1.4b89h4fydd.workers.dev/odds-sources/$DAY.json?ci=$GITHUB_SHA"
          curl -fsS --retry 3 --retry-delay 2 --max-time 30 \
            -H 'cache-control: no-cache' "$URL" -o production-odds-sources.json
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          day=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          entry=json.loads((Path('dist/racecards')/(day+'.json')).read_text(encoding='utf-8'))
          built=json.loads((Path('dist/odds-sources')/(day+'.json')).read_text(encoding='utf-8'))
          public=json.loads(Path('production-odds-sources.json').read_text(encoding='utf-8'))
          if built != public:
              raise SystemExit('PRODUCTION_ODDS_SOURCE_MISMATCH')
          if built.get('version') != 'arvexq-odds-sources-v1' or built.get('date') != day:
              raise SystemExit('PRODUCTION_ODDS_SOURCE_INVALID_VERSION')
          actual=built.get('races') or {}
          ids={r['id'] for r in entry['races']}
          if len(ids) != entry['raceCount'] or not ids.issubset(set(actual)):
              raise SystemExit('PRODUCTION_ODDS_SOURCE_COVERAGE_MISMATCH')
          for race_id in ids:
              row=actual[race_id]
              if not (row.get('sourceSnapshotSha256') or row.get('sourceRacecardSha256')):
                  raise SystemExit('PRODUCTION_ODDS_SOURCE_PROVENANCE_MISSING')
              if not row.get('horses'):
                  raise SystemExit('PRODUCTION_ODDS_SOURCE_RUNNERS_MISSING')
          print('PRODUCTION_ODDS_SOURCE_MANIFEST_OK',day,'races',len(ids))
          PY
      - name: Verify immutable morning pick archive from production
        shell: bash
        run: |
          TODAY="$(TZ=Asia/Tokyo date +%F)"
          FILE="dist/morning-picks/$TODAY.json"
          if [ ! -s "$FILE" ]; then
            echo "No dated morning archive present in this build; never backfill after post."
            exit 0
          fi
          URL="https://kraizweb1.4b89h4fydd.workers.dev/morning-picks/$TODAY.json?verify=$GITHUB_SHA"
          curl -fSs --retry 5 --retry-delay 2 --max-time 30 -H 'cache-control: no-cache' "$URL" -o production-morning.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          want=json.loads((Path('dist/morning-picks')/(today+'.json')).read_text(encoding='utf-8'))
          got=json.loads(Path('production-morning.json').read_text(encoding='utf-8'))
          if want != got:
              raise SystemExit('Production morning archive differs from published immutable JSON')
          print('PRODUCTION_MORNING_PICKS_OK',today,'races',len(got['races']),'selected',sum(bool(x['selected']) for x in got['races']),'special',sum(bool(x['special']) for x in got['races']))
          PY
