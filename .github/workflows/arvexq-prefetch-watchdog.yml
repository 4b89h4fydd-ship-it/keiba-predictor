name: ARVEXQ Same-Day Prefetch Watchdog

# Same-day issuance used to depend solely on arvexq-prefetch.yml's own
# scheduled slots. On 2026-11-04 and again on 2026-11-24 the GitHub
# scheduler dropped every morning slot (last run 00:52 JST), so no
# forecasts were issued until a human dispatched the workflow by hand
# hours later. This watchdog mirrors the Day-Ahead Dispatch pattern:
# three independent cadences (relevant pushes to main, completions of
# the Realtime Sync workflow, and its own 20-minute schedule) check
# whether the Full Prefetch workflow has run recently, and dispatch
# one (today, JST) when it has gone quiet during racing hours.
# A 45-minute throttle plus an in-flight check keep at most one
# watchdog-dispatched prefetch going at a time. Nothing about
# collection, protect or freeze semantics changes.
#
# Day-ahead coverage (added 2026-11-24, user-approved): the same
# scheduler starvation also dropped the 17:05 JST day-ahead slot on
# 2026-11-24, and the dedicated Day-Ahead Dispatcher's own schedule
# was starved all afternoon while its workflow_run triggers landed on
# non-success conclusions and skipped. So this watchdog also checks,
# from noon JST onward, whether tomorrow's static day pack exists yet
# and dispatches a collection-only prefetch (date = tomorrow) when it
# does not, throttled the same way. The Day-Ahead Dispatcher workflow
# stays in place as an additional layer; nothing about it changes.
#
# Same-day pack-missing handling (2026-11-25, collection-circuit
# audit S1): the same-day step used to read a missing/empty day pack
# as "no racing today" and exit. The day pack is the prefetch lane's
# own output, so when pack generation itself is what stopped, that
# reading silenced the watchdog forever. The same-day step now
# mirrors the day-ahead design: a missing or empty pack is a
# possible lane outage and falls through to the same staleness,
# in-flight and throttle checks instead of exiting.

"on":
  push:
    branches: [main]
    paths:
      - app.py
      - scripts/arvexq_prefetch.py
      - scripts/arvexq_morning_picks.js
      - scripts/arvexq_merge_morning_output.py
      - scripts/arvexq_sync_batches.py
      - scripts/arvexq_fetch_d1_bundle.py
      - scripts/arvexq_protect_sync.py
      - scripts/arvexq_select_prefetch_repairs.py
      - scripts/arvexq_verify_persisted_inputs.py
      - scripts/arvexq_sqlite_health.py
      - arvexq/pipeline/fingerprints.py
      - arvexq/pipeline/persisted_inputs.py
      - arvexq/prediction/**
      - arvexq/forecast/**
      - arvexq/ingest/**
      - arvexq/databanks/**
      - .github/workflows/arvexq-prefetch.yml
      - .github/workflows/arvexq-prefetch-watchdog.yml
      # Lane data commits land every few minutes during racing hours
      # (static pack rebuilds, result ingest, odds overlays). Waking
      # on them keeps the staleness check alive even when GitHub's
      # scheduler drops both this watchdog's own slots and the
      # Realtime Sync completions its workflow_run trigger needs
      # (2026-11-27: no watchdog run at all between 09:40 and noon
      # JST while the 11:30 prefetch slot was dropped). The 45-minute
      # dispatch throttle and the in-flight check below bound how
      # often this can actually dispatch.
      - arvexq/ui/static/api-static/**
  workflow_run:
    workflows: ["ARVEXQ Realtime Sync"]
    types: [completed]
  schedule:
    # Every 20 minutes, offset from the prefetch workflow's own :30
    # slots. The steps gate themselves to JST daytime/evening hours,
    # when issuance and day-ahead collection matter; GitHub may drop
    # individual slots, but at this density several checks land
    # per hour.
    - cron: "7,27,47 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: arvexq-prefetch-watchdog
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    env:
      GH_REPO: ${{ github.repository }}
      PACK_BASE: https://raw.githubusercontent.com/4b89h4fydd-ship-it/keiba-predictor/main/arvexq/ui/static/api-static

    steps:
      - name: Dispatch today's prefetch if it has gone quiet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same-day issuance window: JST 05:00-21:59.
          HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "$HOUR" -lt 5 ] || [ "$HOUR" -gt 21 ]; then
            echo "WATCHDOG_SKIP outside-window hour=$HOUR"
            exit 0
          fi
          TODAY=$(TZ=Asia/Tokyo date +%F)
          # The day pack is the prefetch lane's OWN output, so its
          # absence cannot be read as "no racing today": when pack
          # generation itself is what stopped, that reading makes
          # the watchdog exit quietly forever (collection-circuit
          # audit S1, 2026-11-25). Mirror the day-ahead step below:
          # a missing or empty pack is treated as a possible lane
          # outage and falls through to the staleness / in-flight /
          # throttle checks; on a genuinely dark day the dispatched
          # prefetch simply collects nothing.
          COUNT=0
          FETCH=failed
          if curl -fsS --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 35 \
              "$PACK_BASE/day/$TODAY.json" -o watchdog-day.json; then
            FETCH=ok
            COUNT=$(jq '.races // [] | length' watchdog-day.json 2>/dev/null || echo 0)
          fi
          echo "WATCHDOG_CHECK date=$TODAY fetch=$FETCH races=$COUNT"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "WATCHDOG_WARN today's day pack is missing or empty (fetch=$FETCH); treating it as a possible lane outage, not as a dark day."
          fi
          # Recent prefetch activity: any event counts. If a run is in
          # flight, or one started within the last 65 minutes, the
          # normal lanes are alive. (Was 100 minutes until 2026-11-27:
          # with hourly scheduled slots, a single dropped slot plus a
          # 100-minute tolerance left issuance unsupervised for over
          # two hours.)
          RUNS=$(gh api "repos/$GH_REPO/actions/workflows/arvexq-prefetch.yml/runs?per_page=5" 2>/dev/null || echo "")
          if [ -n "$RUNS" ]; then
            INFLIGHT=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "${INFLIGHT:-0}" -gt 0 ]; then
              echo "WATCHDOG_SKIP prefetch in flight"
              exit 0
            fi
            LAST=$(echo "$RUNS" | jq -r '.workflow_runs[0].created_at // empty')
            if [ -n "$LAST" ]; then
              AGE=$(( $(date +%s) - $(date -d "$LAST" +%s) ))
              echo "WATCHDOG_LAST_RUN age_sec=$AGE"
              if [ "$AGE" -lt 3900 ]; then
                echo "Prefetch ran recently; lanes are alive."
                exit 0
              fi
            fi
          fi
          # Throttle watchdog dispatches to one per 45 minutes.
          LASTDISP=$(gh api "repos/$GH_REPO/actions/workflows/arvexq-prefetch.yml/runs?event=workflow_dispatch&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || echo "")
          if [ -n "$LASTDISP" ]; then
            DAGE=$(( $(date +%s) - $(date -d "$LASTDISP" +%s) ))
            echo "WATCHDOG_LAST_DISPATCH age_sec=$DAGE"
            if [ "$DAGE" -lt 2700 ]; then
              echo "A dispatched prefetch ran recently; throttled."
              exit 0
            fi
          fi
          gh workflow run arvexq-prefetch.yml --ref main
          echo "WATCHDOG_DISPATCHED date=$TODAY"

      - name: Dispatch tomorrow's collection if its day pack is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Day-ahead window: JST 12:00-21:59. Tomorrow's entries stand
          # up progressively through the afternoon, so before noon
          # there is nothing to collect yet.
          HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "$HOUR" -lt 12 ] || [ "$HOUR" -gt 21 ]; then
            echo "WATCHDOG_AHEAD_SKIP outside-window hour=$HOUR"
            exit 0
          fi
          TOMORROW=$(TZ=Asia/Tokyo date -d tomorrow +%F)
          # Tomorrow's day pack already published -> collection done.
          COUNT=0
          if curl -fsS --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 35 \
              "$PACK_BASE/day/$TOMORROW.json" -o watchdog-ahead.json; then
            COUNT=$(jq '.races // [] | length' watchdog-ahead.json 2>/dev/null || echo 0)
          fi
          echo "WATCHDOG_AHEAD_CHECK date=$TOMORROW races=$COUNT"
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "Tomorrow's listing is already collected; nothing to dispatch."
            exit 0
          fi
          # A prefetch run in flight may be the one collecting it.
          RUNS=$(gh api "repos/$GH_REPO/actions/workflows/arvexq-prefetch.yml/runs?per_page=5" 2>/dev/null || echo "")
          if [ -n "$RUNS" ]; then
            INFLIGHT=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "${INFLIGHT:-0}" -gt 0 ]; then
              echo "WATCHDOG_AHEAD_SKIP prefetch in flight"
              exit 0
            fi
          fi
          # Throttle: at most one dispatched prefetch (any target) per
          # 45 minutes, shared with the same-day step above.
          LASTDISP=$(gh api "repos/$GH_REPO/actions/workflows/arvexq-prefetch.yml/runs?event=workflow_dispatch&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || echo "")
          if [ -n "$LASTDISP" ]; then
            DAGE=$(( $(date +%s) - $(date -d "$LASTDISP" +%s) ))
            echo "WATCHDOG_AHEAD_LAST_DISPATCH age_sec=$DAGE"
            if [ "$DAGE" -lt 2700 ]; then
              echo "A dispatched prefetch ran recently; throttled."
              exit 0
            fi
          fi
          gh workflow run arvexq-prefetch.yml --ref main -f date="$TOMORROW"
          echo "WATCHDOG_AHEAD_DISPATCHED date=$TOMORROW"
