name: ARVEXQ One Cycle Research
"on":
  push:
    branches: [fix/arvexq-new-engine-complete-field-20261022]
    paths:
      - scripts/arvexq_one_cycle_ablation.py
      - .github/workflows/arvexq-one-cycle-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
      ARVEXQ_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing requirements
        run: python -m pip install -q -r requirements.txt pytest==9.1.1
      - name: Existing chronology safeguard
        run: PYTHONPATH=. python -m pytest -q tests/test_research_provisional_replay.py
      - name: Run complete chronological cycle and emit adoption decision
        run: PYTHONPATH=. python -u scripts/arvexq_one_cycle_ablation.py
