name: ARVEXQ New Forecast Research
on:
  pull_request:
    branches: [main]
    paths:
      - 'arvexq/forecast/race_softmax_research.py'
      - 'arvexq/forecast/frozen_research_input.py'
      - 'arvexq/forecast/preoff_capture.py'
      - 'arvexq/forecast/preoff_evidence_store.py'
      - 'arvexq/forecast/preoff_d1_transport.py'
      - 'arvexq/forecast/verified_holdout.py'
      - 'tests/test_race_softmax_research.py'
      - 'tests/test_frozen_research_input.py'
      - 'tests/test_preoff_capture_research.py'
      - 'tests/test_preoff_evidence_store.py'
      - 'tests/test_preoff_d1_transport.py'
      - 'tests/test_verified_holdout.py'
      - 'scripts/arvexq_forecast_data_audit.py'
      - '.github/workflows/arvexq-new-forecast-research.yml'
  workflow_dispatch:
jobs:
  isolated-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest beautifulsoup4
      - name: Compile isolated forecast modules
        run: python -m py_compile arvexq/forecast/race_softmax_research.py arvexq/forecast/frozen_research_input.py arvexq/forecast/preoff_capture.py arvexq/forecast/preoff_evidence_store.py arvexq/forecast/preoff_d1_transport.py arvexq/forecast/verified_holdout.py
      - name: Verify pre-off chronology and race probability contracts
        run: python -m pytest -q tests/test_race_softmax_research.py tests/test_frozen_research_input.py tests/test_preoff_capture_research.py tests/test_preoff_evidence_store.py tests/test_preoff_d1_transport.py tests/test_verified_holdout.py
      - name: Read-only dataset coverage (no performance claim)
        run: python scripts/arvexq_forecast_data_audit.py
