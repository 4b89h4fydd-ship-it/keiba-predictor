name: ARVEXQ Backtest v206

"on":
  workflow_dispatch:
    inputs:
      days:
        description: "過去何日をD1から検証するか"
        required: true
        default: "28"
        type: choice
        options:
          - "7"
          - "14"
          - "28"
          - "56"
      iterations:
        description: "候補モデル探索回数"
        required: true
        default: "2500"
        type: choice
        options:
          - "800"
          - "1500"
          - "2500"
          - "5000"
  schedule:
    # 23:45 JST. Daily D1 history grows automatically without touching production.
    - cron: "45 14 * * *"

permissions:
  contents: read

concurrency:
  group: arvexq-backtest-v206
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ARVEXQ_API_URL: https://kraiz-api.4b89h4fydd.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve backtest window
        shell: bash
        run: |
          DAYS="${{ github.event.inputs.days }}"
          ITER="${{ github.event.inputs.iterations }}"
          if [ -z "$DAYS" ]; then DAYS=28; fi
          if [ -z "$ITER" ]; then ITER=2500; fi
          echo "BACKTEST_DAYS=$DAYS" >> "$GITHUB_ENV"
          echo "BACKTEST_ITERATIONS=$ITER" >> "$GITHUB_ENV"
          echo "ARVEXQ v206: days=$DAYS iterations=$ITER"

      - name: Run leakage-guarded historical backtest
        run: |
          rm -rf backtest-v206
          python backtest_v206.py \
            --api-url "$ARVEXQ_API_URL" \
            --days "$BACKTEST_DAYS" \
            --iterations "$BACKTEST_ITERATIONS" \
            --out backtest-v206

      - name: Show report in Actions
        if: always()
        shell: bash
        run: |
          if [ -f backtest-v206/report.md ]; then
            cat backtest-v206/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# ARVEXQ v206" >> "$GITHUB_STEP_SUMMARY"
            echo "report.md was not created" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARVEXQ-v206-backtest-${{ github.run_number }}
          path: backtest-v206/
          if-no-files-found: warn
          retention-days: 30
