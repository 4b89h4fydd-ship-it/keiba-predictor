name: ARVEXQ Live Odds Static

# GitHub-native live odds (Cloudflare exit, 2026-11-23).  Replaces the
# detached relay Worker: this job runs the relay's own verified source
# fetcher (workers/live_odds.mjs sourceOdds) in Node on a schedule and
# commits each race's response body as a static JSON file under
# arvexq/ui/static/api-static/live-odds/, which build_static.py copies
# into the Pages dist wholesale.
#
# Freshness, stated plainly: the relay answered within its 30-60s
# cache; this path is bounded by the schedule + commit + Pages deploy
# cycle, i.e. minutes (typically ~5-15 min).  The feed serves only the
# research screen (research/live_odds.js); the main app never used
# the relay.  Prices are never invented: on a source failure the last
# fetched body is republished as 'saved', or an explicit 'unavailable'
# body when no fetch has ever succeeded.

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/arvexq_live_odds_static.mjs
      - workers/live_odds.mjs
      - scripts/arvexq_build_odds_sources.py
      - .github/workflows/arvexq-live-odds-static.yml
      # The VM heartbeat push (~every 10 min, 07:00-23:55 JST) is the
      # reliable cadence while GitHub's scheduler is degraded; the
      # schedule below is one layer among several, as with the other
      # lanes.
      - sync-heartbeat/heartbeat.txt
  schedule:
    - cron: "*/5 22-23 * * *"
    - cron: "*/5 0-14 * * *"

concurrency:
  group: arvexq-live-odds-static
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build verified odds-source manifests
        run: python scripts/arvexq_build_live_relay_assets.py

      - name: Generator regression (stubbed fetcher, no network)
        run: node tests/test_live_odds_static.mjs

      - name: Generate static live-odds bodies for today (JST)
        run: |
          DATE=$(TZ=Asia/Tokyo date +%F)
          node scripts/arvexq_live_odds_static.mjs \
            --manifest-dir dist-live-relay \
            --out-dir arvexq/ui/static/api-static/live-odds \
            --date "$DATE"

      - name: Commit live-odds files and dispatch Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ARVEXQ Live Odds Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arvexq/ui/static/api-static/live-odds
          if git diff --cached --quiet; then
            echo "LIVE_ODDS_STATIC_UNCHANGED"
            exit 0
          fi
          git commit -m "data: live odds static"
          done_push=0
          for try in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              done_push=1
              break
            fi
            git fetch origin main
            git -c rebase.autoStash=true pull --rebase origin main
            git add arvexq/ui/static/api-static/live-odds
            if git diff --cached --quiet && git diff origin/main --quiet -- arvexq/ui/static/api-static/live-odds; then
              done_push=1
              break
            fi
          done
          if [ "$done_push" -ne 1 ]; then
            echo "::error::Live odds files could not be published"
            exit 1
          fi
          # GITHUB_TOKEN pushes do not trigger push workflows; deploy explicitly.
          gh workflow run arvexq-pages.yml --ref main || echo "::warning::Live odds committed; Pages dispatch not accepted"
          echo "LIVE_ODDS_STATIC_PUBLISHED"
