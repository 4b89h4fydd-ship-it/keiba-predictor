name: ARVEXQ Inspect Same-Day Bias

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_inspect_sameday_bias.py'
      - '.github/workflows/arvexq-inspect-sameday-bias.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect same-day bias functions
        run: python scripts/arvexq_inspect_sameday_bias.py
