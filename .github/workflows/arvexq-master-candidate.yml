name: ARVEXQ Master Candidate Validation

"on":
  pull_request:
    branches: [main]
    paths:
      - rewrite/analysis/master_v1.py
      - tests/test_master_v1.py
      - scripts/arvexq_master_candidate.py
      - .github/workflows/arvexq-master-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: |
          python -m py_compile rewrite/analysis/master_v1.py \
            scripts/arvexq_master_candidate.py tests/test_master_v1.py
      - name: Invariant tests
        run: python -m unittest discover -s tests -p 'test_master_v1.py' -v
