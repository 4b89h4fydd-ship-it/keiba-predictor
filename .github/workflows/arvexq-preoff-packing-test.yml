name: ARVEXQ Sealed D1 Packed Transport
"on":
  pull_request:
    branches: [main]
    paths:
      - scripts/arvexq_freeze_predictions.py
      - tests/test_preoff_packed_sync.py
      - tests/test_prerace_archive.py
      - .github/workflows/arvexq-preoff-packing-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-career-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_preoff_packed_sync.py tests/test_preoff_full_d1_payload.py tests/test_preoff_d1_display_history.py
