name: ARVEXQ Inspect JRA Parser

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_inspect_jra_parser.py'
      - '.github/workflows/arvexq-inspect-jra-parser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect JRA parser blocks
        run: python scripts/arvexq_inspect_jra_parser.py
