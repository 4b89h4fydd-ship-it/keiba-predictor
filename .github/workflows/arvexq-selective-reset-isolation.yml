name: ARVEXQ Selective Reset Isolation Checks

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/arvexq-selective-reset-isolation.yml

permissions:
  contents: read

jobs:
  isolated-candidate-regressions:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: retired-forecast-removal
            checked_commit: "3a42867658bffe9ffbc7c56d2b3c9479960e7c0b"
          - lane: verified-box-boundaries
            checked_commit: "bca981af1f9f0043fce4d3f8f80df54f390bc9a3"
    env:
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Checkout exact candidate commit, not protected main
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.checked_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install existing test dependencies
        run: python -m pip install -q -r requirements.txt pytest==9.1.1
      - name: Run complete Python regression on exact SHA
        run: PYTHONPATH=.:tests python -m pytest tests -q
      - name: Confirm retired forecast candidate cannot silently run
        if: matrix.lane == 'retired-forecast-removal'
        run: |
          python -m unittest tests.test_archived_forecast_revision_retention -v
          test ! -f arvexq/prediction/new_forecast.py
          test ! -f arvexq/prediction/forecast_revisions.py
      - name: Confirm wrapped UI serves original race facts
        if: matrix.lane == 'verified-box-boundaries'
        run: |
          python build_static.py > /tmp/arvexq-selective-build.log 2>&1
          test -s dist/index.html
          node scripts/arvexq_race_source_integrity_smoke.js
