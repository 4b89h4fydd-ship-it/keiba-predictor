name: ARVEXQ Result Repair

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/arvexq_result_repair.py
      - .github/workflows/arvexq-result-repair.yml
  schedule:
    # Offset from realtime sync so both jobs do not hit result sources together.
    - cron: "2-59/5 22-23 * * *"
    - cron: "2-59/5 0-14 * * *"

concurrency:
  group: arvexq-result-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-data
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      NAR_ON_DEMAND_HISTORY_MONTHS: "12"
      ARVEXQ_RESULT_WORKERS: "6"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Set sync date
        run: echo "SYNC_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"

      - name: Restore warm cache read-only
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-result-readonly-${{ runner.os }}-${{ env.SYNC_DATE }}-${{ github.run_id }}
          restore-keys: |
            arvexq-prefetch-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-

      - name: Read current day from D1
        run: |
          curl --fail-with-body --max-time 20 \
            "$CLOUDFLARE_API_BASE/api/day?date=$SYNC_DATE" \
            -o bundle.json
          RACES=$(jq '.races // [] | length' bundle.json)
          DETAILS=$(jq '.details // [] | length' bundle.json)
          echo "D1 day races=$RACES details=$DETAILS"

      - name: Repair all started incomplete results
        run: |
          if ! python scripts/arvexq_result_repair.py \
            --bundle bundle.json \
            --payload result-repair-payload.json \
            --report result-repair-report.json > result-repair.log 2>&1; then
            echo "::error::Result repair failed"
            tail -n 80 result-repair.log || true
            exit 1
          fi
          jq '{date,started,pending_before,repairedCount:(.repaired|length),resultMissing:(.result_missing|length),payoutMissing:(.payout_missing|length)}' result-repair-report.json

      - name: Push repaired full-detail snapshots to D1
        run: |
          STARTED=$(jq '.meta.started_race_count // 0' result-repair-payload.json)
          if [ "$STARTED" -le 0 ]; then
            echo "No started races; skip sync."
            exit 0
          fi
          curl --fail-with-body --max-time 30 -X POST \
            "$CLOUDFLARE_API_BASE/api/sync" \
            -H "content-type: application/json" \
            -H "x-sync-token: $SYNC_TOKEN" \
            --data-binary @result-repair-payload.json > /dev/null
          echo "D1 result repair push OK"

      - name: Verify D1 after repair
        run: |
          curl --fail-with-body --max-time 20 \
            "$CLOUDFLARE_API_BASE/api/day?date=$SYNC_DATE" \
            -o verified-day.json
          python - <<'PY'
          import json
          from pathlib import Path

          day=json.loads(Path('verified-day.json').read_text(encoding='utf-8'))
          report=json.loads(Path('result-repair-report.json').read_text(encoding='utf-8'))
          by_id={str(d.get('id') or ''):d for d in (day.get('details') or []) if isinstance(d,dict)}
          missing=[]
          for rid in report.get('repaired') or []:
              result=(by_id.get(str(rid)) or {}).get('result') or {}
              ranks={int(x.get('finish') or 0) for x in (result.get('finishers') or []) if isinstance(x,dict)}
              if str(result.get('status') or '')!='確定' or not all(i in ranks for i in (1,2,3)):
                  missing.append(rid)
          print('D1_VERIFY repaired=',len(report.get('repaired') or []),'not_visible=',len(missing),'result_missing=',len(report.get('result_missing') or []),'payout_missing=',len(report.get('payout_missing') or []))
          if missing:
              raise SystemExit('D1 did not expose repaired result(s): '+','.join(missing))
          PY

      - name: Show concise failure log
        if: failure()
        run: tail -n 80 result-repair.log 2>/dev/null || true

      - name: Upload full failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-result-repair-failure-${{ github.run_number }}
          path: |
            result-repair.log
            result-repair-report.json
          if-no-files-found: ignore
          retention-days: 3
