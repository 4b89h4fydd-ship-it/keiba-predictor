name: ARVEXQ Locked Head Comparison

on:
  push:
    branches: [main]
    paths:
      - scripts/arvexq_locked_head_comparison.py
      - .github/workflows/arvexq-locked-head-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ARVEXQ_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      ARVEXQ_DAYS: '7'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate only immutable preoff heads versus official finish
        run: |
          python -m py_compile scripts/arvexq_locked_head_comparison.py
          python scripts/arvexq_locked_head_comparison.py | tee locked-head-report.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arvexq-locked-head-report
          path: locked-head-report.log
          if-no-files-found: ignore
