name: ARVEXQ Saved Role Signal Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_saved_role_signal_audit.py'
      - '.github/workflows/arvexq-saved-role-signal-audit.yml'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days'
        required: false
        default: '7'
      end_date:
        description: 'Last completed date YYYY-MM-DD'
        required: false
        default: '2026-10-05'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile scripts/arvexq_saved_role_signal_audit.py
      - name: Compare saved role signals
        env:
          ARVEXQ_API_BASE: 'https://kraiz-api.4b89h4fydd.workers.dev'
          ARVEXQ_DAYS: ${{ inputs.days || '7' }}
          ARVEXQ_END_DATE: ${{ inputs.end_date || '2026-10-05' }}
        run: python scripts/arvexq_saved_role_signal_audit.py | tee saved-role-signal-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arvexq-saved-role-signal-audit
          path: saved-role-signal-audit.log
          retention-days: 14
