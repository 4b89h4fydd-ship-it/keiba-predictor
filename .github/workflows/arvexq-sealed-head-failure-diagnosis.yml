name: Sealed Head Failure Diagnosis
on:
  push:
    branches:
      - codex/arvexq-challenger-failure-diagnostics-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen-head original regression tests
        run: python -m unittest discover -s tests -p test_sealed_conditional_challenger.py
      - name: Empirical why-worse analysis and validation-only correction gate
        run: |
          mkdir -p research-output
          PYTHONPATH=. python scripts/arvexq_sealed_head_failure_diagnosis.py --out research-output/why-worse.json
      - name: Preserve per-race root-cause evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: why-worse
          path: research-output/why-worse.json
          if-no-files-found: warn
