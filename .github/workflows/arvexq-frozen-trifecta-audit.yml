name: ARVEXQ Frozen Trifecta Audit
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Completed days to audit'
        required: false
        default: '7'
      end_date:
        description: 'Last completed day (YYYY-MM-DD)'
        required: false
        default: '2026-10-15'
  pull_request:
    paths:
      - 'scripts/arvexq_frozen_trifecta_audit.py'
      - 'tests/test_frozen_trifecta_audit.py'
      - '.github/workflows/arvexq-frozen-trifecta-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test audit invariants
        run: python -m unittest discover -s tests -p test_frozen_trifecta_audit.py -v
      - name: Measure pre-off 3連単 tickets
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/arvexq_frozen_trifecta_audit.py --days "${{ inputs.days || '7' }}" --end-date "${{ inputs.end_date || '2026-10-15' }}" --output frozen-trifecta-results.json
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: arvexq-frozen-trifecta-results
          path: frozen-trifecta-results.json
          if-no-files-found: ignore
          retention-days: 14
