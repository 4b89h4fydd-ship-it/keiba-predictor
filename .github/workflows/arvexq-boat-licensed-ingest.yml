name: ARVEXQ Licensed BOAT Data

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: 'Official race date (YYYY-MM-DD, blank=JST today)'
        required: false
        type: string
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: arvexq-licensed-boat-day
  cancel-in-progress: false

jobs:
  ingest:
    # Must be explicitly enabled after an actual commercial-use agreement.
    if: ${{ vars.ARVEXQ_BOAT_FEED_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARVEXQ_BOAT_LICENSED_FEED_URL: ${{ secrets.ARVEXQ_BOAT_LICENSED_FEED_URL }}
      ARVEXQ_BOAT_FEED_TOKEN: ${{ secrets.ARVEXQ_BOAT_FEED_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify commercial rights and ingest only the licensed normalized feed
        shell: bash
        env:
          REQUEST_DATE: ${{ inputs.race_date }}
        run: |
          set -euo pipefail
          if [ -z "$ARVEXQ_BOAT_LICENSED_FEED_URL" ]; then
            echo "::error::BOAT_LICENSED_FEED_MISSING: configure the authorized provider URL"
            exit 1
          fi
          DAY="${REQUEST_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          echo "$DAY" | grep -Eq '^20[0-9]{2}-[0-9]{2}-[0-9]{2}$'
          python scripts/arvexq_boat_ingest.py --date "$DAY"
          DATA="arvexq/ui/static/sports/boat-data/$DAY.json"
          test -s "$DATA"
          python -m unittest discover -s tests -p 'test_boat_feed_publisher.py' -v
          python -m unittest discover -s tests -p 'test_boat_licensed_ingest.py' -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATA"
          if git diff --cached --quiet; then
            echo "No new licensed BOAT observations to publish."
          else
            git commit -m "data(boat): publish verified licensed BOAT day $DAY"
            git push origin HEAD:main
            # GITHUB_TOKEN pushes do not automatically trigger standard push workflows.
            gh workflow run arvexq-web-deploy.yml --ref main
          fi
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Prove the licensed racing day was published to production
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(sha256sum "$DATA" | cut -d' ' -f1)"
          URL="https://kraizweb1.4b89h4fydd.workers.dev/sports/boat-data/$DAY.json"
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$URL?proof=$GITHUB_RUN_ID-$attempt" -o production-boat.json; then
              ACTUAL="$(sha256sum production-boat.json | cut -d' ' -f1)"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "LICENSED_BOAT_PRODUCTION_VERIFIED day=$DAY sha256=$ACTUAL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Licensed BOAT production JSON differs from canonical published input"
          exit 1
