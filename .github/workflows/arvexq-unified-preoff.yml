name: ARVEXQ Unified Preoff Production

"on":
  push:
    branches: [main]
    paths:
      - scripts/arvexq_unified_preoff.py
      - scripts/arvexq_unified_production_smoke.cjs
      - scripts/arvexq_unified_frontend_smoke.cjs
      - arvexq/prediction/unified_product.py
      - arvexq/prediction/empirical_fusion.py
      - arvexq/prediction/fusion_source_composer.py
      - arvexq/prediction/fusion_historical_replay.py
      - arvexq/prediction/fusion_method_models.py
      - arvexq/prediction/fusion_ai_models.py
      - scripts/arvexq_apply_learned_overlay.py
      - scripts/arvexq_protect_sync.py
      - .github/workflows/arvexq-unified-preoff.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/arvexq_unified_preoff.py
      - scripts/arvexq_unified_production_smoke.cjs
      - scripts/arvexq_unified_frontend_smoke.cjs
      - arvexq/prediction/unified_product.py
      - arvexq/prediction/empirical_fusion.py
      - arvexq/prediction/fusion_source_composer.py
      - arvexq/prediction/fusion_historical_replay.py
      - arvexq/prediction/fusion_method_models.py
      - arvexq/prediction/fusion_ai_models.py
      - scripts/arvexq_apply_learned_overlay.py
      - scripts/arvexq_protect_sync.py
      - .github/workflows/arvexq-unified-preoff.yml
  workflow_dispatch:
    inputs:
      date:
        description: "Today or tomorrow (JST, YYYY-MM-DD)"
        required: false
        type: string
  schedule:
    # 06:05, 10:05, 13:05 JST same-day; 20:05 JST next-day.
    - cron: "05 21,1,4,11 * * *"

permissions:
  contents: read

concurrency:
  group: arvexq-unified-forecasts
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      PYTHONPATH: ".:tests"
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install established forecasting runtime
        run: python -m pip install -q -r requirements.txt pytest
      - name: Validate actual JRA/NAR unified forecasts and D1 preservation
        run: python -m pytest tests/test_unified_live_product.py -q
      - name: Validate exact iPhone production adapter
        run: node scripts/arvexq_unified_frontend_smoke.cjs
      - name: Read D1 and calculate next prospective races; PR never writes
        env:
          REQUESTED_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/arvexq_unified_preoff.py ${REQUESTED_DATE:+--date "$REQUESTED_DATE"} \
              --output unified-preoff-report.json
          else
            python scripts/arvexq_unified_preoff.py ${REQUESTED_DATE:+--date "$REQUESTED_DATE"} \
              --output unified-preoff-report.json --publish
          fi
      - name: Check exact live D1-to-iPhone marks and ticket display after publication
        if: github.event_name != 'pull_request'
        run: node scripts/arvexq_unified_production_smoke.cjs unified-preoff-report.json
      - name: Archive counts and missing evidence, not full paid forecasts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-unified-preoff-${{ github.run_id }}
          path: unified-preoff-report.json
          retention-days: 7
          if-no-files-found: warn
