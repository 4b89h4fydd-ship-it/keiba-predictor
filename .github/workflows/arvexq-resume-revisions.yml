name: ARVEXQ Resume Existing Revision Publish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arvexq-resume-revisions.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: arvexq-verified-artifact-resume
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      ARVEXQ_DATA_CORE: '0'
      ARVEXQ_BOOTSTRAP_WARM: '0'
      RACEDB_AUTO_UPDATE: '0'
      PYTHONPATH: .
      SOURCE_RUN: '39754739813'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stop only the known stale pre-write rebuild before independent resumption
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];run_id=39754938100
          base='https://api.github.com/repos/'+repo
          def read(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          run=read('/actions/runs/'+str(run_id))
          assert run.get('head_sha')=='58fe22a56f4246a2953c01b855071e9daf2090d6','UNRECOGNIZED_STALE_RUN'
          jobs=read('/actions/runs/'+str(run_id)+'/jobs').get('jobs') or []
          unsafe={'Check D1 capacity and add only new revision tables',
                  'Publish all revisions and verify every saved revision by reloading API',
                  'Catch up races saved during recalculation and verify the complete current roster'}
          assert not any(step['name'] in unsafe and step['status']!='pending' and step.get('conclusion')!='skipped'
                         for job in jobs for step in job.get('steps') or []),'STALE_RUN_MAY_HAVE_WRITTEN_DB'
          if run['status']!='completed':
              subprocess.run(['gh','run','cancel',str(run_id)],check=True)
              for _ in range(45):
                  status=read('/actions/runs/'+str(run_id))
                  if status['status']=='completed':break
                  time.sleep(2)
              else:raise SystemExit('STALE_RUN_NOT_CANCELLED')
              assert status['conclusion']=='cancelled','STALE_RUN_NOT_SAFELY_CANCELLED'
          else:
              assert run['conclusion'] in ('cancelled','failure'),'OLDER_RUN_ALREADY_PUBLISHED'
          print('STALE_PREWRITE_RUN_SAFE_TO_REPLACE',run_id)
          PY
      - name: Require exact main and verified CI / deployed Web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def read(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          sha=os.environ['GITHUB_SHA']
          assert read('/branches/main')['commit']['sha']==sha,'MAIN_MOVED_REFUSING_PUBLICATION'
          import time
          required={'ARVEXQ Validation','ARVEXQ Recovery Regression','ARVEXQ Web Deploy','ARVEXQ API Private Storage Audit Deploy'}
          for _ in range(240):
              runs=read('/actions/runs?head_sha='+sha+'&per_page=100')['workflow_runs']
              passed={r['name'] for r in runs if r['conclusion']=='success' and r['head_branch']=='main'}
              if required<=passed:break
              time.sleep(5)
          else:raise SystemExit('EXACT_MAIN_CI_OR_COMPRESSION_API_NOT_READY')
          assert read('/branches/main')['commit']['sha']==sha,'MAIN_MOVED_REFUSING_PUBLICATION'
          print('EXACT_MAIN_ALL_CI_AND_COMPRESSION_API_PASSED',sha)
          PY
      - name: Download already rebuilt official-history revisions and its source backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/forecast-revisions /tmp/revision-source-artifact
          gh run download "$SOURCE_RUN" -n "saved-forecast-revisions-and-readback-$SOURCE_RUN" -D /tmp/forecast-revisions
          gh run download "$SOURCE_RUN" -n "saved-forecast-original-backup-$SOURCE_RUN" -D /tmp/revision-source-artifact
          find /tmp/forecast-revisions -maxdepth 2 -type f -printf '%p %s bytes\n'
          find /tmp/revision-source-artifact -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -s /tmp/forecast-revisions/revisions.sqlite3
          test -s /tmp/forecast-revisions/rebuild-summary.json
          test -s /tmp/revision-source-artifact/arvexq-complete-d1.sqlite3.gz
          gzip -dc /tmp/revision-source-artifact/arvexq-complete-d1.sqlite3.gz > /tmp/revision-original-source.sqlite3
      - name: Check precomputed revisions against their original immutable backup
        run: |
          python - <<'PY'
          import json,sqlite3,hashlib
          report=json.load(open('/tmp/forecast-revisions/rebuild-summary.json'))
          assert report['allSavedRebuilt'] and not report['errors']
          with sqlite3.connect('/tmp/revision-original-source.sqlite3') as source,sqlite3.connect('/tmp/forecast-revisions/revisions.sqlite3') as revisions:
              count=source.execute('SELECT COUNT(*) FROM race_details').fetchone()[0]
              rows=revisions.execute('SELECT race_id,payload_json,payload_sha256 FROM revisions').fetchall()
              assert count==report['targetRaces']==report['revisions']==len(rows)
              assert all(hashlib.sha256(raw.encode()).hexdigest()==digest for _,raw,digest in rows),'IMMUTABLE_REVISION_CHECKSUM_MISMATCH'
          print('REBUILT_REVISIONS_VERIFIED',count,report['statuses'])
          PY
      - name: Fresh live D1 logical backup, with independent restore verification
        run: python -u scripts/arvexq_backup_live_d1.py
      - name: Preserve verified fresh rollback backup before any compression writes
        run: |
          python - <<'PYBACKUP'
          import gzip,shutil,json
          summary=json.load(open('/tmp/arvexq-complete-d1-summary.json'))
          assert summary['restore_verified'] and summary['original_sql_writes']==0
          with open('/tmp/arvexq-complete-d1.sqlite3','rb') as src,gzip.open('/tmp/arvexq-complete-d1.sqlite3.gz','wb',compresslevel=9) as dst:shutil.copyfileobj(src,dst)
          PYBACKUP
      - uses: actions/upload-artifact@v4
        with:
          name: original-before-lossless-compression-${{ github.run_id }}
          path: |
            /tmp/arvexq-complete-d1.sqlite3.gz
            /tmp/arvexq-complete-d1-summary.json
          retention-days: 30
      - name: Recalculate changed and added inputs with the existing verified model and official archives
        run: python -u scripts/arvexq_resume_forecast_inputs.py
      - name: Measure D1 capacity on a disposable copy before any production writes
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from scripts.arvexq_rebuild_saved_forecasts import capacity_preview
          base='https://kraiz-api.4b89h4fydd.workers.dev'
          def request(path,data=None):
              req=urllib.request.Request(base+path,data=data,headers={'Authorization':'Bearer '+os.environ['SYNC_TOKEN'],'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as res:return json.load(res)
          ready=request('/api/forecast-revisions/__readiness__')
          assert ready.get('storageEncoding')=='arvexq-storage-gzip-v1','COMPRESSED_API_REQUIRED'
          audit=request('/api/admin/storage-audit')
          assert audit['ok'] and audit['sql_writes']==0
          d=audit['queries'];page_size=d['page_size'];size=page_size['results'][0]['page_size']
          counted=d.get('page_count') or {}
          used=(counted['results'][0]['page_count']*size if counted.get('results') else (page_size.get('meta') or {}).get('size_after'))
          assert type(used) is int and used>0,'UNVERIFIED_LIVE_CAPACITY'
          preview=capacity_preview('/tmp/arvexq-complete-d1.sqlite3','/tmp/forecast-revisions/revisions.sqlite3','/tmp/revision-resume-capacity-preview.sqlite3')
          assert preview['originalsUnchanged'] and preview['revisionRows']>0
          print('CAPACITY_VERIFIED',json.dumps({'used':used,'required':preview['additionalBytes'],'revisions':preview['revisionRows']}),flush=True)
          assert used+preview['additionalBytes']*1.2+20000000<500000000,'INSUFFICIENT_VERIFIED_D1_HEADROOM'
          result=request('/api/admin/forecast-revisions/migrate',b'{}')
          assert result.get('ok') and result.get('original_tables_modified') is False
          print('EXISTING_REVISION_SCHEMA_MIGRATED_WITH_ORIGINALS_UNCHANGED')
          PY
      - name: Compress every eligible remaining original through the existing guarded interface and restore each one
        run: python -u scripts/arvexq_compress_saved_snapshots.py
      - name: Publish existing revisions and read every one back
        run: |
          python - <<'PY'
          import os
          from scripts.arvexq_rebuild_saved_forecasts import publish
          report=publish('/tmp/forecast-revisions/revisions.sqlite3','https://kraiz-api.4b89h4fydd.workers.dev',os.environ['SYNC_TOKEN'])
          print(report,flush=True)
          assert report['allPublished'] and not report['failures'],'REVISION_PUBLISH_READBACK_FAILED'
          PY
      - name: Verify complete current saved roster has published revisions
        run: |
          python - <<'PYROSTER'
          import json,os,sqlite3,urllib.request
          from pathlib import Path
          request=urllib.request.Request('https://kraiz-api.4b89h4fydd.workers.dev/api/admin/snapshot-export',headers={'Authorization':'Bearer '+os.environ['SYNC_TOKEN'],'User-Agent':'Mozilla/5.0 ARVEXQ-ReadOnlyAudit/1.0'})
          with urllib.request.urlopen(request,timeout=60) as response:manifest=json.load(response)
          assert manifest['ok'] and manifest['sql_writes']==0
          current={row['race_id'] for row in manifest['races']}
          with sqlite3.connect('/tmp/forecast-revisions/revisions.sqlite3') as db:known={row[0] for row in db.execute('SELECT race_id FROM revisions')}
          report={'allCurrentSavedRacesUpdated':current<=known,'currentSavedRaces':len(current),'missingRaceIds':sorted(current-known)}
          Path('/tmp/forecast-revisions/all-current-saved-verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('COMPLETE_CURRENT_ROSTER_VERIFICATION',report)
          assert report['allCurrentSavedRacesUpdated'],'NEW_RACES_REQUIRE_EXISTING_REBUILD_CATCHUP'
          PYROSTER
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-revision-resume-${{ github.run_id }}
          path: |
            /tmp/forecast-revisions/rebuild-summary.json
            /tmp/forecast-revisions/revisions.sqlite3.publish.json
            /tmp/forecast-revisions/source-comparison.json
            /tmp/forecast-revisions/all-current-saved-verification.json
            /tmp/forecast-revisions/original-compression-report.json
            /tmp/forecast-revisions/revisions.sqlite3
            /tmp/forecast-revisions/revisions-original.sqlite3
            /tmp/forecast-revisions/rebuild-original-summary.json
            /tmp/arvexq-complete-d1-summary.json
          retention-days: 30
