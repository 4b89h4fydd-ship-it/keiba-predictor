name: ARVEXQ Official Finish App Path Tests
"on":
  push:
    branches: [fix/arvexq-new-engine-complete-field-20261022]
    paths:
      - arvexq/databanks/legacy_bridge.py
      - arvexq/ingest/full_career.py
      - arvexq/ingest/fallback_enrichment.py
      - tests/test_nar_official_historical_result.py
      - .github/workflows/arvexq-official-finish-app-path-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt pytest==9.1.1
      - name: Official finish recovery and prior-run date regression
        run: PYTHONPATH=. python -m pytest -q tests/test_nar_official_historical_result.py tests/test_replay_history_chronology.py tests/test_single_history_route.py
