# v329 iPhone-class race-open verification against actual Cloudflare Worker app
name: ARVEXQ Webapp Race Smoke

on:
  push:
    branches: [main]
    paths:
      - 'arvexq/ui/static/**'
      - 'build_static.py'
      - 'wrangler.toml'
      - 'app.py'
      - 'scripts/arvexq_webapp_race_smoke.js'
      - 'scripts/arvexq_bet_mobile_layout_smoke.js'
      - 'scripts/arvexq_detail_resilience_smoke.js'
      - '.github/workflows/arvexq-webapp-race-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static validation
        shell: bash
        run: |
          node --check arvexq/ui/static/app.js
          python -m py_compile build_static.py
          python build_static.py
          BUILD="$(tr -d '\r\n' < dist/build-version.txt)"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          test "$BUILD" = "v329"
          test -s dist/index.html
          test -s "dist/app-$BUILD.js"
          test -s "dist/styles-arvexq-$BUILD.css"
          test -s dist/styles/legacy_v118_v221.css
          test -s dist/styles/race_v222_plus.css
          test -s dist/morning/selection_cut.js
          test -s "dist/sw-$BUILD-reset.js"
          grep -q "/app-$BUILD.js" dist/index.html
          grep -q "/styles-arvexq-$BUILD.css" dist/index.html
          grep -q 'directory = "./dist"' wrangler.toml
          python - <<'PY'
          from pathlib import Path
          s=Path('arvexq/ui/static/app.js').read_text()
          for fn in ('courseProfile','courseStageFrac'):
              start=s.index(f'function {fn}(')
              end=s.index('\n}',start)+2
              assert 'r=r||{};' in s[start:end], fn
          assert 'window.ARVEXQ_BUILD="v329";' in s
          assert 'serviceWorker.register' not in s
          assert 'getRegistrations' in s
          print('STATIC_SAFARI_GUARDS_OK')
          PY
      - name: Home alerts and counts — positive and zero cases
        shell: bash
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const src=fs.readFileSync('arvexq/ui/static/app.js','utf8');
          const styles=['styles.css','styles/legacy_v118_v221.css','styles/race_v222_plus.css'].map(x=>fs.readFileSync('arvexq/ui/static/'+x,'utf8')).join('\n');
          function extract(name){
            const start=src.indexOf('function '+name+'(');
            assert.ok(start>=0,'function missing '+name);
            const end=src.indexOf('\n}',start);
            assert.ok(end>start,'function end missing '+name);
            return src.slice(start,end+2);
          }
          const make=new Function('state','selectedRaceCandidates','specialForecastRaceCandidates','allTodayRacesFinished','smartLiveRaceSection','esc','selectedRaceLoadStatus','morningPickReady',
            ['homePickCounts','homePickAlert','smartHomeHub','homeCircuitChooser'].map(extract).join('\n')+
            '\nreturn {smartHomeHub,homeCircuitChooser,homePickAlert,homePickCounts};');
          const state={races:[{id:'race1',circuit:'中央'},{id:'race2',circuit:'地方'}],loading:false};
          const esc=s=>String(s);
          function harness(selected,special){
            return make(state,c=>selected.filter(x=>x.circuit===c),()=>special,()=>false,()=>'',esc,()=>({complete:true}),()=>true)
          }
          const positive=harness([{circuit:'中央'},{circuit:'地方'},{circuit:'地方'}],[{circuit:'地方'}]);
          const home=positive.smartHomeHub();
          assert.equal((home.match(/class="arv-home-alert"/g)||[]).length,2);
          const chooser=positive.homeCircuitChooser('厳選レース','selected');
          assert.match(chooser,/中央/);assert.match(chooser,/地方/);
          assert.match(chooser,/>1件</);assert.match(chooser,/>2件</);
          assert.equal((chooser.match(/class="arv-pick-count"/g)||[]).length,2);
          assert.match(positive.homeCircuitChooser('特別予想','special'),/>1件</);
          assert.equal((harness([],[]).smartHomeHub().match(/class="arv-home-alert"/g)||[]).length,0);
          state.races=[];
          const loading=harness([],[]).homeCircuitChooser('厳選レース','selected');
          assert.equal((loading.match(/class="arv-pick-count"/g)||[]).length,2);
          assert.match(loading,/取得中/);
          assert.match(styles,/color:#ff354f!important/);
          console.log('HOME_ALERT_POSITIVE_ZERO_AND_COUNTS_PASS');
          NODE
      - name: Edge API diagnostic
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          base='https://kraiz-api.4b89h4fydd.workers.dev'
          frontend='https://kraizweb1.4b89h4fydd.workers.dev'
          headers={
              'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1',
              'Accept':'application/json,text/plain,*/*',
              'Origin':frontend,
              'Referer':frontend+'/'
          }
          def read_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as r:
                  print('HTTP',r.status,url)
                  return json.load(r)
          race=None
          for back in range(0,4):
              day=(datetime.now(ZoneInfo('Asia/Tokyo')).date()-timedelta(days=back)).isoformat()
              body=read_json(f'{base}/api/day?date={day}&details=0')
              rows=body if isinstance(body,list) else body.get('races',[])
              if rows:
                  race=rows[0]
                  break
          assert race and race.get('id'), 'edge day API returned no selectable race'
          rid=race['id']
          detail=read_json(f'{base}/api/race/{urllib.parse.quote(str(rid),safe="")}')
          d=detail.get('detail') if isinstance(detail,dict) else None
          assert d, f'edge race API missing detail for {rid}'
          horses=d.get('horses') or []
          finishers=((d.get('result') or {}).get('finishers') or [])
          assert horses or finishers, f'edge race API has neither horses nor result for {rid}'
          print('EDGE_RACE_OK',rid,'horses',len(horses),'finishers',len(finishers))
          PY
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium webkit
      - name: Offline iPhone AI-bet header and horizontal-clipping regression
        run: |
          node --check scripts/arvexq_bet_mobile_layout_smoke.js
          node scripts/arvexq_bet_mobile_layout_smoke.js
      - name: Production top red alert and circuit-count navigation
        shell: bash
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const {chromium,webkit,devices}=require('playwright');
          const app=fs.readFileSync('arvexq/ui/static/app.js','utf8');
          const css=['styles.css','styles/legacy_v118_v221.css','styles/race_v222_plus.css'].map(x=>fs.readFileSync('arvexq/ui/static/'+x,'utf8')).join('\n');
          const index=fs.readFileSync('arvexq/ui/static/index.html','utf8');
          const marker=index.match(/var tag="(arvexq-hard-reset-[^"]+)"/);
          assert.ok(marker,'missing hard-reset version marker');
          ['function homePickCounts(kind)','function homePickAlert(counts)','homePickAlert(selectedCounts)','homePickAlert(specialCounts)','class="arv-pick-count"'].forEach(term=>assert.ok(app.includes(term),'missing '+term));
          assert.ok(css.includes('.arv-home-hub-btn .arv-home-alert'));
          const base='https://kraizweb1.4b89h4fydd.workers.dev';
          async function check(type,name){
            const browser=await type.launch({headless:true});
            try{
              const page=await browser.newPage({...devices['iPhone 15 Pro'],locale:'ja-JP'});
              // The initial PWA migration intentionally reloads a fresh browser.
              // Seed its current marker so UI navigation tests do not race it.
              await page.addInitScript(k=>{try{localStorage.setItem(k,'1')}catch(_){}},marker[1]);
              const failures=[];
              page.on('pageerror',e=>failures.push(String(e)));
              const root=base+'/?home-check='+Date.now()+'-'+name;
              await page.goto(root,{waitUntil:'domcontentloaded',timeout:45000});
              const homes=page.locator('button[data-home-page="selected"],button[data-home-page="special"]');
              await homes.first().waitFor({state:'visible',timeout:45000});
              assert.equal(await homes.count(),2,'top buttons missing');
              for(const kind of ['selected','special']){
                await page.goto(root+'&kind='+kind,{waitUntil:'domcontentloaded',timeout:45000});
                const trigger=page.locator('button[data-home-page="'+kind+'"]');
                await trigger.waitFor({state:'visible',timeout:45000});
                const markers=trigger.locator('.arv-home-alert');
                assert.ok((await markers.count())<=1,'duplicate red alert');
                if(await markers.count()){
                  assert.equal((await markers.innerText()).trim(),'!');
                  assert.ok((await markers.evaluate(el=>getComputedStyle(el).color)).includes('255'),'alert not red');
                }
                await trigger.click();
                await page.locator('.arv-pick-circuit-page').waitFor({state:'visible',timeout:20000});
                const circuits=page.locator('button.arv-pick-circuit-btn');
                const count=await circuits.count();
                assert.equal(count,2,'central and local must always show counts, including when loading');
                if(count===2){
                  assert.deepEqual(await circuits.locator('b').allInnerTexts(),['中央','地方']);
                  const totals=await circuits.locator('em.arv-pick-count').allInnerTexts();
                  assert.equal(totals.length,2,'missing counts');
                  totals.forEach(t=>assert.ok(/^\d+件$/.test(t),'invalid count '+t));
                  await circuits.first().click();
                  try{
                    await page.locator('.arv-direct-picks').waitFor({state:'visible',timeout:12000});
                  }catch(err){
                    // Identify whether iPhone WebKit has dropped a navigation,
                    // encountered a runtime exception, or been rerendered by
                    // the asynchronous day/race snapshot update.
                    const diagnostic=await page.evaluate(()=>({
                      selected:!!document.querySelector('.arv-direct-picks'),
                      circuitChooser:!!document.querySelector('.arv-pick-circuit-page'),
                      heading:(document.querySelector('h1,h2,.smart-topbar')||{}).innerText||'',
                      buttons:[...document.querySelectorAll('[data-pick-circuit]')].map(el=>el.getAttribute('data-pick-circuit')),
                      url:location.href,
                    }));
                    console.log('HOME_PICK_NAV_DIAGNOSTIC '+name+' '+kind,JSON.stringify(diagnostic),
                      'errors='+JSON.stringify(failures.slice(-8)));
                    throw err;
                  }
                }
                console.log('HOME_PICK_'+kind.toUpperCase()+'_PASS '+name+' circuits='+count);
              }
              const fatal=failures.filter(e=>/Cannot read properties of undefined|ReferenceError|SyntaxError/i.test(e));
              assert.equal(fatal.length,0,'runtime errors: '+fatal.join('; '));
              await page.close();
            } finally {await browser.close()}
          }
          (async()=>{await check(chromium,'chromium');await check(webkit,'webkit')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Offline race detail resilience
        run: node scripts/arvexq_detail_resilience_smoke.js
      - name: Verify Cloudflare Worker production v329
        if: always()
        shell: bash
        run: |
          PROD='https://kraizweb1.4b89h4fydd.workers.dev'
          ok=0
          for i in $(seq 1 48); do
            headers="$(mktemp)"
            body="$(mktemp)"
            if curl -fsS --max-time 12 -D "$headers" -o "$body" -H 'Cache-Control: no-cache' "$PROD/?ci=$GITHUB_SHA-$i"; then
              ctype="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)"
              echo "production root attempt $i: ${ctype:-<no-content-type>}"
              if grep -qi 'text/html' "$headers" && grep -qi '<html' "$body" && ! grep -q '"service":"KRAIZ API"' "$body"; then
                version="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' "$PROD/version.json?ci=$GITHUB_SHA-$i" 2>/dev/null || true)"
                echo "production version attempt $i: ${version:-<no-response>}"
                if printf '%s' "$version" | grep -q '"build":"v329"'; then ok=1; break; fi
              else
                echo 'ERROR: production root is not the ARVEXQ HTML app'
                head -c 300 "$body" || true
                echo
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "PROD_BASE=$PROD" >> "$GITHUB_ENV"
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$PROD/app-v329.js?ci=$GITHUB_SHA" >/tmp/prod-app.js
          grep -q 'function courseProfile(r)' /tmp/prod-app.js
          grep -A3 'function courseProfile(r)' /tmp/prod-app.js | grep -q 'r=r||{}'
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$PROD/sw-v329-reset.js?ci=$GITHUB_SHA" >/tmp/prod-sw.js
          test -s /tmp/prod-sw.js
      - name: Production Chromium click smoke
        if: ${{ always() && env.PROD_BASE != '' }}
        id: prod_chromium
        shell: bash
        run: |
          ARVEXQ_BASE_URL="$PROD_BASE" ARVEXQ_SMOKE_TIMEOUT=30000 ARVEXQ_BROWSER=chromium node scripts/arvexq_webapp_race_smoke.js
      - name: Production WebKit Safari click smoke
        if: ${{ always() && env.PROD_BASE != '' }}
        shell: bash
        run: |
          test -n "$PROD_BASE"
          ARVEXQ_BASE_URL="$PROD_BASE" ARVEXQ_SMOKE_TIMEOUT=30000 ARVEXQ_BROWSER=webkit node scripts/arvexq_webapp_race_smoke.js
      - name: Start local built web app
        if: always()
        shell: bash
        run: |
          python -m http.server 8788 --directory dist >/tmp/arvexq-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8788/version.json && break; sleep 1; done
          curl -fsS "http://127.0.0.1:8788/sw-$BUILD-reset.js" >/tmp/current-sw.js
          test -s /tmp/current-sw.js
      - name: Local Chromium diagnostic
        if: always()
        continue-on-error: true
        env:
          ARVEXQ_BASE_URL: http://127.0.0.1:8788
          ARVEXQ_SMOKE_TIMEOUT: '12000'
          ARVEXQ_BROWSER: chromium
        run: node scripts/arvexq_webapp_race_smoke.js
      - name: Local WebKit diagnostic
        if: always()
        continue-on-error: true
        env:
          ARVEXQ_BASE_URL: http://127.0.0.1:8788
          ARVEXQ_SMOKE_TIMEOUT: '12000'
          ARVEXQ_BROWSER: webkit
        run: node scripts/arvexq_webapp_race_smoke.js
