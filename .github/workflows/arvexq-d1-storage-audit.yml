name: ARVEXQ D1 Read-only Capacity Audit

"on":
  workflow_dispatch:
    inputs:
      plan:
        description: "Cloudflare Workers plan; unknown reports both limits"
        required: false
        type: choice
        options: [unknown, free, paid]
        default: unknown
  push:
    branches: [main]
    paths:
      - scripts/arvexq_d1_storage_audit.py
      - .github/workflows/arvexq-d1-storage-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARVEXQ_D1_DATABASE_NAME: ${{ vars.ARVEXQ_D1_DATABASE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect D1 storage through Cloudflare read API
        env:
          REQUESTED_PLAN: ${{ inputs.plan }}
        run: |
          python scripts/arvexq_d1_storage_audit.py --out d1-storage-audit.json --plan "${REQUESTED_PLAN:-unknown}"
      - name: Save read-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-readonly-d1-storage
          path: d1-storage-audit.json
          if-no-files-found: ignore
          retention-days: 7
