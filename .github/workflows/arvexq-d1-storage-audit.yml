name: ARVEXQ D1 Read-only Capacity Audit

"on":
  workflow_dispatch:
    inputs:
      credential:
        description: "Existing credential used only for read requests"
        required: false
        type: choice
        options: [readonly, deploy]
        default: readonly
      plan:
        description: "Cloudflare Workers plan; unknown reports both limits"
        required: false
        type: choice
        options: [unknown, free, paid]
        default: unknown

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ inputs.credential == 'deploy' && secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_D1_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARVEXQ_D1_DATABASE_NAME: ${{ vars.ARVEXQ_D1_DATABASE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve missing Cloudflare account ID without exposing tokens
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "D1_AUDIT_ACCOUNT_ID_CONFIGURED"
            exit 0
          fi
          # With one authorized account Wrangler can discover the ID safely.
          # Refuse ambiguous multi-account selection instead of guessing.
          npx --yes wrangler@4 whoami --json > /tmp/arvexq-wrangler-whoami.json 2>/dev/null || {
            echo "::error::D1_AUDIT_ACCOUNT_DISCOVERY_UNAVAILABLE"
            exit 2
          }
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          doc=json.loads(Path("/tmp/arvexq-wrangler-whoami.json").read_text())
          accounts=doc.get("accounts") or []
          if len(accounts)!=1:
              raise SystemExit("D1_AUDIT_ACCOUNT_ID_REQUIRED: expected one accessible account; found "+str(len(accounts)))
          account=accounts[0].get("id") or ""
          if not re.fullmatch(r"[0-9a-f]{32}",account):
              raise SystemExit("D1_AUDIT_INVALID_ACCOUNT_ID")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write("CLOUDFLARE_ACCOUNT_ID="+account+"\n")
          print("D1_AUDIT_ACCOUNT_ID_RESOLVED (value not logged)")
          PY
          rm -f /tmp/arvexq-wrangler-whoami.json
      - name: Locate separate API Worker using read-only metadata
        run: |
          python - <<'PYCODE'
          import os,json,hashlib,urllib.request,urllib.error
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/kraiz-api'
          report={'writes_performed':0,'worker':'kraiz-api'}
          for kind,suffix in [('source',''),('settings','/settings')]:
              req=urllib.request.Request(base+suffix,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data=response.read(10000000)
                      info={'http':response.status,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
                      if kind=='settings':
                          parsed=json.loads(data).get('result') or {}
                          info['bindings']=[{'name':b.get('name'),'type':b.get('type'),'database_id':b.get('id') if b.get('type')=='d1' else None} for b in parsed.get('bindings',[])]
                      report[kind]=info
              except urllib.error.HTTPError as e:
                  report[kind]={'http':e.code}
              except Exception as e:
                  report[kind]={'error_type':type(e).__name__}
          with open('api-worker-location-audit.json','w') as f:json.dump(report,f,indent=2)
          print(json.dumps(report))
          PYCODE
      - name: Inspect D1 storage through Cloudflare read API
        env:
          REQUESTED_PLAN: ${{ inputs.plan }}
        run: |
          python scripts/arvexq_d1_storage_audit.py --out d1-storage-audit.json --plan "${REQUESTED_PLAN:-unknown}"
      - name: Save read-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-readonly-d1-storage
          path: |
            d1-storage-audit.json
            api-worker-location-audit.json
          if-no-files-found: ignore
          retention-days: 7
