# Explicit rollout attempt for existing forecast-revisions API, source SHA guard enforced (2026-10-22).
name: ARVEXQ API Private Storage Audit Deploy
on:
  push:
    branches: [main]
    paths: ['workers/api*.mjs', '.github/workflows/arvexq-api-storage-deploy.yml']
  workflow_dispatch:
    inputs:
      expected_source_sha256:
        description: "SHA256 of the current production module to prevent overwriting other changes"
        type: string
        default: "901b08e119a1b8e71b2b29cb4dc1e1ad4043601dd90f0cacf5bc4cd055a427ca"
      verify_only:
        description: "Verify the deployed API without redeploying"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 || '901b08e119a1b8e71b2b29cb4dc1e1ad4043601dd90f0cacf5bc4cd055a427ca' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify private read-only route and preserved original handlers
        run: |
          node scripts/arvexq_api_storage_smoke.mjs
          node scripts/arvexq_forecast_revision_api_smoke.mjs
          node scripts/arvexq_full_snapshot_smoke.mjs
          node scripts/arvexq_api_chunk_export_smoke.mjs
          python -m unittest tests.test_full_snapshot_codec
      - name: Reuse verified existing forecast revisions interface
        # A main push changing Worker modules must deploy the new source, even
        # when the old API already responds to the revisions readiness route.
        if: ${{ !inputs.verify_only && github.event_name != 'push' }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          base='https://kraiz-api.4b89h4fydd.workers.dev'
          try:
              req=urllib.request.Request(base+'/api/forecast-revisions/__readiness__',headers={
                  'User-Agent':'Mozilla/5.0 ARVEXQ-ReadOnlyAudit/1.0',
                  'Accept':'application/json','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:forecast=json.load(r)
          except (OSError,ValueError) as exc:
              print('PREEXISTING_REVISION_API_NOT_READY',type(exc).__name__,getattr(exc,'code',None))
          else:
              if (forecast.get('ok') is True and
                  forecast.get('raceId')=='__readiness__' and
                  isinstance(forecast.get('forecastRevisions'),list) and
                  forecast.get('storageEncoding')=='arvexq-storage-gzip-v1'):
                  with open(os.environ['GITHUB_ENV'],'a') as file:
                      file.write('ARVEXQ_API_ALREADY_READY=1'+chr(10))
                  print('PREEXISTING_REVISION_API_READBACK_VERIFIED_SKIP_REDEPLOY')
          PY
      - name: Discover authorized account without logging credentials
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then exit 0; fi
          npx --yes wrangler@4 whoami --json > /tmp/arvexq-whoami.json
          python - <<'PY'
          import os,json,re
          accounts=json.load(open('/tmp/arvexq-whoami.json'))['accounts']
          assert len(accounts)==1
          account=accounts[0]['id'];assert re.fullmatch('[a-f0-9]{32}',account)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CLOUDFLARE_ACCOUNT_ID='+account+'\n')
          PY
      - name: Guard production source and preserve original compatibility settings
        if: ${{ !inputs.verify_only && env.ARVEXQ_API_ALREADY_READY != '1' }}
        run: |
          python - <<'PY'
          import os,json,hashlib,urllib.request,re
          from pathlib import Path
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/kraiz-api'
          def read(suffix):
              req=urllib.request.Request(base+suffix,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'User-Agent':'Mozilla/5.0 ARVEXQ-Deploy/1.0'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  content=response.read()
                  if not suffix:
                      print('API_SOURCE_TRANSPORT',json.dumps({'content_type':response.headers.get('content-type',''),'bytes':len(content),'prefix_hex':content[:12].hex()}))
                  return content
          raw=read('');boundary=raw.split(b'\r\n',1)[0]
          modules=[]
          for part in raw.split(boundary):
              separator=b'\r\n\r\n'
              if separator not in part:
                  continue
              header,body=part.split(separator,1)
              # Cloudflare multipart modules may use `name="module.js"`
              # without any `filename=` attribute. Exclude metadata JSON.
              lower=header.lower()
              if not (b'filename=' in lower or b'javascript' in lower or b'.js' in lower):
                  continue
              modules.append((header,body.rstrip(b'\r\n-')))
          if not modules and raw.startswith(b'--'):
              print('API_SOURCE_PART_HEADERS',[part.split(b'\r\n\r\n',1)[0][:220].decode('latin1','replace') for part in raw.split(boundary) if b'\r\n\r\n' in part][:12])
          if modules:
              source=b'\n'.join(body for header,body in sorted(modules,key=lambda item:item[0]))
          else:
              # Cloudflare can return a single-module JS body rather than multipart.
              # Keep the exact SHA guard below; never accept an API error as source.
              assert len(raw)>1000 and (b'export default' in raw or b'addEventListener(' in raw), 'API_JAVASCRIPT_MODULES_NOT_FOUND'
              source=raw
          print('LIVE_API_MODULE_AUDIT',json.dumps([
              {'header':header[:140].decode('latin1','replace'),
               'length':len(body),'sha256':hashlib.sha256(body).hexdigest()}
              for header,body in modules
          ]))
          from pathlib import Path
          for header,body in modules:
              if b'.js.map' not in header:continue
              try:source_map=json.loads(body)
              except Exception:continue
              report=[]
              for source_name,contents in zip(source_map.get('sources') or [],source_map.get('sourcesContent') or []):
                  name=str(source_name).replace('webpack:///','').replace('../','')
                  path=Path(name)
                  local=path.read_bytes() if path.is_file() else None
                  report.append({'name':name,'sourceSHA':hashlib.sha256(str(contents).encode()).hexdigest(),
                      'inRepo':local is not None,'repoSHA':hashlib.sha256(local).hexdigest() if local else None,
                      'exactMatch':local is not None and local==str(contents).encode()})
              print('LIVE_API_SOURCEMAP_COMPARISON',json.dumps(report))
              for source_name,contents in zip(source_map.get('sources') or [],source_map.get('sourcesContent') or []):
                  statements=[line[:200] for line in str(contents).splitlines()
                              if any(q in line for q in ('import ', 'export ', 'async fetch(', 'fetch(request', 'new URL(', 'url.pathname', 'api/'))]
                  print('LIVE_API_MODULE_ENTRY_POINTS',json.dumps({'name':source_name,'lines':statements[:32]}))
          expected=os.environ['EXPECTED_SOURCE_SHA256'];assert re.fullmatch('[a-f0-9]{64}',expected)
          actual=hashlib.sha256(source).hexdigest()
          preserve_live=False
          # When the live API contains modules not represented by this repository's
          # original static worker, never overwrite those modules with api.mjs.
          # Preserve the verified deployed module source verbatim and wrap ONLY
          # the pre-existing authenticated forecast-revision and audit routes.
          # Current production is a single Cloudflare bundle, not the older
          # six-module source-map release. Preserve its exact verified bytes.
          if actual in ('ce3fdf05cc0708a11ad4f633e7cbc008397a7870b687ab10b5f6317f8cca56cf',
                        '31cca428ec3814e58aa641779d0ead386b372e4d239aadee3547f92ee0956e79'):
              assert len(modules)==1, 'CURRENT_BUNDLE_MODULE_COUNT_CHANGED'
              assert b'worker-entry-overlay.js' in modules[0][0], 'CURRENT_BUNDLE_NAME_CHANGED'
              assert b'export default' in source or b'as default' in source, 'CURRENT_BUNDLE_DEFAULT_EXPORT_MISSING'
              directory=Path('.arvexq-production-overlay');directory.mkdir(exist_ok=True)
              (directory/'preserved-live-worker.mjs').write_bytes(source)
              for name in ('api_forecast_revisions.mjs','api_storage_audit.mjs',
                           'api_snapshot_export.mjs','api_full_snapshot.mjs'):
                  (directory/name).write_bytes((Path('workers')/name).read_bytes())
              # Only explicitly named existing APIs are added; the exact current
              # deployed Worker continues handling every other request.
              (directory/'worker-entry-overlay.mjs').write_text("""
          import liveWorker from './preserved-live-worker.mjs';
          import {forecastRevisions} from './api_forecast_revisions.mjs';
          import {storageAudit} from './api_storage_audit.mjs';
          import {snapshotExport} from './api_snapshot_export.mjs';
          import {compressStoredSnapshot} from './api_full_snapshot.mjs';
          export default {async fetch(request,env,ctx){
            const path=new URL(request.url).pathname;
            if(path.startsWith('/api/forecast-revisions/') ||
               path.startsWith('/api/admin/forecast-revisions'))return forecastRevisions(request,env);
            if(path==='/api/admin/storage-audit')return storageAudit(request,env);
            if(path==='/api/admin/snapshot-export')return snapshotExport(request,env);
            if(path==='/api/admin/snapshot-compress')return compressStoredSnapshot(request,env);
            return liveWorker.fetch(request,env,ctx);
          }};
                    """,encoding='utf-8')
              (directory/'original-worker-source.multipart').write_bytes(raw)
              preserve_live=True
              print('CURRENT_BUNDLED_API_PRESERVATION_VERIFIED',actual,'source_bytes',len(source))
          elif actual!='901b08e119a1b8e71b2b29cb4dc1e1ad4043601dd90f0cacf5bc4cd055a427ca':
              assert actual=='a0566c29acc986a1804a17b01b91fa0afde2fe70111f6483cfc3a216f18fd6ba', (
                  'API_SOURCE_CHANGED_REFUSING_OVERWRITE actual='+actual)
              expected_modules={
                  'public-race.js':'f81dab64911b72d945d955f114f00ccd564d5c5702a3dec6bc64275904f5a22a',
                  'preoff-evidence.js':'9deb56069d931d8f20334d7977fc4973a72de537d3543f503a6feebaab9a0308',
                  'history-preservation.js':'bb4065ddd7cd3769b92dd34a3b9a5919708f5efa2d2a4de1c20a4f314d7f3c60',
                  'worker.js':'c30a63da4f93150dc758764020fded26d23617c98d6c9a699d423e462f4a462a',
                  'racecard.js':'e24cd6cd2c186fc9a0f45c897e448388e34e3402f85fc626dac215be7d8ed8b7',
                  'worker-entry.js':'9332e1ef6ea5d7a91d27ee583eba12c2982812682232facba6c0d37ba529b036'}
              from pathlib import Path
              maps=[json.loads(body) for header,body in modules if b'worker-entry.js.map' in header]
              assert len(maps)==1,'CURRENT_DEPLOYED_SOURCEMAP_MISSING'
              live=dict(zip(maps[0].get('sources') or [],maps[0].get('sourcesContent') or []))
              assert set(live)==set(expected_modules),'LIVE_WORKER_MODULE_SET_CHANGED'
              directory=Path('.arvexq-production-overlay');directory.mkdir(exist_ok=True)
              for name,digest in expected_modules.items():
                  original=live[name].encode('utf-8')
                  assert hashlib.sha256(original).hexdigest()==digest,'LIVE_MODULE_CHANGED '+name
                  (directory/name).write_bytes(original)
              for name in ('api_forecast_revisions.mjs','api_storage_audit.mjs',
                           'api_snapshot_export.mjs','api_full_snapshot.mjs'):
                  (directory/name).write_bytes((Path('workers')/name).read_bytes())
              # Additive wrapper: every other live route executes its deployed
              # handler byte-for-byte. No use of outdated GitHub legacy worker.
              (directory/'worker-entry-overlay.mjs').write_text("""
          import liveWorker from './worker-entry.js';
          import {forecastRevisions} from './api_forecast_revisions.mjs';
          import {storageAudit} from './api_storage_audit.mjs';
          import {snapshotExport} from './api_snapshot_export.mjs';
          import {compressStoredSnapshot} from './api_full_snapshot.mjs';
          export default {async fetch(request,env,ctx){
            const path=new URL(request.url).pathname;
            if(path.startsWith('/api/forecast-revisions/') ||
               path.startsWith('/api/admin/forecast-revisions'))return forecastRevisions(request,env);
            if(path==='/api/admin/storage-audit')return storageAudit(request,env);
            if(path==='/api/admin/snapshot-export')return snapshotExport(request,env);
            if(path==='/api/admin/snapshot-compress')return compressStoredSnapshot(request,env);
            return liveWorker.fetch(request,env,ctx);
          }};
                    """,encoding='utf-8')
              (directory/'original-worker-source.multipart').write_bytes(raw)
              preserve_live=True
              print('LIVE_API_PRESERVATION_VERIFIED',actual,'modules',len(expected_modules))
          else:
              assert actual==expected,'API_SOURCE_CHANGED_REFUSING_OVERWRITE'

          settings=json.loads(read('/settings'))['result']
          binding=next(b for b in settings['bindings'] if b['name']=='DB')
          assert binding['type']=='d1' and binding['id']=='c68ca1ac-357a-4c1f-81ce-0b6337716809'
          date=settings['compatibility_date'];assert re.fullmatch(r'\d{4}-\d{2}-\d{2}',date)
          cfg=Path('wrangler-api.toml');text=cfg.read_text();text=text.replace('compatibility_date = "2026-09-29"','compatibility_date = '+json.dumps(date))
          if preserve_live:
              text=text.replace('main = "workers/api.mjs"',
                                'main = ".arvexq-production-overlay/worker-entry-overlay.mjs"')
          flags=settings.get('compatibility_flags') or []
          if flags:text=text.replace('keep_vars = true','compatibility_flags = '+json.dumps(flags)+'\nkeep_vars = true')
          cfg.write_text(text)
          print('API_ORIGINAL_SOURCE_GUARD_PASS',hashlib.sha256(source).hexdigest(),'DB_BINDING_PRESERVED')
          PY
      - name: Check syntax of exact live-preserving API overlay
        if: ${{ !inputs.verify_only && env.ARVEXQ_API_ALREADY_READY != '1' }}
        run: |
          if [ -f .arvexq-production-overlay/worker-entry-overlay.mjs ]; then
            node --check .arvexq-production-overlay/worker-entry-overlay.mjs
          fi
      - name: Archive deployed API before additive route activation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-api-before-revision-overlay-${{ github.run_id }}
          path: .arvexq-production-overlay/original-worker-source.multipart
          retention-days: 14
          if-no-files-found: ignore
      - name: Deploy preserved API with private fixed-SQL metrics route
        if: ${{ !inputs.verify_only && env.ARVEXQ_API_ALREADY_READY != '1' }}
        run: npx --yes wrangler@4 deploy --config wrangler-api.toml
      - name: Verify original API and read private storage metrics
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,time
          base='https://kraiz-api.4b89h4fydd.workers.dev'
          def load(request):
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(request,timeout=45) as response:return json.load(response)
                  except urllib.error.HTTPError as e:
                      if e.code not in (403,404,503) or attempt==11:
                          print('AUDIT_HTTP_FAILURE',e.code,e.read(500).decode('utf-8','replace'))
                          raise
                      time.sleep(2)
          headers={'User-Agent':'Mozilla/5.0 ARVEXQ-ReadOnlyAudit/1.0','Accept':'application/json'}
          health=load(urllib.request.Request(base+'/api/health',headers=headers))
          assert health.get('ok') and health.get('service')=='KRAIZ API'
          req=urllib.request.Request(base+'/api/admin/storage-audit',headers={**headers,'Authorization':'Bearer '+os.environ['SYNC_TOKEN']})
          for attempt in range(15):
              ready=load(urllib.request.Request(base+'/api/forecast-revisions/__readiness__?deployment='+os.environ['GITHUB_SHA']+'&attempt='+str(attempt),headers={**headers,'Cache-Control':'no-cache'}))
              if ready.get('storageEncoding')=='arvexq-storage-gzip-v1':break
              time.sleep(2)
          else:raise SystemExit('COMPRESSED_REVISION_API_NOT_DEPLOYED')
          metrics=load(req)
          assert metrics.get('ok') and metrics.get('sql_writes')==0
          with open('api-private-storage-audit.json','w') as f:json.dump(metrics,f,indent=2)
          print('API_HEALTH_AND_READONLY_STORAGE_PASS',json.dumps(metrics))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arvexq-api-private-storage-audit
          path: api-private-storage-audit.json
          if-no-files-found: ignore
