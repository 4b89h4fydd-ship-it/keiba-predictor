name: ARVEXQ JRA Class Challenger

on:
  push:
    branches: [main]
    paths:
      - 'arvexq/prediction/jra_class_evidence.py'
      - 'scripts/arvexq_jra_class_challenger.py'
      - '.github/workflows/arvexq-jra-class-challenger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile arvexq/prediction/jra_class_evidence.py scripts/arvexq_jra_class_challenger.py
      - name: Run JRA class challenger
        env:
          PYTHONPATH: '.'
          ARVEXQ_API_BASE: 'https://kraiz-api.4b89h4fydd.workers.dev'
          ARVEXQ_DAYS: '7'
          ARVEXQ_END_DATE: '2026-10-05'
        run: python scripts/arvexq_jra_class_challenger.py | tee jra-class-challenger.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arvexq-jra-class-challenger
          path: jra-class-challenger.log
          if-no-files-found: error
          retention-days: 14
