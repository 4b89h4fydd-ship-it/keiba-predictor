# GitHub Pages delivery for the ARVEXQ app (GitHub-only migration, block B).
#
# Manual dispatch only until the production cutover is decided: the Workers
# deploy (arvexq-web-deploy.yml) remains the live route meanwhile, so the two
# never fight over production. After cutover, add a push trigger on main for
# the same paths as arvexq-web-deploy.yml.
#
# One-time setup (repository Settings -> Pages): set Source to
# "GitHub Actions". Until that is done, deploy-pages fails fast and nothing
# is published.
name: ARVEXQ Pages Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arvexq-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gate production on regression and independent module contracts
        env:
          ARVEXQ_DATA_CORE: '0'
          ARVEXQ_BOOTSTRAP_WARM: '0'
          RACEDB_AUTO_UPDATE: '0'
          PYTHONPATH: '.:tests'
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest tests -q
          node scripts/arvexq_production_boundaries_smoke.cjs
          python scripts/arvexq_independence_audit.py
      - name: Build static app
        shell: bash
        env:
          # Project-site subpath: without this the generated HTML and
          # the app's fetch builders use origin-root absolute paths,
          # which 404 under https://<owner>.github.io/keiba-predictor/.
          ARVEXQ_BASE_PATH: '/keiba-predictor/'
        run: |
          python build_static.py
          test -s dist/index.html
          test -s dist/version.json
          grep -qi '<html' dist/index.html
          grep -q 'window.ARVEXQ_BASE_PATH="/keiba-predictor/";' dist/index.html
          grep -q 'src="/keiba-predictor/app-' dist/index.html
      - name: Assert published site stays under the GitHub Pages 1GB limit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path("dist")
          total = sum(p.stat().st_size for p in dist.rglob("*") if p.is_file())
          snap = Path("dist/saved-snapshots")
          snap_total = (
              sum(p.stat().st_size for p in snap.rglob("*") if p.is_file())
              if snap.is_dir()
              else 0
          )
          print(f"dist total: {total} bytes ({total / 1048576:.1f} MiB)")
          print(
              "dist saved-snapshots: "
              f"{snap_total} bytes ({snap_total / 1048576:.1f} MiB)"
          )
          limit = 1024 * 1024 * 1024
          assert total < limit, (
              f"dist is {total} bytes, over the GitHub Pages 1GB limit; "
              "shrink the snapshot window (ARVEXQ_SNAPSHOT_WINDOW_DAYS) "
              "or move more archives out of the published site"
          )
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
