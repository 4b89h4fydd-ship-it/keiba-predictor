name: ARVEXQ Auto Refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_patch_app.py'
      - 'arvexq/**/*.py'
      - '.github/workflows/arvexq-auto-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch monolithic app boundary
        run: python scripts/arvexq_patch_app.py
      - name: Compile check
        run: |
          python -m py_compile app.py
          python -m compileall -q arvexq
      - name: Commit patch
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app.py changes needed'
            exit 0
          fi
          git config user.name 'arvexq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git commit -m 'refactor: route app through modular services'
          git push
