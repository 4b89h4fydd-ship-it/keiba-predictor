name: ARVEXQ Auto Refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_patch_app.py'
      - 'scripts/arvexq_extract_ui.py'
      - 'scripts/arvexq_extract_backend.py'
      - 'scripts/arvexq_patch_build_static.py'
      - 'scripts/arvexq_wire_core_marks.py'
      - 'build_static.py'
      - 'arvexq/**/*.py'
      - '.github/workflows/arvexq-auto-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Map remaining backend blocks
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('app.py').read_text(encoding='utf-8')
          lines = src.splitlines(keepends=True)
          tree = ast.parse(src)
          ranked = []
          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  continue
              start = node.lineno
              end = node.end_lineno or start
              segment = ''.join(lines[start-1:end])
              refs = set()
              locals_ = {a.arg for a in getattr(getattr(node, 'args', None), 'args', [])}
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Name) and isinstance(sub.ctx, ast.Load) and sub.id not in locals_:
                      refs.add(sub.id)
              ranked.append((len(segment.encode('utf-8')), end-start+1, len(refs), getattr(node, 'name', '?'), start, end))
          ranked.sort(reverse=True)
          print(f'app.py bytes={len(src.encode("utf-8")):,} lines={len(lines):,}')
          print('bytes\tlines\trefs\tname\trange')
          for size, span, refs, name, start, end in ranked[:80]:
              print(f'{size}\t{span}\t{refs}\t{name}\t{start}-{end}')
          PY
      - name: Patch app boundary
        run: python scripts/arvexq_patch_app.py
      - name: Extract backend role blocks
        run: python scripts/arvexq_extract_backend.py
      - name: Wire ability-record final marks
        run: python scripts/arvexq_wire_core_marks.py
      - name: Extract embedded UI and images
        run: python scripts/arvexq_extract_ui.py
      - name: Patch static builder for extracted assets
        run: python scripts/arvexq_patch_build_static.py
      - name: Compile check
        run: |
          python -m py_compile app.py build_static.py scripts/arvexq_patch_build_static.py scripts/arvexq_extract_backend.py scripts/arvexq_wire_core_marks.py
          python -m compileall -q arvexq
      - name: Four pillar prediction regression check
        run: |
          python - <<'PY'
          from arvexq.prediction.final_marks import apply_core_marks

          def horse(no, finishes, speed, components=None, audit=None, research=None):
              runs=[]
              for i,fin in enumerate(finishes):
                  runs.append({'finish':fin,'fieldSize':12,'distance':1600,'track':'T','condition':'良','speedIndex':speed-i,'opponentLevel':100-i})
              ev={'mark':'旧','components':components or {}}
              if audit: ev['v218Audit']=audit
              if research: ev['researchFactors']=research
              return {'horseNumber':no,'name':f'H{no}','recentRaces':runs,'integratedEvaluation':ev}

          # Ability + record + suitability must directly determine the core order.
          detail={'distance':1600,'track':'T','condition':'良','horses':[
              horse(1,[8,8,7,9,8],70),
              horse(2,[1,2,1,2,1],105),
              horse(3,[3,3,4,2,3],92),
              horse(4,[5,4,5,4,6],82),
          ]}
          apply_core_marks(detail)
          marks={h['horseNumber']:h['integratedEvaluation']['mark'] for h in detail['horses']}
          assert marks[2]=='◎', marks
          assert marks[3]=='○', marks
          assert marks[4]=='▲', marks
          assert detail['markEngineVersion']=='arvexq-four-pillar-marks-v4'
          assert detail['predictionModelVersion']=='arvexq-four-pillar-consensus-v1'

          # Old P1/P2/P3 cannot overrule the four primary pillars.
          detail2={'distance':1600,'track':'T','condition':'良','horses':[
              horse(1,[1,1,1,2,1],110),
              horse(2,[6,7,5,6,6],75),
              horse(3,[3,3,4,2,3],92),
              horse(4,[5,4,5,4,6],82),
          ]}
          for h in detail2['horses']:
              h['integratedEvaluation']['p1Score']=999 if h['horseNumber']==2 else 0
              h['integratedEvaluation']['p2Score']=999 if h['horseNumber']==2 else 0
              h['integratedEvaluation']['p3Score']=999 if h['horseNumber']==2 else 0
          apply_core_marks(detail2)
          marks2={h['horseNumber']:h['integratedEvaluation']['mark'] for h in detail2['horses']}
          assert marks2[1]=='◎', marks2
          assert marks2[2] != '◎', marks2

          # When the four pillars are tied, pedigree/weather/draw/body/connection support must matter.
          base=[3,3,3,3,3]
          support_a={'pedigreeScore':.20,'weatherFit':.20,'drawScore':.20,'bodyWeightScore':.20,'jockeyScore':.20,'trainerScore':.20}
          support_b={'pedigreeScore':.90,'weatherFit':.90,'drawScore':.90,'bodyWeightScore':.90,'jockeyScore':.90,'trainerScore':.90}
          tied={'distance':1600,'track':'T','condition':'良','horses':[
              horse(1,base,90,support_a),
              horse(2,base,90,support_b),
          ]}
          apply_core_marks(tied)
          marks3={h['horseNumber']:h['integratedEvaluation']['mark'] for h in tied['horses']}
          assert marks3[2]=='◎', marks3
          row2=next(x for x in tied['factorRanking'] if x['horseNumber']==2)
          assert row2['supportTieBreakWins']>=1, row2

          print('four-pillar-ok',marks,marks2,marks3)
          PY
      - name: Commit modularization
        run: |
          TARGETS="app.py build_static.py arvexq/ui/static arvexq/infra/legacy_stores.py arvexq/infra/race_stores.py arvexq/domain/legacy_evaluation.py"
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'No generated modularization changes needed'
            exit 0
          fi
          git config user.name 'arvexq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'refactor: sync generated modularization'
          git push
