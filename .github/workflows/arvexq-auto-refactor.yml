name: ARVEXQ Auto Refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_patch_app.py'
      - 'scripts/arvexq_extract_ui.py'
      - 'scripts/arvexq_extract_backend.py'
      - 'scripts/arvexq_patch_mass_prerace_store.py'
      - 'scripts/arvexq_audit_legacy_learning.py'
      - 'scripts/arvexq_reconcile_prediction_paths.py'
      - 'scripts/check_prediction_app_integrity.py'
      - 'scripts/check_mass_feature_leakage.py'
      - 'scripts/check_mass_training_store.py'
      - 'scripts/export_mass_training_dataset.py'
      - 'scripts/train_mass_models.py'
      - 'scripts/arvexq_patch_build_static.py'
      - 'scripts/arvexq_wire_core_marks.py'
      - 'scripts/arvexq_apply_signal_dedup.py'
      - 'scripts/arvexq_remove_value_races.py'
      - 'scripts/arvexq_enforce_selection_policy.py'
      - 'scripts/arvexq_force_mandatory_trifecta.py'
      - 'build_static.py'
      - 'arvexq/**/*.py'
      - '.github/workflows/arvexq-auto-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Map remaining backend blocks
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('app.py').read_text(encoding='utf-8')
          lines = src.splitlines(keepends=True)
          tree = ast.parse(src)
          ranked = []
          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  continue
              start = node.lineno
              end = node.end_lineno or start
              segment = ''.join(lines[start-1:end])
              refs = set()
              locals_ = {a.arg for a in getattr(getattr(node, 'args', None), 'args', [])}
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Name) and isinstance(sub.ctx, ast.Load) and sub.id not in locals_:
                      refs.add(sub.id)
              ranked.append((len(segment.encode('utf-8')), end-start+1, len(refs), getattr(node, 'name', '?'), start, end))
          ranked.sort(reverse=True)
          print(f'app.py bytes={len(src.encode("utf-8")):,} lines={len(lines):,}')
          print('bytes\tlines\trefs\tname\trange')
          for size, span, refs, name, start, end in ranked[:80]:
              print(f'{size}\t{span}\t{refs}\t{name}\t{start}-{end}')
          PY
      - name: Audit legacy learning leakage
        run: python scripts/arvexq_audit_legacy_learning.py
      - name: Patch app boundary
        run: python scripts/arvexq_patch_app.py
      - name: Extract backend role blocks
        run: python scripts/arvexq_extract_backend.py
      - name: Wire mass pre-race snapshot bridge
        run: python scripts/arvexq_patch_mass_prerace_store.py
      - name: Wire ability-record final marks
        run: python scripts/arvexq_wire_core_marks.py
      - name: Apply deduplicated evidence families
        run: python scripts/arvexq_apply_signal_dedup.py
      - name: Extract embedded UI and images
        run: python scripts/arvexq_extract_ui.py
      - name: Remove expected value race category
        run: python scripts/arvexq_remove_value_races.py
      - name: Reconcile prediction paths and live cache behavior
        run: python scripts/arvexq_reconcile_prediction_paths.py
      - name: Patch static builder for extracted assets
        run: python scripts/arvexq_patch_build_static.py
      - name: Compile check
        run: |
          python -m py_compile app.py build_static.py scripts/arvexq_audit_legacy_learning.py scripts/arvexq_reconcile_prediction_paths.py scripts/check_prediction_app_integrity.py scripts/arvexq_enforce_selection_policy.py scripts/arvexq_force_mandatory_trifecta.py scripts/arvexq_patch_build_static.py scripts/arvexq_extract_backend.py scripts/arvexq_patch_mass_prerace_store.py scripts/check_mass_feature_leakage.py scripts/check_mass_training_store.py scripts/export_mass_training_dataset.py scripts/train_mass_models.py scripts/arvexq_wire_core_marks.py scripts/arvexq_apply_signal_dedup.py scripts/arvexq_remove_value_races.py
          python -m compileall -q arvexq
      - name: Prediction and web app integrity check
        run: |
          python scripts/check_prediction_app_integrity.py
          node --check arvexq/ui/static/app.js
          python build_static.py
          BUILD=$(tr -d '\r\n' < dist/build-version.txt)
          node --check "dist/app-${BUILD}.js"
      - name: Mass feature leakage regression check
        run: python scripts/check_mass_feature_leakage.py
      - name: Frozen mass training store regression check
        run: python scripts/check_mass_training_store.py
      - name: Four pillar prediction regression check
        run: |
          python - <<'PY'
          from arvexq.prediction.final_marks import apply_core_marks
          from arvexq.prediction.factor_model import MODEL_VERSION, SIGNAL_FAMILIES

          def horse(no, finishes, speed, components=None, audit=None, research=None):
              runs=[]
              for i,fin in enumerate(finishes):
                  runs.append({'finish':fin,'fieldSize':12,'distance':1600,'track':'T','condition':'良','speedIndex':speed-i,'opponentLevel':100-i})
              ev={'mark':'旧','components':components or {}}
              if audit: ev['v218Audit']=audit
              if research: ev['researchFactors']=research
              return {'horseNumber':no,'name':f'H{no}','recentRaces':runs,'integratedEvaluation':ev}

          detail={'distance':1600,'track':'T','condition':'良','horses':[
              horse(1,[8,8,7,9,8],70),
              horse(2,[1,2,1,2,1],105),
              horse(3,[3,3,4,2,3],92),
              horse(4,[5,4,5,4,6],82),
          ]}
          apply_core_marks(detail)
          marks={h['horseNumber']:h['integratedEvaluation']['mark'] for h in detail['horses']}
          assert marks[2]=='◎', marks
          assert marks[3]=='○', marks
          assert marks[4]=='▲', marks
          assert detail['markEngineVersion']=='arvexq-four-pillar-marks-v4'
          assert detail['predictionModelVersion']=='arvexq-four-pillar-consensus-v4'
          assert MODEL_VERSION=='arvexq-four-pillar-consensus-v4'
          assert ('record_career','record_recent') in SIGNAL_FAMILIES['record']

          detail2={'distance':1600,'track':'T','condition':'良','horses':[
              horse(1,[1,1,1,2,1],110),
              horse(2,[6,7,5,6,6],75),
              horse(3,[3,3,4,2,3],92),
              horse(4,[5,4,5,4,6],82),
          ]}
          for h in detail2['horses']:
              h['integratedEvaluation']['p1Score']=999 if h['horseNumber']==2 else 0
              h['integratedEvaluation']['p2Score']=999 if h['horseNumber']==2 else 0
              h['integratedEvaluation']['p3Score']=999 if h['horseNumber']==2 else 0
          apply_core_marks(detail2)
          marks2={h['horseNumber']:h['integratedEvaluation']['mark'] for h in detail2['horses']}
          assert marks2[1]=='◎', marks2
          assert marks2[2] != '◎', marks2

          base=[3,3,3,3,3]
          support_a={'pedigreeScore':.20,'weatherFit':.20,'drawScore':.20,'bodyWeightScore':.20,'jockeyScore':.20,'trainerScore':.20,'freshnessScore':.20}
          support_b={'pedigreeScore':.90,'weatherFit':.90,'drawScore':.90,'bodyWeightScore':.90,'jockeyScore':.90,'trainerScore':.90,'freshnessScore':.90}
          tied={'distance':1600,'track':'T','condition':'良','horses':[
              horse(1,base,90,support_a),
              horse(2,base,90,support_b),
          ]}
          apply_core_marks(tied)
          marks3={h['horseNumber']:h['integratedEvaluation']['mark'] for h in tied['horses']}
          assert marks3[2]=='◎', marks3
          row2=next(x for x in tied['factorRanking'] if x['horseNumber']==2)
          assert row2['supportTieBreakWins']>=1, row2
          assert 'evidenceFamilyCounts' in row2, row2

          before={h['horseNumber']:h['integratedEvaluation']['mark'] for h in tied['horses']}
          tied['horses'][0]['popularity']=1
          tied['horses'][1]['popularity']=12
          apply_core_marks(tied)
          after={h['horseNumber']:h['integratedEvaluation']['mark'] for h in tied['horses']}
          assert before==after,(before,after)

          print('four-pillar-v4-ok',marks,marks2,marks3,'market-independent')
          PY
      - name: Commit modularization
        run: |
          TARGETS="app.py build_static.py arvexq/ui/static arvexq/infra/legacy_stores.py arvexq/infra/race_stores.py arvexq/domain/legacy_evaluation.py arvexq/prediction/factor_model.py arvexq/prediction/multi_head.py"
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'No generated modularization changes needed'
            exit 0
          fi
          git config user.name 'arvexq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'refactor: sync generated modularization'
          git push