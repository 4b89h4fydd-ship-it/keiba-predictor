name: arvexq-rewrite-publish

# Sole forecast producer: publishes the rewrite engine's forecasts into
# production race details (see scripts/arvexq_rewrite_publish.py).
# Replaces the retired unified-preoff and prerace-freeze lanes.

on:
  push:
    # Push is the trigger that demonstrably fires even while GitHub's
    # scheduler is degraded (2026-11-04: no scheduled publish or sync
    # completions after ~14:10 JST, while every push-triggered run
    # fired). The place-EV upgrade lane dies quietly when this
    # workflow starves, so any change to the publish script or the
    # engine packages it runs also serves as a publish attempt for
    # today + tomorrow. Publishing is idempotent and serialized by
    # the concurrency group below.
    branches: [main]
    paths:
      - scripts/arvexq_rewrite_publish.py
      - arvexq/prediction/**
      - arvexq/forecast/**
      - .github/workflows/arvexq-rewrite-publish.yml
      - rewrite/data/v8_extras/**
      # Landing a date's collected netkeiba materials is also a
      # publish attempt: the nk-materials adjustment (and its
      # one-time upgrade of races frozen without it) can only
      # fire once the materials file is on main.
      - rewrite/data/nk_materials/**
  schedule:
    # Hourly :05, JST 06:05-20:05 (UTC 21:05 prev day - 11:05)
    - cron: "05 0-11,21-23 * * *"
    # Extra evening runs :35, JST 17:35-20:35 (UTC 08:35-11:35)
    - cron: "35 8-11 * * *"
  workflow_run:
    # Redundant trigger: GitHub has dropped this workflow's scheduled
    # runs for hours at a time (only 2 runs ever recorded; the last a
    # schedule success at 2026-10-28 19:25 JST, while other
    # workflows' schedules kept firing). Full Prefetch completes many
    # times a day right after writing the facts this publish consumes,
    # so follow every one of its completions instead of relying on
    # the schedule alone. Runs with no date input (today + tomorrow
    # JST), same as a schedule run.
    # Realtime Sync completions are followed for the same reason:
    # the place-EV upgrade can only fire after a sync lands full
    # place coverage, official place odds stand only ~60-100 min
    # before post, and the upgrade guard closes at post-60min — an
    # hourly schedule alone structurally loses that race (2026-11-04
    # morning: several mid-card races missed exactly this way).
    workflows: ["ARVEXQ Full Prefetch", "ARVEXQ Realtime Sync"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD); empty = today and tomorrow JST"
        required: false
        type: string

permissions:
  # contents: write is for the migration block A static pack step below
  # (it commits only arvexq/ui/static/api-static packs, like the other
  # lanes' static publishers); the publish step itself stays read-only
  # against the repository.
  contents: write

# Serialize this workflow's own runs: a schedule run and a
# workflow_run follow-up (or two follow-ups from back-to-back
# prefetch completions) must never publish at the same moment.
# Queued runs wait rather than being cancelled; the publish itself
# is idempotent and skips races that have already started.
concurrency:
  group: arvexq-rewrite-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish rewrite forecasts
        run: |
          set -o pipefail
          # GitHub-only local mode (2026-11-27): this step used to run
          # the publish script against the D1-backed production API.
          # That API was retired with the Cloudflare exit and the D1
          # deletion (2026-11-24); it now answers HTTP 500, so the step
          # died in about a second on every run while the real
          # publishing happened in the prefetch lane.  This workflow's
          # role is the redundancy re-publish (engine/material pushes
          # and the hourly schedule): the day file is synthesized from
          # the committed packs (summaries only, no collected facts),
          # so each race is re-diagnosed from its committed pack state
          # with the committed extras/materials — the same local-input
          # mode the prefetch lane publishes with.  A date with no
          # committed day pack is skipped: its first publication
          # belongs to the prefetch / day-ahead lanes, which carry the
          # fresh collected facts.
          if [ -n "${{ inputs.date }}" ]; then
            DATES="${{ inputs.date }}"
          else
            DATES="$(TZ=Asia/Tokyo date +%F) $(TZ=Asia/Tokyo date -d tomorrow +%F)"
          fi
          : > publish-run.log
          FAILED=0
          for d in $DATES; do
            DAY="arvexq/ui/static/api-static/day/$d.json"
            if [ ! -f "$DAY" ]; then
              echo "SKIP $d: no committed day pack" | tee -a publish-run.log
              continue
            fi
            jq --arg d "$d" '{date: $d, races: (.races // []), details: []}' "$DAY" > "persisted-facts-$d.json"
            python3 scripts/arvexq_rewrite_publish.py \
              --date "$d" --local-input \
              --local-day-file "persisted-facts-$d.json" \
              --local-packs-dir arvexq/ui/static/api-static 2>&1 | tee -a publish-run.log || FAILED=1
          done
          exit $FAILED
      - name: Build static API packs from emitted publish payload (parallel, migration block A)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub-only migration block A: arvexq_rewrite_publish.py now
          # also emits rewrite-publish-payload-<date>.json holding the
          # exact details it published and verified.  Overlay each onto
          # the committed packs, in parallel with the D1 POST above
          # (which stays untouched).  Fail-soft: helper exits 0.
          for f in rewrite-publish-payload-*.json; do
            [ -s "$f" ] || continue
            bash scripts/arvexq_static_api_lane_publish.sh "$f" merge
          done
          git checkout -B publish-continue HEAD || true

      - name: Upload issued payload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-issued-payload-rewrite-${{ github.run_id }}
          path: rewrite-publish-payload-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload local sealed snapshots (fix program B receipt-verification store)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-local-snapshots-${{ github.run_number }}
          path: rewrite-publish-snapshots
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload publish audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-publish-audit-${{ github.run_number }}
          path: publish-run.log
          if-no-files-found: ignore
          retention-days: 30
