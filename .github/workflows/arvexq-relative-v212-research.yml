name: ARVEXQ Relative v212 Research

"on":
  push:
    branches: [research/recent-accuracy-20261005]
    paths:
      - research/arvexq_relative_v212.py
      - research/arvexq_ranker_v209.py
      - .github/workflows/arvexq-relative-v212-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvexq-relative-v212-research
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARVEXQ_API_URL: https://kraiz-api.4b89h4fydd.workers.dev
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install research dependencies quietly
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q numpy pandas scikit-learn lightgbm catboost

      - name: Fast preflight
        run: |
          python -m py_compile research/arvexq_relative_v212.py research/arvexq_ranker_v209.py backtest_v206.py backtest_v208_jra.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'research')
          import arvexq_relative_v212 as v
          print('PREFLIGHT OK features=',len(v.FEATURES))
          PY

      - name: Restore reusable JRA 360R seed
        id: jra-seed-cache
        uses: actions/cache@v4
        with:
          path: jra-seed
          key: arvexq-v209-jra-seed-${{ runner.os }}-${{ hashFiles('app.py', 'backtest_v206.py', 'backtest_v208_jra.py') }}

      - name: Build JRA seed only on cache miss
        if: steps.jra-seed-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf jra-seed
          mkdir -p jra-seed
          if ! python backtest_v208_jra.py \
            --days 90 \
            --max-races 360 \
            --iterations 500 \
            --workers 6 \
            --out jra-seed > jra-seed.log 2>&1; then
            echo "::error::JRA seed build failed"
            tail -n 80 jra-seed.log || true
            exit 1
          fi
          test -s jra-seed/jra-official-snapshots.json

      - name: Confirm cached JRA seed
        run: |
          test -s jra-seed/jra-official-snapshots.json
          echo "JRA seed ready; cache-hit=${{ steps.jra-seed-cache.outputs.cache-hit }}"

      - name: Run v212 dual-head walk-forward benchmark
        run: |
          if ! python research/arvexq_relative_v212.py \
            --days 28 \
            --extra-jra jra-seed/jra-official-snapshots.json \
            --out relative-v212.json > relative-v212.log 2>&1; then
            echo "::error::v212 benchmark failed"
            tail -n 80 relative-v212.log || true
            exit 1
          fi

      - name: Show concise result
        run: |
          python - <<'PY'
          import json
          z=json.load(open('relative-v212.json',encoding='utf-8'))
          print('# ARVEXQ v212 relative dual-head')
          for c,r in z['circuits'].items():
              a=r['aggregate']
              print(c,'races=',r.get('races'))
              for k in ('currentAxis','marketAxis','axisLGBPure','axisLGBBlend','axisCatPure','axisCatBlend'):
                  m=a[k]; print(f"  {k}: n={m['races']} place={m['placeRate']:.1%} win={m['winRate']:.1%}")
              for k in ('currentRank','marketRank','rankLGBPure','rankLGBBlend','rankCatPure','rankCatBlend'):
                  m=a[k]; print(f"  {k}: n={m['races']} top1={m['top1']:.1%} top3={m['top3']:.1%} mrr={m['mrr']:.3f}")
          PY

      - name: Show concise failure log
        if: failure()
        run: |
          tail -n 80 relative-v212.log 2>/dev/null || true
          tail -n 80 jra-seed.log 2>/dev/null || true

      - name: Upload v212 research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-relative-v212
          path: |
            relative-v212.json
            relative-v212.log
          if-no-files-found: ignore
          retention-days: 7
