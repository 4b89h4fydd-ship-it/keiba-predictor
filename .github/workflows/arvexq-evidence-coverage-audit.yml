name: ARVEXQ Evidence Coverage Audit
on:
  push:
    branches: [codex/arvexq-data-quality-root-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_preoff_coverage_audit.py -v
      - run: python scripts/arvexq_preoff_coverage_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-coverage
          path: research-output/data-quality.json
