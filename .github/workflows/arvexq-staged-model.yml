name: Staged No Sectional Model
on:
  push:
    branches: [codex/arvexq-two-axis-staged-model]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m unittest discover -s tests -p test_staged_no_sectional_model.py -v
      - run: python -m unittest discover -s tests -p test_three_factor_unified.py -v
      - run: python -m unittest discover -s tests -p test_optional_star_marks.py -v
      - run: python -m unittest discover -s tests -p test_browser_engine_parity.py -v
      - run: node --check arvexq/ui/static/app.js
      - run: node scripts/arvexq_staged_evidence_tier_smoke.js
      - run: node scripts/arvexq_frozen_marks_smoke.js
      - run: node scripts/arvexq_capture_three_factor_smoke.js
      - run: node scripts/arvexq_three_factor_parity_smoke.js
      - run: python -m unittest discover -s tests -p test_prepost_mark_consistency.py -v
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
