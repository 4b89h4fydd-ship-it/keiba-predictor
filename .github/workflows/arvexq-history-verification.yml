name: ARVEXQ History Result Verification
on:
  pull_request:
    branches: [main]
    paths: ['scripts/arvexq_verify_history_bundle.py','tests/test_history_bundle_verifier.py','.github/workflows/arvexq-history-sync.yml','.github/workflows/arvexq-history-verification.yml']
  push:
    branches: [main]
    paths: ['scripts/arvexq_verify_history_bundle.py','.github/workflows/arvexq-history-sync.yml','.github/workflows/arvexq-history-verification.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dead heats, real missing data and immutable input regressions
        run: python -m unittest tests.test_history_bundle_verifier -v
      - name: Re-read both previously failing D1 races without writes
        run: |
          PYTHONPATH=. python - <<'PY'
          import json,urllib.request,urllib.parse
          from pathlib import Path
          from scripts.arvexq_verify_history_bundle import verify_history
          rows=[]
          for rid in ['nar-2026-03-20-佐賀-07','nar-2026-03-20-帯広ば-05']:
              url='https://kraiz-api.4b89h4fydd.workers.dev/api/race/'+urllib.parse.quote(rid)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ARVEXQ-verification/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=35) as response:payload=json.load(response)
              d=payload['detail'];assert d['id']==rid
              rows.append(d)
              result=d['result']
              print(rid,'official finish ranks',[x['finish'] for x in result['finishers']],'payouts',len(result['payouts']))
          verdict=verify_history({'races':2},{'details':rows})
          Path('deadheat-verdict.json').write_text(json.dumps(verdict,ensure_ascii=False,indent=2))
          assert verdict['ok'],verdict
          print('D1_DEADHEAT_READONLY_VERIFIED',json.dumps(verdict))
          PY
      - name: Compare saved NAR original careers with D1 full details, read-only
        run: |
          PYTHONPATH=. python - <<'PY'
          import base64, gzip, hashlib, json, re, urllib.parse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from arvexq.pipeline.persisted_inputs import _career_rows, _runners, _history_observations_retained
          from scripts.arvexq_fetch_d1_bundle import get_json, detail_from_response
          
          day="2026-10-16"
          root=Path("arvexq/ui/static/saved-snapshots")
          manifest=json.loads((root/(day+".json")).read_text(encoding="utf-8"))
          if manifest.get("version")!="arvexq-saved-snapshots-v1" or manifest.get("date")!=day:
              raise ValueError("saved snapshot manifest mismatch")
          originals={}
          for rid,ref in sorted(manifest["races"].items()):
              sha=str(ref.get("sha256") or "")
              if not re.fullmatch(r"[0-9a-f]{64}",sha) or ref.get("file")!=sha+".json":
                  raise ValueError("saved snapshot reference invalid "+rid)
              envelope=json.loads((root/ref["file"]).read_text(encoding="utf-8"))
              if envelope.get("sha256")!=sha or envelope.get("version")!="arvexq-saved-snapshot-v1":
                  raise ValueError("saved snapshot envelope invalid "+rid)
              raw=gzip.decompress(base64.b64decode(envelope["gzipBase64"],validate=True))
              if len(raw)!=ref.get("bytes") or hashlib.sha256(raw).hexdigest()!=sha:
                  raise ValueError("saved snapshot hash/length invalid "+rid)
              detail=json.loads(raw)
              if detail.get("id")!=rid or detail.get("date")!=day or not isinstance(detail.get("horses"),list):
                  raise ValueError("saved snapshot race identity invalid "+rid)
              originals[rid]=detail
          
          base="https://kraiz-api.4b89h4fydd.workers.dev"
          day_response=get_json(base+"/api/day?date="+day+"&details=0",timeout=30,retries=3)
          day_ids={str(v.get("id")) for v in day_response.get("races",[]) if isinstance(v,dict)}
          def fetch(rid):
              url=base+"/api/race/"+urllib.parse.quote(rid,safe="")+"?audit=readonly"
              try:
                  response=get_json(url,timeout=35,retries=3)
                  if response.get("ok") is False:raise RuntimeError("API returned not-ok")
                  detail=detail_from_response(response,rid)
                  if not detail or detail.get("date")!=day:raise ValueError("D1 detail missing or wrong date")
                  return rid,detail,""
              except Exception as exc:
                  return rid,None,type(exc).__name__  # never expose URLs or response bodies
          
          d1={}
          errors={}
          with ThreadPoolExecutor(max_workers=3) as ex:
              for future in as_completed({ex.submit(fetch,rid):rid for rid in originals}):
                  rid,detail,error=future.result()
                  if detail is None:errors[rid]=error
                  else:d1[rid]=detail
          
          horses=[]
          for rid,original in originals.items():
              before=_runners(original)
              after=_runners(d1[rid]) if rid in d1 else {}
              for no,h in before.items():
                  matched=after.get(no)
                  identity_valid=bool(matched and re.sub(r"\s+","",str(matched.get("name") or ""))==re.sub(r"\s+","",str(h.get("name") or "")))
                  before_error=after_error=""
                  try: before_runs=_career_rows(h,day)
                  except Exception as exc: before_runs=[];before_error=type(exc).__name__
                  try: after_runs=_career_rows(matched,day) if identity_valid else []
                  except Exception as exc: after_runs=[];after_error=type(exc).__name__
                  lost=bool(before_runs and identity_valid and
                            (len(before_runs)>len(after_runs) or not _history_observations_retained(before_runs,after_runs)))
                  horses.append({"raceId":rid,"horseNumber":no,"name":h.get("name"),
                      "originalPastRuns":len(before_runs),"d1PastRuns":len(after_runs) if identity_valid else None,
                      "originalDebutFlag":bool(h.get("debutNoHistory")),
                      "d1DebutFlag":bool(matched.get("debutNoHistory")) if identity_valid else None,
                      "identityMatched":identity_valid,"d1Available":rid in d1,
                      "originalArchiveError":before_error,"d1ArchiveError":after_error,
                      "lostSourceRuns":lost})
          summary={"version":"arvexq-existing-saved-snapshot-d1-readonly-audit-v1",
              "date":day,"writes":0,"archivedRaces":len(originals),
              "d1DaySummaryRaces":len(day_ids),"archivedRacesMissingD1DaySummary":sorted(set(originals)-day_ids),
              "d1DetailsRead":len(d1),"d1DetailReadErrors":errors,"archivedHorses":len(horses),
              "originalHorsesWithHistory":sum(x["originalPastRuns"]>0 for x in horses),
              "originalHorsesWithoutHistory":sum(x["originalPastRuns"]==0 for x in horses),
              "d1HorsesWithHistory":sum((x["d1PastRuns"] or 0)>0 for x in horses),
              "d1HorsesWithoutHistory":sum(x["d1PastRuns"]==0 for x in horses if x["d1PastRuns"] is not None),
              "originalDebutFlags":sum(x["originalDebutFlag"] for x in horses),
              "d1DebutFlags":sum(x["d1DebutFlag"] is True for x in horses),
              "identityMismatch":sum(not x["identityMatched"] for x in horses if x["d1Available"]),
              "lostSavedObservations":sum(x["lostSourceRuns"] for x in horses),
              "sourceArchiveErrors":sum(bool(x["originalArchiveError"]) for x in horses),
              "d1ArchiveErrors":sum(bool(x["d1ArchiveError"]) for x in horses)}
          zero=[x for x in horses if x["originalPastRuns"]==0]
          for item in zero:
              source=_runners(originals[item["raceId"]]).get(item["horseNumber"],{})
              audit=source.get("_careerHistoryAudit") or {}
              stats=source.get("careerStartEvidence") or source.get("careerStats") or {}
              src_meta=(originals[item["raceId"]].get("preparedMeta") or {}).get("supplementalSearch") or {}
              item["sourceHistoryEvidence"]={
                  "age":source.get("age"),"sex":source.get("sex"),
                  "auditStatus":audit.get("status"),"auditComplete":audit.get("complete"),
                  "reportedStarts":audit.get("reportedStarts"),
                  "fetchAttempted":audit.get("fetchAttempted"),
                  "evidenceAttempted":audit.get("evidenceAttempted"),
                  "providersAttempted":audit.get("providersAttempted"),
                  "failedProviders":audit.get("failedProviders"),
                  "failedEvidenceProviders":audit.get("failedEvidenceProviders"),
                  "sourceTotal":stats.get("starts"),
                  "sourceKind":stats.get("source"),
                  "supplementalFailures":len(src_meta.get("failures") or [])
              }
              item["otherArchiveEvidence"]=[]
          targets={}
          for item in zero:
              targets.setdefault(str(item["name"]),[]).append(item)
          
          def compatible(a,b):
              for key in ("birthDate","birthday","sex","age"):
                  x,y=a.get(key),b.get(key)
                  if x not in (None,"",0) and y not in (None,"",0) and str(x)!=str(y):
                      return False
              return True
          
          other_files=sorted(root.glob("2026-10-*.json"))
          other_archives_read=0
          # The repository's other hash-verified originals also contain JRA.
          # This central audit is offline: it does not fetch providers or write D1.
          central={"version":"arvexq-jra-saved-original-only-audit-v1",
                   "scope":"saved-originals-only-no-live-D1-recheck",
                   "days":{},"horses":[],"issues":[]}
          for index_file in other_files:
              if index_file.name==day+".json":continue
              idx=json.loads(index_file.read_text(encoding="utf-8"))
              for other_rid,ref in (idx.get("races") or {}).items():
                  other_sha=str(ref.get("sha256") or "")
                  if not re.fullmatch(r"[a-f0-9]{64}",other_sha) or ref.get("file")!=other_sha+".json":
                      continue
                  p=root/ref["file"]
                  if not p.is_file():continue
                  e=json.loads(p.read_text(encoding="utf-8"))
                  raw=gzip.decompress(base64.b64decode(e["gzipBase64"],validate=True))
                  if e.get("sha256")!=other_sha or len(raw)!=e.get("bytes") or hashlib.sha256(raw).hexdigest()!=other_sha:
                      continue
                  candidate=json.loads(raw)
                  other_archives_read+=1
                  if other_rid.startswith("jra-"):
                      stats=central["days"].setdefault(str(candidate.get("date") or ""),{
                          "races":0,"horses":0,"withHistory":0,"zeroHistory":0,
                          "debutFlagsUnproven":0,"careerArchiveErrors":0,
                          "outOfDeclaredFieldNumber":0})
                      stats["races"]+=1
                      field_size=int(candidate.get("fieldSize") or 0)
                      seen_numbers=set()
                      for jh in candidate.get("horses") or []:
                          if not isinstance(jh,dict):continue
                          stats["horses"]+=1
                          number=int(jh.get("horseNumber") or 0)
                          audit=jh.get("_careerHistoryAudit") or {}
                          error=""
                          try: runs=_career_rows(jh,str(candidate.get("date") or ""))
                          except (ValueError,TypeError,KeyError) as exc:
                              runs=[];error=type(exc).__name__
                          stats["withHistory" if runs else "zeroHistory"]+=1
                          if error:stats["careerArchiveErrors"]+=1
                          if jh.get("debutNoHistory") and not (
                                  audit.get("complete") is True and audit.get("reportedStarts")==0):
                              stats["debutFlagsUnproven"]+=1
                          if number>field_size>0 or number in seen_numbers or number<1:
                              stats["outOfDeclaredFieldNumber"]+=1
                              central["issues"].append({"raceId":other_rid,"horseNumber":number,
                                  "declaredFieldSize":field_size,"duplicate":number in seen_numbers})
                          seen_numbers.add(number)
                          central["horses"].append({"raceId":other_rid,"horseNumber":number,
                               "name":jh.get("name"),"priorRuns":len(runs),
                               "debutFlag":bool(jh.get("debutNoHistory")),
                               "verifiedZeroStarts":audit.get("complete") is True and
                                   audit.get("reportedStarts")==0,
                               "reportedStarts":audit.get("reportedStarts"),"archiveError":error})
                  for horse in candidate.get("horses") or []:
                      if not isinstance(horse,dict):continue
                      for target in targets.get(str(horse.get("name") or ""),[]):
                          expected=_runners(originals[target["raceId"]]).get(target["horseNumber"],{})
                          if not compatible(expected,horse):continue
                          try: rows=_career_rows(horse,str(candidate.get("date") or ""))
                          except (ValueError,TypeError,KeyError):continue
                          earlier=sorted({str(row.get("date") or "") for row in rows if str(row.get("date") or "")<day})
                          if earlier:
                              target["otherArchiveEvidence"].append({
                                  "raceId":other_rid,"archiveDate":candidate.get("date"),"priorRuns":len(earlier),
                                  "priorDates":earlier[-5:],"identityCheck":"exact-name-age-sex-birthdate-when-present"})
          for item in zero:
              item["otherArchiveEvidence"]=sorted(item["otherArchiveEvidence"],key=lambda x:-x["priorRuns"])[:3]
          summary["otherArchivedSnapshotsChecked"]=other_archives_read
          summary["zeroHistoryHorsesWithOtherArchivedPriorRuns"]=sum(bool(x["otherArchiveEvidence"]) for x in zero)
          summary["unflaggedZeroHorsesWithOtherArchivedPriorRuns"]=sum(
              bool(x["otherArchiveEvidence"]) and not x["originalDebutFlag"] for x in zero)
          summary["zeroHistoryWithReportedStartsAboveZero"]=sum(
              (x["sourceHistoryEvidence"].get("reportedStarts") or 0)>0 for x in zero)
          summary["unverifiedDebutFlags"]=sum(
              x["originalDebutFlag"] and not (
                 x["sourceHistoryEvidence"].get("auditComplete") is True and
                 x["sourceHistoryEvidence"].get("reportedStarts")==0)
              for x in zero)
          # Split archived zero-history observations by their recorded age
          # and verified debut evidence. Do not infer a career from age alone.
          def source_age(item):
              value=str(item["sourceHistoryEvidence"].get("age") or "")
              m=re.search(r"\\d+",value)
              return int(m.group()) if m else 0
          summary["zeroHistoryUnflaggedAge3Plus"]=sum(
              not item["originalDebutFlag"] and source_age(item)>=3 for item in zero)
          summary["zeroHistoryAge2UnverifiedDebut"]=sum(
              item["originalDebutFlag"] and source_age(item)==2
              and not (item["sourceHistoryEvidence"].get("auditComplete") is True and
                       item["sourceHistoryEvidence"].get("reportedStarts")==0)
              for item in zero)
          summary["zeroHistoryAttemptedButNoReportedStartsOrProviderErrors"]=sum(
              ev.get("fetchAttempted") is True
              and ev.get("reportedStarts") is None
              and not ev.get("failedProviders") and not ev.get("failedEvidenceProviders")
              for ev in (item["sourceHistoryEvidence"] for item in zero))
          central["summary"]={"races":sum(x["races"] for x in central["days"].values()),
              "horses":len(central["horses"]),
              "withHistory":sum(x["withHistory"] for x in central["days"].values()),
              "withoutHistory":sum(x["zeroHistory"] for x in central["days"].values()),
              "unverifiedDebutFlags":sum(x["debutFlagsUnproven"] for x in central["days"].values()),
              "archiveErrors":sum(x["careerArchiveErrors"] for x in central["days"].values()),
              "fieldNumberAnomalies":len(central["issues"])}
          Path("career-jra-saved-original-audit.json").write_text(
              json.dumps(central,ensure_ascii=False,indent=2),encoding="utf-8")
          print("ARVEXQ_JRA_SAVED_ORIGINAL_OFFLINE_AUDIT",json.dumps(
              {"days":central["days"],"summary":central["summary"]},ensure_ascii=False),flush=True)
          output={"summary":summary,"horses":horses}
          Path("career-d1-snapshot-2026-10-16.json").write_text(json.dumps(output,ensure_ascii=False,indent=2),encoding="utf-8")
          print("ARVEXQ_NAR_ORIGINAL_TO_D1_READONLY_AUDIT",json.dumps(summary,ensure_ascii=False),flush=True)
          for x in zero:
              print("ARVEXQ_ZERO_HISTORY_SOURCE",json.dumps(x,ensure_ascii=False),flush=True)
          for x in horses:
              if x["lostSourceRuns"] or not x["identityMatched"] or x["originalArchiveError"] or x["d1ArchiveError"]:
                  print("ARVEXQ_HISTORY_DISCREPANCY",json.dumps(x,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-deadheat-verification
          path: |
            deadheat-verdict.json
            career-d1-snapshot-2026-10-16.json
            career-jra-saved-original-audit.json
