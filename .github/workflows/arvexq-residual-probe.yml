name: ARVEXQ Residual Repair Probe

on:
  push:
    paths:
      - arvexq/residual_repair/probe.json

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run probe
        run: python scripts/arvexq_residual_probe.py
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-residual-probe-result
          path: arvexq/residual_repair/probe-result.json
          if-no-files-found: warn
