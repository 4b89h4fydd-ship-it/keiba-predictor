name: ARVEXQ Verified Prior Finish Cycle
"on":
  push:
    branches: [fix/arvexq-new-engine-complete-field-20261022]
    paths:
      - scripts/arvexq_official_finish_correction_cycle.py
      - .github/workflows/arvexq-official-finish-correction-cycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
      ARVEXQ_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt pytest==9.1.1
      - name: Official prior results existing tests
        run: PYTHONPATH=. python -m pytest -q tests/test_nar_official_historical_result.py tests/test_research_provisional_replay.py
      - name: Multi-day verified source historical correction and forecast comparison
        run: |
          set -o pipefail
          PYTHONPATH=. python -u scripts/arvexq_official_finish_correction_cycle.py | tee official-finish-cycle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arvexq-official-finish-cycle-${{ github.run_id }}
          path: official-finish-cycle.log
          retention-days: 14
          if-no-files-found: warn
