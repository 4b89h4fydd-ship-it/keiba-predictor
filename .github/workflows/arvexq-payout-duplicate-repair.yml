name: ARVEXQ Payout Duplicate History Repair (2026-11-09)

# One-off, push-triggered extension of the steady result-repair lane to
# the stored days whose payout blocks carry duplicate (type,
# combination) entries — the NAR 枠連単 leak into 馬連 (parser fixed in
# arvexq/ingest/payout_parser.py) and the pre-fix JRA text-fallback
# rows. Same production machinery as
# .github/workflows/arvexq-jra-payout-history-repair.yml (fetch bundle
# -> repair -> protect-sync -> named audit), with three deliberate
# scopings:
#   * no box filter: the day's bundle is repaired whole (the lane only
#     selects races whose stored result/payout is incomplete, which is
#     exactly the flagged set);
#   * the environment backfill pass is disabled
#     (ARVEXQ_RESULT_ENV_FILL_LIMIT=0) — past environment backfill for
#     old JRA days was decided against on 2026-11-09;
#   * no schedule; triggered by a push to
#     arvexq/payout_duplicate_repair_requests/requests.json (a PAT
#     cannot dispatch workflows). The request file carries the date
#     list; one run repairs every listed date in sequence and is safe
#     to re-push with the remaining dates (repaired races read clean
#     and drop out of the lane's selection).

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - arvexq/payout_duplicate_repair_requests/requests.json

concurrency:
  group: arvexq-result-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-data
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      NAR_ON_DEMAND_HISTORY_MONTHS: "12"
      ARVEXQ_RESULT_WORKERS: "6"
      ARVEXQ_RESULT_RETRY_SLEEP_SEC: "3"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest

      - name: Payout parser and result regression tests
        run: |
          python -m pytest tests/test_payout_parser.py tests/test_payout_combination_shape.py -q
          python -m unittest discover -s tests -p 'test_result_stalled_regressions.py' -v
          python -m unittest discover -s tests -p 'test_result_repair_retired_banei.py' -v
          python -m unittest discover -s tests -p 'test_result_repair_env_fill.py' -v
          python -m pytest tests/test_result_repair_bundle_fallback.py -q
          python -m pytest tests/test_payout_payload_shape_stubs.py -q

      - name: Read and validate the requested dates
        run: |
          python - <<'PYEOF'
          import json, re
          req = json.load(open("arvexq/payout_duplicate_repair_requests/requests.json", encoding="utf-8"))
          dates = req.get("dates") or []
          assert dates, "request file carries no dates"
          for d in dates:
              assert re.fullmatch(r"2026-\d{2}-\d{2}", str(d)), f"bad date: {d}"
          with open("repair-dates.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(str(d) for d in dates) + "\n")
          print(f"dates={len(dates)}: {dates}")
          PYEOF

      - name: Restore warm cache read-only
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-result-readonly-${{ runner.os }}-multi-${{ github.run_id }}
          restore-keys: |
            arvexq-prefetch-${{ runner.os }}-
            arvexq-data-${{ runner.os }}-

      - name: Repair every requested date (fetch -> repair -> protect-sync -> audit)
        env:
          # Step-scoped on purpose: repair() reads this limit from the
          # process env, and the regression tests above exercise
          # repair() with the default limit.
          ARVEXQ_RESULT_ENV_FILL_LIMIT: "0"
        run: |
          set -u
          FAILED=""
          : > repair-summary.txt
          while read -r DATE; do
            [ -n "$DATE" ] || continue
            echo "================ $DATE ================"
            ok=1
            python scripts/arvexq_fetch_d1_bundle.py \
              --api-base "$CLOUDFLARE_API_BASE" \
              --date "$DATE" \
              --out "bundle-$DATE.json" \
              --report "d1-bundle-report-$DATE.json" \
              --workers 8 \
              --allow-missing-details --allow-empty-day || ok=0
            if [ "$ok" = 1 ]; then
              python scripts/arvexq_restore_result_day.py \
                --bundle "bundle-$DATE.json" --date "$DATE" \
                --report "result-day-index-$DATE.json" || ok=0
            fi
            if [ "$ok" = 1 ]; then
              if ! PYTHONPATH=. python scripts/arvexq_result_repair.py \
                  --bundle "bundle-$DATE.json" \
                  --payload "result-repair-payload-$DATE.json" \
                  --report "result-repair-report-$DATE.json" \
                  > "result-repair-$DATE.log" 2>&1
              then
                echo "::error::Result repair failed for $DATE"
                tail -n 60 "result-repair-$DATE.log" || true
                ok=0
              fi
            fi
            if [ "$ok" = 1 ]; then
              jq -c '{date, started, pending_before, repairedCount:(.repaired|length), resultMissing:(.result_missing|length), payoutMissing:(.payout_missing|length)}' \
                "result-repair-report-$DATE.json" >> repair-summary.txt || true
              # A repaired detail can carry a raw mass-feature matrix
              # whose prediction twin lives in the stored publication;
              # pack_detail refuses it and one refusal would kill the
              # whole day's sync. Convert such snapshots to their
              # verified archive form (or isolate the detail) first.
              PYTHONPATH=. python scripts/arvexq_payout_payload_sanitize.py \
                --payload "result-repair-payload-$DATE.json" || ok=0
              # Compact-tombstone stub entries must be rebuilt on the
              # API display detail so the sync stays a result-only
              # write in protect's comparison; a shaping failure only
              # leaves protect failing closed, as before.
              PYTHONPATH=. python scripts/arvexq_payout_payload_shape_stubs.py \
                --payload "result-repair-payload-$DATE.json" \
                --api-base "$CLOUDFLARE_API_BASE" \
                || echo "::warning::stub shaping failed for $DATE"
              STARTED=$(jq '.meta.started_race_count // 0' "result-repair-payload-$DATE.json")
              if [ "$STARTED" -gt 0 ]; then
                python scripts/arvexq_sync_batches.py \
                  --input "result-repair-payload-$DATE.json" \
                  --out-dir "result-sync-batches-$DATE" || ok=0
                if [ "$ok" = 1 ]; then
                  for file in result-sync-batches-$DATE/batch-*.json; do
                    safe=0
                    for attempt in 1 2 3; do
                      if PYTHONPATH=. python scripts/arvexq_protect_sync.py --file "$file" --api-base "$CLOUDFLARE_API_BASE"; then
                        safe=1; break
                      fi
                      sleep $((attempt * 5))
                    done
                    test "$safe" = 1 || { ok=0; break; }
                    curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
                      --connect-timeout 10 --max-time 40 -X POST \
                      "$CLOUDFLARE_API_BASE/api/sync" \
                      -H "content-type: application/json" \
                      -H "x-sync-token: $SYNC_TOKEN" \
                      --data-binary @"$file" > /dev/null || { ok=0; break; }
                    verified=0
                    for attempt in 1 2 3; do
                      if PYTHONPATH=. python scripts/arvexq_protect_sync.py --verify-post --file "$file" --api-base "$CLOUDFLARE_API_BASE"; then
                        verified=1; break
                      fi
                      sleep $((attempt * 5))
                    done
                    test "$verified" = 1 || { ok=0; break; }
                  done
                fi
              else
                echo "No started races for $DATE; skip sync."
              fi
            fi
            if [ "$ok" = 1 ]; then
              PYTHONPATH=. python scripts/arvexq_result_audit.py \
                --bundle "bundle-$DATE.json" \
                --report "result-repair-report-$DATE.json" \
                --payload "result-repair-payload-$DATE.json" \
                --api-base "$CLOUDFLARE_API_BASE" \
                --out "result-audit-report-$DATE.json" || ok=0
              cat "result-audit-report-$DATE.json" || true
            fi
            if [ "$ok" != 1 ]; then
              FAILED="$FAILED $DATE"
              echo "$DATE FAILED" >> repair-summary.txt
            fi
          done < repair-dates.txt
          echo "----- summary -----"
          cat repair-summary.txt
          if [ -n "$FAILED" ]; then
            echo "::error::dates failed:$FAILED"
            exit 1
          fi

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-payout-duplicate-repair-${{ github.run_number }}
          path: |
            repair-dates.txt
            repair-summary.txt
            bundle-*.json
            d1-bundle-report-*.json
            result-repair-*.log
            result-repair-report-*.json
            result-repair-payload-*.json
            result-audit-report-*.json
          if-no-files-found: ignore
          retention-days: 14
