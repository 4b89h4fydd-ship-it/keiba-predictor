name: ARVEXQ Private Official BOAT Sync

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: YYYY-MM-DD (blank = JST today)
        required: false
        type: string
  schedule:
    # 09:27, 12:27, 15:27, 18:27, 21:27 JST; only 2 archives per date run.
    - cron: '27 0,3,6,9,12 * * *'

permissions:
  contents: read

concurrency:
  group: arvexq-web-production
  cancel-in-progress: false

jobs:
  private-official-sync:
    # Fail closed while the user's Cloudflare Access app is not configured.
    if: ${{ vars.ARVEXQ_BOAT_PRIVATE_ACCESS_VERIFIED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.ARVEXQ_BOAT_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.ARVEXQ_BOAT_ACCESS_CLIENT_SECRET }}
      REQUEST_DATE: ${{ inputs.race_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install one official B-K parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install 'boatrace-lzh==0.1.0'
      - name: Require private routes and generate verified official day
        run: |
          set -euo pipefail
          DAY="${REQUEST_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          echo "BOAT_DAY=$DAY" >> "$GITHUB_ENV"
          bash scripts/arvexq_boat_private_access.sh "$DAY"
          test -s "arvexq/ui/static/sports/boat-data/$DAY.json"
          python -m unittest discover -s tests -p 'test_boat_official_import.py' -v
      - name: Build BOAT and horse from current main (no public data commit)
        run: |
          python build_static.py
          test -s "dist/sports/boat-data/$BOAT_DAY.json"
          git status --short | head -n 15
      - name: Deploy existing shared Worker
        run: npx --yes wrangler@4 deploy
      - name: Verify authenticated records and deny anonymous access
        run: bash scripts/arvexq_boat_private_access.sh "$BOAT_DAY" --verify-only
