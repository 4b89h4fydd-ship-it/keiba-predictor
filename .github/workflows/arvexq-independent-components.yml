name: ARVEXQ Independent Components
on:
  pull_request:
    branches: [main, fix/independence-jra-nar-data-boundaries-20261023]
    paths: ['app.py', 'arvexq/**', 'tests/**', 'scripts/arvexq_independence_audit.py', 'scripts/arvexq_production_boundaries_smoke.cjs', 'docs/independence/**', 'build_static.py', '.github/workflows/arvexq-independent-components.yml']
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ARVEXQ_DATA_CORE: '0'
      ARVEXQ_BOOTSTRAP_WARM: '0'
      RACEDB_AUTO_UPDATE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt pytest
      - name: Bounded runtime readiness contracts
        run: python -m unittest tests.test_runtime_readiness -v
      - name: Independent factual readback and data quality contracts
        run: python -m pytest tests/test_factual_data_audit.py -q
      - name: Individual fields, production boundaries, observation readiness and evidence ledger
        run: python -m pytest -q tests/test_entry_field_contracts.py tests/test_forecast_production_boundaries.py tests/test_diagnosis_readiness.py tests/test_independence_evidence.py tests/test_environment_component_split.py
      - name: JRA date, venue, race number, title and runner count identity
        run: python -m pytest -q tests/test_independent_jra_race_identity.py tests/test_jra_identifiers.py
      - name: JRA schedule, surface, course, distance and purse field contracts
        run: python -m pytest -q tests/test_jra_race_fields_independent.py tests/test_jra_official_table_independent.py tests/test_jra_race_fields_parity_matrix.py tests/test_jra_meeting_schedule_independent.py tests/test_jra_grade_class_independent.py
      - name: JRA official runner horse-number extraction
        run: python -m pytest -q tests/test_jra_official_runner_row.py tests/test_jra_official_table_independent.py tests/test_jra_withdrawn_roster.py
      - name: Independent race ID matching
        run: python -m pytest -q tests/test_independent_race_identity.py
      - name: Race summary and official card deduplication contracts
        run: python -m pytest -q tests/test_race_summary_merge.py
      - name: NAR official confirmed result factual classification
        run: python -m pytest -q tests/test_independent_official_result_status.py
      - name: External netkeiba result parser contracts
        run: python -m pytest -q tests/test_netkeiba_result_parser.py
      - name: NAR official card fact parser contracts
        run: python -m pytest -q tests/test_nar_official_card.py tests/test_nar_official_fields_independent.py tests/test_environment_component_split.py
      - name: Observed runner identity, affiliation and withdrawal facts
        run: python -m pytest -q tests/test_observed_runner_metadata.py tests/test_entry_field_contracts.py tests/test_jra_withdrawn_roster.py
      - name: Observed odds missingness and market delta independence
        run: python -m pytest -q tests/test_independent_odds_facts.py
      - name: JST-aware observed odds acquisition clock
        run: python -m pytest -q tests/test_odds_capture_time.py
      - name: Independent NAR place odds fields
        run: python -m pytest -q tests/test_independent_place_odds.py tests/test_nar_official_odds_independent.py tests/test_jra_official_odds_independent.py tests/test_jra_official_weight_independent.py
      - name: Independent JRA/NAR circuit transfer observations
        run: python -m pytest -q tests/test_circuit_transfer_independent.py
      - name: JRA day summary shares official independent field parsers
        run: python -m pytest -q tests/test_jra_summary_independent_fields.py
      - name: JRA past-run field contracts and integration
        run: python -m pytest -q tests/test_jra_past_fields_independent.py
      - name: JavaScript production modules
        run: |
          node scripts/arvexq_production_boundaries_smoke.cjs
      - name: Empirical Mineta-expert-multi-AI fusion and leakage guards
        run: python -m pytest -q tests/test_empirical_fusion.py tests/test_mineta_public_pace.py tests/test_empirical_fusion_live_contract.py tests/test_fusion_settlement.py tests/test_fusion_method_models.py tests/test_fusion_ai_models.py tests/test_fusion_historical_replay.py tests/test_fusion_existing_d1_live_path.py tests/test_fusion_no_legacy_fallback.py tests/test_prefetch_fusion_version_gate.py
      - name: Stage64 pre-off API, wager marginal and scenario display contracts
        run: |
          python -m pytest -q tests/test_stage64_product_forecast.py tests/test_stage64_frozen_input_evidence.py tests/test_stage64_direct_rival_publication.py
          node scripts/arvexq_stage64_pace_contract_smoke.cjs
      - name: Lock approved ARVEXQ visual layout while retiring former prediction UI
        run: node scripts/arvexq_design_freeze_smoke.cjs
      - name: Independent historical deduplication, temporal isolation and display
        run: node scripts/arvexq_history_independence_smoke.cjs
      - name: Validate honest progress without treating incomplete inventory as complete
        run: python scripts/arvexq_independence_audit.py
      - name: Static PWA includes independent modules
        run: |
          python build_static.py
          node --check dist/app-v330.js

  fusion-real-d1-replay:
    name: Real D1 JRA/NAR fusion chronological replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      ARVEXQ_DATA_CORE: '0'
      ARVEXQ_BOOTSTRAP_WARM: '0'
      RACEDB_AUTO_UPDATE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Read existing historical D1 details only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arvexq-five-replay
          for day in 2026-10-17 2026-10-18 2026-10-19 2026-10-20 2026-10-21 2026-10-22 2026-10-23 2026-10-24; do
            python scripts/arvexq_fetch_d1_bundle.py \
              --api-base "$CLOUDFLARE_API_BASE" --date "$day" \
              --exclude-retired-banei --workers 3 \
              --out "/tmp/arvexq-five-replay/$day.json" \
              --report "/tmp/arvexq-five-replay/$day-report.json"
          done
      - name: Train two AI architectures and three expert/public methods then score real later races
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          from arvexq.prediction.fusion_historical_replay import _eligible,_preoff_card
          from arvexq.prediction.fusion_method_models import observed_buckets
          for circuit in ('中央','地方'):
              counts=Counter()
              samples=[]
              for path in sorted(Path('/tmp/arvexq-five-replay').glob('2026-*.json')):
                  for row in json.loads(path.read_text()).get('details',[]):
                      if row.get('circuit')!=circuit:continue
                      counts['read']+=1
                      if not _eligible(row,circuit):
                          counts['not_final_or_unsettleable']+=1
                          continue
                      counts['official_settleable']+=1
                      try:
                          observed_buckets(_preoff_card(row))
                          counts['complete_method_history']+=1
                      except Exception as exc:
                          counts[type(exc).__name__+':'+str(exc)[:80]]+=1
                          if len(samples)<8:samples.append([row.get('id'),str(exc)[:90]])
              print('REAL_FUSION_SOURCE_GATE',circuit,dict(counts),'samples',samples)
          PY
          python scripts/arvexq_train_research_models.py \
            --input-dir /tmp/arvexq-five-replay \
            --target-date 2026-10-25 \
            --output /tmp/arvexq-fusion-models.json \
            --report /tmp/arvexq-fusion-report.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/arvexq-fusion-report.json'))
          print('REAL_FUSION_AUDIT',json.dumps({
              'calibrated':d.get('fusionCalibratedCircuits'),
              'errors':d.get('errors'),
              'counts':{k:{'train':v['trainingRaces'],'heldout':v['validationRaces'],
                           'excluded':len(v.get('validationExcluded') or {})}
                        for k,v in (d.get('fusionAudits') or {}).items()},
          },ensure_ascii=False))
          model=json.load(open('/tmp/arvexq-fusion-models.json'))
          missing=[]
          for c in ('中央','地方'):
              block=(model.get('fusion') or {}).get(c)
              if not block or block['calibration']['nRaces']<30:
                  missing.append(c)
                  continue
              print('REAL_FUSION_METRICS',c,json.dumps(
                  block['calibration']['metrics'],ensure_ascii=False))
          if missing:raise SystemExit('REAL_FUSION_JRA_NAR_MISSING_'+','.join(missing))
          PY
