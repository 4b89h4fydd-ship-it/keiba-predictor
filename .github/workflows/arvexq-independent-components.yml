name: ARVEXQ Independent Components
on:
  pull_request:
    branches: [main]
    paths: ['app.py', 'arvexq/**', 'tests/**', 'scripts/arvexq_independence_audit.py', 'scripts/arvexq_production_boundaries_smoke.cjs', 'docs/independence/**', 'build_static.py', '.github/workflows/arvexq-independent-components.yml']
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ARVEXQ_DATA_CORE: '0'
      ARVEXQ_BOOTSTRAP_WARM: '0'
      RACEDB_AUTO_UPDATE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt pytest
      - name: Individual fields, production boundaries, observation readiness and evidence ledger
        run: python -m pytest -q tests/test_entry_field_contracts.py tests/test_forecast_production_boundaries.py tests/test_diagnosis_readiness.py tests/test_independence_evidence.py tests/test_environment_component_split.py
      - name: JRA past-run field contracts and integration
        run: python -m pytest -q tests/test_jra_past_fields_independent.py
      - name: JavaScript production modules
        run: node scripts/arvexq_production_boundaries_smoke.cjs
      - name: Independent historical deduplication, temporal isolation and display
        run: node scripts/arvexq_history_independence_smoke.cjs
      - name: Validate honest progress without treating incomplete inventory as complete
        run: python scripts/arvexq_independence_audit.py
      - name: Static PWA includes independent modules
        run: |
          python build_static.py
          node --check dist/app-v330.js
