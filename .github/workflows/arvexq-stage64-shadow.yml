name: ARVEXQ Stage64 Shadow Research
"on":
  pull_request:
    branches: [main]
    paths:
      - arvexq/research/stage63/**
      - arvexq/research/stage64/**
      - tests/test_stage64*.py
      - scripts/arvexq_stage64*.py
      - docs/research/stage64-results/*candidate_plan.json
      - .github/workflows/arvexq-stage64-shadow.yml
  # The scheduled trigger remains inactive while PR #367 is draft.
  workflow_run:
    workflows: [ARVEXQ Full Prefetch]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [preregister, freeze, capture-results, score]
        default: preregister
      circuit:
        type: choice
        options: [jra, nar]
        default: jra
      plan_artifact:
        type: string
        default: ""
      source_artifact:
        type: string
        default: ""
      source_member:
        type: string
        default: persisted-facts.json
      forecast_artifact:
        type: string
        default: ""
      result_artifact:
        type: string
        default: ""
      result_date:
        description: Completed JST racing day YYYY-MM-DD; read existing D1 only
        type: string
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated shadow tests
        run: |
          python -m unittest discover -s tests -p 'test_stage63*.py' -v
          python -m unittest discover -s tests -p 'test_stage64*.py' -v
      - name: Calculate retrospective saved JRA/NAR research trial
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p shadow-saved
          python scripts/arvexq_stage64_saved_connection.py \
            --date 2026-10-17 --output shadow-saved/stage64-saved-2026-10-17.json
          for date in 2026-10-10 2026-10-11 2026-10-12 2026-10-13 2026-10-14 2026-10-15; do
            python scripts/arvexq_stage64_saved_connection.py \
              --date "$date" --compare-coverage docs/research/stage64-results/coverage.json \
              --output "shadow-saved/stage64-archived-overlap-$date.json"
          done
      - name: Archive historical trial separately from frozen forecasts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-stage64-retrospective-saved-trial
          path: shadow-saved/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare exact preregistration bundles
        if: github.event_name == 'pull_request' || inputs.action == 'preregister'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from arvexq.research.stage64.protocol import check_plan
          for owner in ("jra","nar"):
              source=Path("docs/research/stage64-results")/(owner+"_candidate_plan.json")
              bundle=json.loads(source.read_text())
              check_plan(bundle["plan"])
              destination=Path("shadow-plans")/owner
              destination.mkdir(parents=True)
              (destination/"bundle.json").write_bytes(source.read_bytes())
          PY
      - name: Preregister JRA shadow plan
        if: github.event_name == 'pull_request' || inputs.action == 'preregister'
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-stage64-plan-jra
          path: shadow-plans/jra/bundle.json
          if-no-files-found: error
          retention-days: 90
      - name: Preregister NAR shadow plan
        if: github.event_name == 'pull_request' || inputs.action == 'preregister'
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-stage64-plan-nar
          path: shadow-plans/nar/bundle.json
          if-no-files-found: error
          retention-days: 90
      - name: Freeze from existing saved-data artifact only
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'freeze'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          SOURCE_MEMBER: ${{ inputs.source_member }}
          PLAN_ARTIFACT: ${{ inputs.plan_artifact }}
          SHADOW_CIRCUIT: ${{ inputs.circuit }}
        run: |
          mkdir shadow-forecast
          python scripts/arvexq_stage64_capture_artifact.py \
            --source-artifact "$SOURCE_ARTIFACT" --source-member "$SOURCE_MEMBER" \
            --plan-artifact "$PLAN_ARTIFACT" --circuit "$SHADOW_CIRCUIT" \
            --output shadow-forecast/bundle.json
      - name: Read settled facts from the original D1 endpoint only
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'capture-results'
        env:
          RESULT_DATE: ${{ inputs.result_date }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, os, re
          day=os.environ["RESULT_DATE"]
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}",day):
              raise SystemExit("explicit result_date required YYYY-MM-DD")
          date=datetime.date.fromisoformat(day)
          today=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          if date>=today:
              raise SystemExit("Only completed previous racing days can be read")
          PY
          mkdir -p shadow-results
          python scripts/arvexq_fetch_d1_bundle.py \
            --api-base https://kraiz-api.4b89h4fydd.workers.dev \
            --date "$RESULT_DATE" \
            --out shadow-results/persisted-facts.json \
            --report shadow-results/readback-audit.json \
            --workers 3 --retries 3
      - name: Archive witnessed post-race D1 readback without modifying stored facts
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'capture-results'
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-stage64-confirmed-d1-${{ inputs.result_date }}
          path: shadow-results/
          if-no-files-found: error
          retention-days: 90
      - name: Score witnessed forecast from saved confirmed D1 result artifact
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'score'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_ARTIFACT: ${{ inputs.plan_artifact }}
          FORECAST_ARTIFACT: ${{ inputs.forecast_artifact }}
          RESULT_ARTIFACT: ${{ inputs.result_artifact }}
        run: |
          mkdir -p shadow-score
          python scripts/arvexq_stage64_score_saved.py \
            --plan-artifact "$PLAN_ARTIFACT" \
            --forecast-artifact "$FORECAST_ARTIFACT" \
            --result-artifact "$RESULT_ARTIFACT" \
            --output shadow-score/result.json \
            --audit shadow-score/audit.json
      - name: Preserve independent pre-off scoring evidence
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'score' && always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-stage64-score-${{ github.run_id }}
          path: shadow-score/
          if-no-files-found: warn
          retention-days: 90
      - name: Archive frozen shadow cohort
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'freeze'
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-stage64-frozen-${{ inputs.circuit }}
          path: shadow-forecast/bundle.json
          if-no-files-found: error
          retention-days: 90

  auto-freeze:
    # Workflow-run triggers execute from default branch only after authorized merge.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        circuit: [jra, nar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test independent and fail-closed cohort selection
        run: python -m unittest discover -s tests -p 'test_stage64_auto_capture.py' -v
      - name: Freeze verified existing facts before post (never retrieve races)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          CIRCUIT: ${{ matrix.circuit }}
        run: |
          mkdir -p shadow-auto
          python scripts/arvexq_stage64_auto_capture.py \
            --source-run "$SOURCE_RUN_ID" --circuit "$CIRCUIT" \
            --output shadow-auto/bundle.json --audit shadow-auto/audit.json
      - name: Archive prospective forecast for later external witness
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-stage64-forecast-${{ matrix.circuit }}
          path: shadow-auto/bundle.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve exclusion and coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-stage64-cohort-audit-${{ matrix.circuit }}
          path: shadow-auto/audit.json
          if-no-files-found: warn
          retention-days: 90
