name: ARVEXQ Realtime Sync

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - scripts/arvexq_live_sync.py
      - scripts/arvexq_sync_batches.py
      - .github/workflows/arvexq-sync.yml
  schedule:
    - cron: "*/5 22-23 * * *"
    - cron: "*/5 0-14 * * *"

concurrency:
  group: arvexq-realtime-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      CLOUDFLARE_SYNC_URL: https://kraiz-api.4b89h4fydd.workers.dev/api/sync
      CLOUDFLARE_DAY_URL: https://kraiz-api.4b89h4fydd.workers.dev/api/day
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-data
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      NAR_ON_DEMAND_HISTORY_MONTHS: "12"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Set sync date
        run: echo "SYNC_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"

      - name: Restore warm cache read-only
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-live-readonly-${{ runner.os }}-${{ env.SYNC_DATE }}-${{ github.run_id }}
          restore-keys: |
            arvexq-prefetch-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-

      - name: Start lightweight ARVEXQ runtime
        run: |
          nohup python -c 'import app,uvicorn; app.last3f=None; uvicorn.run(app.app,host="127.0.0.1",port=8000)' > /tmp/arvexq-live.log 2>&1 &
          echo $! > /tmp/arvexq-live.pid
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/health > /dev/null; then
              echo "ARVEXQ live runtime ready"
              exit 0
            fi
            sleep 1
          done
          tail -n 80 /tmp/arvexq-live.log || true
          exit 1

      - name: Load prepared day from D1
        run: |
          curl -fsS --max-time 15 \
            "$CLOUDFLARE_DAY_URL?date=$SYNC_DATE&details=0&t=$(date +%s)" \
            -o bundle.json || true

          RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
          if [ "$RACES" -le 0 ]; then
            echo "D1 has no day snapshot; using one local discovery fallback."
            curl -fsS --max-time 20 \
              "http://127.0.0.1:8000/api/v1/site-bootstrap?date=$SYNC_DATE" \
              -o bundle.json || true
            RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
          fi
          if [ "$RACES" -le 0 ]; then
            echo "No cached races; one forced bootstrap repair is allowed."
            curl -fsS --max-time 45 \
              "http://127.0.0.1:8000/api/v1/site-bootstrap?date=$SYNC_DATE&force=1" \
              -o bundle.json || true
            RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
          fi

          echo "LIVE source races=$RACES"
          if [ "$RACES" -le 0 ]; then
            tail -n 80 /tmp/arvexq-live.log || true
            exit 1
          fi

      - name: Refresh live deltas only
        run: |
          if ! python - <<'PY' > live-sync.log 2>&1
          import app, runpy, sys
          app.last3f = None
          sys.argv = [
              'scripts/arvexq_live_sync.py',
              '--bundle', 'bundle.json',
              '--out', 'live-payload.json',
              '--audit', 'live-audit.json',
              '--workers', '1',
          ]
          runpy.run_path('scripts/arvexq_live_sync.py', run_name='__main__')
          PY
          then
            echo "::error::LIVE sync failed"
            tail -n 80 live-sync.log || true
            exit 1
          fi
          jq '{date,targetCount,updatedCount,reanalyzedCount:(.reanalyzed|length),errorCount:(.errors|length),thinSkipped:(.thin_detail_skipped|length),missingD1Base:(.missing_d1_base|length)}' live-audit.json

      - name: Push live deltas to D1 in safe batches
        run: |
          python scripts/arvexq_sync_batches.py \
            --input live-payload.json \
            --out-dir live-sync-batches
          COUNT=$(find live-sync-batches -type f -name 'batch-*.json' | wc -l | tr -d ' ')
          echo "D1 live batches=$COUNT"
          for file in live-sync-batches/batch-*.json; do
            BYTES=$(wc -c < "$file" | tr -d ' ')
            echo "POST $(basename "$file") bytes=$BYTES"
            curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 1 --retry-max-time 45 \
              --connect-timeout 8 --max-time 20 -X POST "$CLOUDFLARE_SYNC_URL" \
              -H "content-type: application/json" \
              -H "x-sync-token: $SYNC_TOKEN" \
              --data-binary @"$file" > /dev/null
          done
          echo "D1 live batched push OK"

      - name: Verify D1 first-paint endpoint
        run: |
          curl -fsS --max-time 15 \
            "$CLOUDFLARE_DAY_URL?date=$SYNC_DATE&details=0&t=$(date +%s)" \
            -o d1-day.json
          D1_RACES=$(jq '.races // [] | length' d1-day.json 2>/dev/null || echo 0)
          echo "D1 races=$D1_RACES"
          if [ "$D1_RACES" -le 0 ]; then
            echo "::error::D1 day endpoint returned no races after live sync"
            exit 1
          fi

      - name: Stop ARVEXQ
        if: always()
        run: |
          if [ -f /tmp/arvexq-live.pid ]; then
            kill "$(cat /tmp/arvexq-live.pid)" 2>/dev/null || true
          fi

      - name: Show concise failure log
        if: failure()
        run: |
          echo "--- live-sync.log ---"
          tail -n 100 live-sync.log 2>/dev/null || true
          echo "--- runtime ---"
          tail -n 100 /tmp/arvexq-live.log 2>/dev/null || true
          cp /tmp/arvexq-live.log runtime-live.log 2>/dev/null || true

      - name: Upload full failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-live-failure-${{ github.run_number }}
          path: |
            live-sync.log
            live-audit.json
            runtime-live.log
          if-no-files-found: ignore
          retention-days: 3
