name: ARVEXQ Realtime Sync

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - scripts/arvexq_live_sync.py
      - arvexq/ingest/official_course_feeds.py
      - arvexq/prediction/official_course_revision.py
      - arvexq/prediction/user_approved_model_revision.py
      - scripts/arvexq_protect_sync.py
      - tests/test_user_approved_model_revision.py
      - scripts/arvexq_capture_course_revised_marks.js
      - scripts/arvexq_sync_batches.py
      - .github/workflows/arvexq-sync.yml
      - sync-heartbeat/heartbeat.txt
  schedule:
    - cron: "*/5 22-23 * * *"
    - cron: "*/5 0-14 * * *"

concurrency:
  group: arvexq-realtime-sync
  # Queue instead of cancelling: on a degraded-scheduler day the one
  # slot that fires must not be cancelled by the next slot's arrival
  # (a cancelled run was observed on 2026-11-04 while scheduled slots
  # were being dropped for hours, leaving no sync completions at all
  # after 14:04 JST and starving every downstream lane). Each run
  # fetches live data when it starts, so a queued run is never stale.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      CLOUDFLARE_SYNC_URL: https://kraiz-api.4b89h4fydd.workers.dev/api/sync
      CLOUDFLARE_DAY_URL: https://kraiz-api.4b89h4fydd.workers.dev/api/day
      # Optional licensed bridge to verifiable JRA/NAR course publications.
      # Without credentials, never claim a bias-derived mark update.
      ARVEXQ_OFFICIAL_COURSE_FEED_URL: ${{ vars.ARVEXQ_OFFICIAL_COURSE_FEED_URL }}
      ARVEXQ_OFFICIAL_COURSE_FEED_TOKEN: ${{ secrets.ARVEXQ_OFFICIAL_COURSE_FEED_TOKEN }}
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-data
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      NAR_ON_DEMAND_HISTORY_MONTHS: "12"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Verify live batch unsealed mass evidence guard
        run: python -m unittest discover -s tests -p 'test_sync_batches_live_unsealed.py' -v

      - name: Set sync date
        run: echo "SYNC_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"

      - name: Restore warm cache read-only
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-live-readonly-${{ runner.os }}-${{ env.SYNC_DATE }}-${{ github.run_id }}
          restore-keys: |
            arvexq-prefetch-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-

      - name: Start lightweight ARVEXQ runtime
        run: |
          nohup python -c 'import app,uvicorn; app.last3f=None; uvicorn.run(app.app,host="127.0.0.1",port=8000)' > /tmp/arvexq-live.log 2>&1 &
          echo $! > /tmp/arvexq-live.pid
          if ! python scripts/arvexq_wait_runtime.py --pid-file /tmp/arvexq-live.pid --timeout 60; then
            tail -n 80 /tmp/arvexq-live.log || true
            exit 1
          fi

      - name: Load prepared day from D1
        run: |
          curl -fsS --max-time 15 \
            "$CLOUDFLARE_DAY_URL?date=$SYNC_DATE&details=0&t=$(date +%s)" \
            -o bundle.json || true

          RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
          if [ "$RACES" -le 0 ]; then
            echo "D1 has no day snapshot; using one local discovery fallback."
            curl -fsS --max-time 20 \
              "http://127.0.0.1:8000/api/v1/site-bootstrap?date=$SYNC_DATE" \
              -o bundle.json || true
            RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
          fi
          if [ "$RACES" -le 0 ]; then
            echo "No cached races; one forced bootstrap repair is allowed."
            curl -fsS --max-time 45 \
              "http://127.0.0.1:8000/api/v1/site-bootstrap?date=$SYNC_DATE&force=1" \
              -o bundle.json || true
            RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
          fi

          echo "LIVE source races=$RACES"
          if [ "$RACES" -le 0 ]; then
            tail -n 80 /tmp/arvexq-live.log || true
            exit 1
          fi

      - name: Refresh live deltas only
        run: |
          if ! python - <<'PY' > live-sync.log 2>&1
          import app, runpy, sys
          app.last3f = None
          sys.argv = [
              'scripts/arvexq_live_sync.py',
              '--bundle', 'bundle.json',
              '--out', 'live-payload.json',
              '--audit', 'live-audit.json',
              '--workers', '1',
          ]
          runpy.run_path('scripts/arvexq_live_sync.py', run_name='__main__')
          PY
          then
            echo "::error::LIVE sync failed"
            tail -n 80 live-sync.log || true
            exit 1
          fi
          jq '{date,targetCount,updatedCount,reanalyzedCount:(.reanalyzed|length),errorCount:(.errors|length),thinSkipped:(.thin_detail_skipped|length),missingD1Base:(.missing_d1_base|length)}' live-audit.json
          # Report actual user-approved changes (or an explicit zero), without
          # implying that refreshing data retroactively changed historical marks.
          if ! grep '^USER_APPROVED_MODEL_' live-sync.log | tail -n 60; then
            echo "USER_APPROVED_MODEL_EVENTS_NONE"
          fi

      # The D1 push and the two D1 verification steps that
      # followed it were retired on 2026-11-27: the D1 database
      # was deleted with the Cloudflare exit (2026-11-24), so
      # the push failed on every run while this lane's real
      # output — the static pack overlay below — succeeded.
      # Live deltas now reach production only through the
      # committed packs.

      - name: Build static API packs from live delta payload (parallel, migration block A)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub-only migration block A: overlay this lane's delta
          # payload (live-payload.json) onto the committed packs for
          # the same date, in parallel with the D1 push above (which
          # stays untouched).  Fail-soft: the helper always exits 0.
          # Fix program B (2026-11-23): if: always() — a rejected or
          # failed D1 batch push must not skip pack generation; the
          # local live-payload.json delta is overlaid on the committed
          # packs as the fallback (the helper warns and skips when no
          # payload exists; nothing is fabricated).
          bash scripts/arvexq_static_api_lane_publish.sh live-payload.json merge
          git checkout -B sync-continue HEAD || true

      - name: Stage issued payload for the static API follow-up lane
        if: always()
        run: |
          mkdir -p issued-payloads
          if [ -s live-payload.json ]; then
            cp live-payload.json "issued-payloads/live-payload-$SYNC_DATE.json"
          fi

      - name: Upload issued payload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-issued-payload-live-${{ github.run_id }}
          path: issued-payloads
          if-no-files-found: ignore
          retention-days: 7


      - name: Stop ARVEXQ
        if: always()
        run: |
          if [ -f /tmp/arvexq-live.pid ]; then
            kill "$(cat /tmp/arvexq-live.pid)" 2>/dev/null || true
          fi

      - name: Show concise failure log
        if: failure()
        run: |
          echo "--- live-sync.log ---"
          tail -n 100 live-sync.log 2>/dev/null || true
          echo "--- runtime ---"
          tail -n 100 /tmp/arvexq-live.log 2>/dev/null || true
          cp /tmp/arvexq-live.log runtime-live.log 2>/dev/null || true

      - name: Upload full failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-live-failure-${{ github.run_number }}
          path: |
            live-sync.log
            live-audit.json
            runtime-live.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-live-audit-${{ github.run_number }}
          path: |
            live-sync.log
            live-audit.json
          if-no-files-found: ignore
          retention-days: 30
