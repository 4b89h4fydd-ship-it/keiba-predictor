name: ARVEXQ Clean Rewrite Tests
on:
  push:
    branches:
      - rewrite/arvexq-clean-engine-20261028
    paths:
      - rewrite/**
      - tests/clean_engine/**
      - tests/clean_slice/**
      - tests/fixtures/clean_slice/**
      - .github/workflows/arvexq-clean-rewrite.yml
  workflow_dispatch:
jobs:
  clean-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parser
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Run replacement-engine contract tests
        run: |
          python -m unittest discover -s rewrite -p 'test_*.py' -v
          python -m unittest discover -s tests/clean_engine -v
          python -m unittest discover -s tests/clean_slice -v
      - name: Install browser validation runtime
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Replay captured real races through API and browser
        shell: bash
        run: |
          set -euo pipefail
          slice_output="$RUNNER_TEMP/arvexq-clean-slice"
          mkdir -p "$slice_output"
          cp tests/fixtures/clean_slice/*.input.json "$slice_output/"
          python -m rewrite.slice.run --directory "$slice_output" --database "$slice_output/research.sqlite3"
          python -m rewrite.slice.server --database "$slice_output/research.sqlite3" --port 8765 > "$slice_output/server.log" 2>&1 &
          slice_server_pid=$!
          trap 'kill "$slice_server_pid"' EXIT
          python -c 'import time, urllib.request; time.sleep(1); urllib.request.urlopen("http://127.0.0.1:8765/api/v1/health").read()'
          python scripts/arvexq_clean_slice_browser.py --base http://127.0.0.1:8765 --directory "$slice_output/browser"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-clean-slice-evidence
          path: ${{ runner.temp }}/arvexq-clean-slice/
          retention-days: 14
