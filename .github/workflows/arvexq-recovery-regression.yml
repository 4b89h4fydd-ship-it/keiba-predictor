name: ARVEXQ Recovery Regression
on:
  pull_request:
    branches: [main]
    paths: ['arvexq/ui/static/**', 'scripts/arvexq_detail_resilience_smoke.js', 'scripts/arvexq_pull_to_refresh_smoke.js', 'scripts/arvexq_recovery_production_smoke.js', 'scripts/arvexq_honmei_dom_contract.js', 'scripts/arvexq_honmei_dom_contract_test.js', '.github/workflows/arvexq-recovery-regression.yml']
  push:
    branches: [main, feature/forecast-reset-20261016]
    paths: ['arvexq/ui/static/**', 'scripts/arvexq_recovery_production_smoke.js', 'scripts/arvexq_honmei_dom_contract.js', 'scripts/arvexq_honmei_dom_contract_test.js', '.github/workflows/arvexq-recovery-regression.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Build and start exact candidate assets
        run: |
          python build_static.py
          python -m http.server 8788 --directory dist >/tmp/arvexq-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8788/version.json && break; sleep 1; done
      - name: Detail outage and full-history recovery
        run: node scripts/arvexq_detail_resilience_smoke.js
      - name: iPhone Chromium and WebKit pull-to-refresh
        env:
          ARVEXQ_BASE_URL: http://127.0.0.1:8788
        run: node scripts/arvexq_pull_to_refresh_smoke.js

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Independent win and axis role DOM contract
        run: node scripts/arvexq_honmei_dom_contract_test.js
      - name: Production full card, original receipts and API-outage checks
        env:
          ARVEXQ_BASE_URL: https://kraizweb1.4b89h4fydd.workers.dev
          ARVEXQ_BROWSER: chromium
        run: node scripts/arvexq_recovery_production_smoke.js
      - name: Production multi-venue iPhone WebKit and API-outage checks
        env:
          ARVEXQ_BASE_URL: https://kraizweb1.4b89h4fydd.workers.dev
          ARVEXQ_BROWSER: webkit
        run: node scripts/arvexq_recovery_production_smoke.js

      - name: Historical JRA and NAR production full-card and outage verification
        env:
          ARVEXQ_BASE_URL: https://kraizweb1.4b89h4fydd.workers.dev
          ARVEXQ_AUDIT_DATE: '2026-10-12'
          ARVEXQ_BROWSER: chromium
        run: node scripts/arvexq_recovery_production_smoke.js
      - name: Historical JRA and NAR iPhone WebKit production verification
        env:
          ARVEXQ_BASE_URL: https://kraizweb1.4b89h4fydd.workers.dev
          ARVEXQ_AUDIT_DATE: '2026-10-12'
          ARVEXQ_BROWSER: webkit
        run: node scripts/arvexq_recovery_production_smoke.js
