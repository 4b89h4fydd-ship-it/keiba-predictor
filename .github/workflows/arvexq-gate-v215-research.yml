name: ARVEXQ Gate v215 Research

"on":
  push:
    branches: [research/recent-accuracy-20261005]
    paths:
      - research/arvexq_gate_v215.py
      - research/arvexq_axis_v213.py
      - research/arvexq_ranker_v209.py
      - .github/workflows/arvexq-gate-v215-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvexq-gate-v215-research
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install research dependencies quietly
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q numpy pandas scikit-learn lightgbm catboost
      - name: Fast preflight
        run: python -m py_compile research/arvexq_gate_v215.py research/arvexq_axis_v213.py research/arvexq_ranker_v209.py
      - name: Restore reusable JRA seed
        uses: actions/cache@v4
        with:
          path: jra-seed
          key: arvexq-v209-jra-seed-${{ runner.os }}-${{ hashFiles('app.py', 'backtest_v206.py', 'backtest_v208_jra.py') }}
      - name: Require JRA seed
        run: test -s jra-seed/jra-official-snapshots.json
      - name: Run v215 meta-gate benchmark
        run: |
          if ! python research/arvexq_gate_v215.py --days 28 --extra-jra jra-seed/jra-official-snapshots.json --out gate-v215.json > gate-v215.log 2>&1; then
            echo "::error::v215 benchmark failed"
            tail -n 100 gate-v215.log || true
            exit 1
          fi
      - name: Show concise result
        run: |
          python - <<'PY'
          import json
          z=json.load(open('gate-v215.json',encoding='utf-8'))
          print('# ARVEXQ v215 meta gate')
          for c,r in z['circuits'].items():
              print(c,'races=',r['races'],'target=',r['target'])
              for k,m in r['aggregate'].items():
                  x=f" coverage={m.get('coverage',0):.1%}" if k=='selected' else ''
                  print(f"  {k}: n={m['races']} place={m['placeRate']:.1%} win={m['winRate']:.1%}{x}")
          PY
      - name: Failure tail
        if: failure()
        run: tail -n 100 gate-v215.log 2>/dev/null || true
      - name: Upload v215 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-gate-v215
          path: |
            gate-v215.json
            gate-v215.log
          if-no-files-found: ignore
          retention-days: 7
