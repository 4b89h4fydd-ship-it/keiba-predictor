name: ARVEXQ Preoff D1 History Readback
"on":
  pull_request:
    branches: [main]
    paths:
      - scripts/arvexq_freeze_predictions.py
      - tests/test_preoff_d1_display_history.py
      - .github/workflows/arvexq-prerace-readback-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_preoff_d1_display_history.py
