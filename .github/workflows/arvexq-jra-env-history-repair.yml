name: ARVEXQ JRA Environment History Repair

# One-off backfill of the stored JRA days whose weather / track
# condition stayed the "不明" placeholder because they were saved
# before the 2026-11-09 environment backfill lane landed (the steady
# lane only drains today/yesterday): 2026-10-24 / 10-25 / 10-31 /
# 11-01 / 11-07 (69 races by the 2026-11-10 listing census; 11-08
# already drained). Same production machinery as the payout / margin
# history repairs (fetch bundle -> repair -> protect-sync), with the
# repair step scoped to the environment fields only:
# scripts/arvexq_env_repair.py fills detail + summary weather /
# condition from the official JRA result page parse; the verify step
# then proves by API read-back that nothing else changed. No
# schedule; triggered by a push to
# arvexq/env_repair_requests/requests.json (a PAT cannot dispatch
# workflows), one date per push, the date read from that file.

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - arvexq/env_repair_requests/requests.json

concurrency:
  group: arvexq-result-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-data
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      NAR_ON_DEMAND_HISTORY_MONTHS: "12"
      ARVEXQ_RESULT_WORKERS: "6"
      ARVEXQ_RESULT_RETRY_SLEEP_SEC: "3"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Environment parser regression
        run: |
          python -m pip install -q pytest
          python -m pytest tests/test_jra_environment_parser.py tests/test_item_004_jra_weather.py tests/test_environment_component_split.py -q

      - name: Set sync date
        run: |
          DATE=$(jq -r '.date' arvexq/env_repair_requests/requests.json)
          case "$DATE" in
            2026-10-24|2026-10-25|2026-10-31|2026-11-01|2026-11-07) ;;
            *) echo "::error::unsupported repair date: $DATE"; exit 1 ;;
          esac
          echo "SYNC_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Restore warm cache read-only
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-result-readonly-${{ runner.os }}-${{ env.SYNC_DATE }}-${{ github.run_id }}
          restore-keys: |
            arvexq-prefetch-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-

      - name: Read the day from D1 race-by-race and keep JRA races only
        run: |
          python scripts/arvexq_fetch_d1_bundle.py \
            --api-base "$CLOUDFLARE_API_BASE" \
            --date "$SYNC_DATE" \
            --out bundle.json \
            --report d1-bundle-report.json \
            --workers 8 \
            --allow-missing-details --allow-empty-day
          python scripts/arvexq_restore_result_day.py \
            --bundle bundle.json --date "$SYNC_DATE" --report result-day-index.json
          python - <<'PYEOF'
          import json
          bundle = json.load(open("bundle.json", encoding="utf-8"))
          races = [r for r in bundle.get("races") or []
                   if str(r.get("id") or "").startswith("jra-")]
          keep = {str(r["id"]) for r in races}
          details = [d for d in bundle.get("details") or []
                     if str(d.get("id") or "") in keep]
          bundle["races"] = races
          bundle["details"] = details
          bundle["raceCount"] = len(races)
          bundle["detailCount"] = len(details)
          json.dump(bundle, open("bundle-jra.json", "w", encoding="utf-8"),
                    ensure_ascii=False)
          print(f"JRA races={len(races)} details={len(details)}")
          assert len(races) == len(details) and len(races) > 0, "JRA bundle incomplete"
          PYEOF

      - name: Fill missing environment (official JRA parse, env fields only)
        run: |
          if ! PYTHONPATH=. python scripts/arvexq_env_repair.py \
              --bundle bundle-jra.json --payload env-repair-payload.json \
              --report env-repair-report.json > env-repair.log 2>&1
          then
            echo "::error::Environment repair failed"
            tail -n 80 env-repair.log || true
            exit 1
          fi
          jq '{date,targets:(.targets|length),repaired:(.repaired|length),skipped,aborted}' env-repair-report.json

      - name: Push repaired snapshots to D1 in safe batches
        run: |
          STARTED=$(jq '.meta.started_race_count // 0' env-repair-payload.json)
          if [ "$STARTED" -le 0 ]; then
            echo "No started races; skip sync."
            exit 0
          fi
          python scripts/arvexq_sync_batches.py \
            --input env-repair-payload.json \
            --out-dir result-sync-batches
          COUNT=$(find result-sync-batches -type f -name 'batch-*.json' | wc -l | tr -d ' ')
          echo "D1 result repair batches=$COUNT"
          for file in result-sync-batches/batch-*.json; do
            safe=0
            for attempt in 1 2 3; do
              if PYTHONPATH=. python scripts/arvexq_protect_sync.py --file "$file" --api-base "$CLOUDFLARE_API_BASE"; then
                safe=1; break
              fi
              sleep $((attempt * 5))
            done
            test "$safe" = 1
            BYTES=$(wc -c < "$file" | tr -d ' ')
            echo "POST $(basename "$file") bytes=$BYTES"
            curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
              --connect-timeout 10 --max-time 40 -X POST \
              "$CLOUDFLARE_API_BASE/api/sync" \
              -H "content-type: application/json" \
              -H "x-sync-token: $SYNC_TOKEN" \
              --data-binary @"$file" > /dev/null
            verified=0
            for attempt in 1 2 3; do
              if PYTHONPATH=. python scripts/arvexq_protect_sync.py --verify-post --file "$file" --api-base "$CLOUDFLARE_API_BASE"; then
                verified=1; break
              fi
              echo "D1 sync verification unavailable; attempt=$attempt retrying"
              sleep $((attempt * 5))
            done
            test "$verified" = 1
          done
          echo "D1 result repair batched push OK"

      - name: Verify read-back from D1 (environment fields only changed)
        run: |
          PYTHONPATH=. python scripts/arvexq_env_verify.py \
            --bundle bundle-jra.json \
            --report env-repair-report.json \
            --api-base "$CLOUDFLARE_API_BASE" \
            --out env-audit-report.json
          cat env-audit-report.json

      - name: Show concise failure log
        if: failure()
        run: |
          tail -n 100 env-repair.log 2>/dev/null || true
          cat d1-bundle-report.json 2>/dev/null || true

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-jra-env-history-repair-${{ env.SYNC_DATE }}-${{ github.run_number }}
          path: |
            bundle-jra.json
            d1-bundle-report.json
            env-repair.log
            env-repair-report.json
            env-repair-payload.json
            env-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
