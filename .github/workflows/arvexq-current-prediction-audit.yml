name: ARVEXQ Factual Data Audit

"on":
  push:
    branches: [main]
    paths:
      - app.py
      - arvexq/ingest/**
      - arvexq/quality/**
      - scripts/arvexq_fact_data_audit.py
      - tests/test_factual_data_audit.py
      - tests/test_v3_http429_diagnosis.py
      - arvexq/v3/audit/http429.py
      - .github/workflows/arvexq-current-prediction-audit.yml
  pull_request:
    branches: [main]
    paths:
      - app.py
      - arvexq/components/item_127/implementation.py
      - arvexq/forecast/engine.py
      - tests/test_legacy_prediction_removal.py
      - arvexq/ingest/d1_day_readback.py
      - arvexq/quality/**
      - scripts/arvexq_fact_data_audit.py
      - tests/test_factual_data_audit.py
      - .github/workflows/arvexq-current-prediction-audit.yml
  workflow_dispatch:
    inputs:
      days:
        description: Completed days to audit
        required: false
        default: '7'
      end_date:
        description: Last date YYYY-MM-DD (blank = yesterday JST)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: arvexq-factual-data-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install -q pytest
      - name: Verify factual readback and quality contracts
        run: python -m pytest tests/test_factual_data_audit.py -q
      - name: Verify rejected legacy prediction code is deleted
        run: python -m pytest tests/test_legacy_prediction_removal.py -q
      - name: Read production factual data
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: '.'
          ARVEXQ_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
          ARVEXQ_DAYS: ${{ inputs.days || '7' }}
          ARVEXQ_END_DATE: ${{ inputs.end_date || '' }}
        run: |
          set -o pipefail
          python scripts/arvexq_fact_data_audit.py | tee data-quality-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arvexq-factual-data-audit
          path: |
            fact-data-audit.json
            data-quality-audit.log
          if-no-files-found: ignore
          retention-days: 14
