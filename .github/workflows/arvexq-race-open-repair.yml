name: ARVEXQ Race Open Integrity (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'arvexq/ui/static/app.js'
      - 'scripts/arvexq_race_source_integrity_smoke.js'
      - '.github/workflows/arvexq-race-open-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate current race opening without rewriting production code
        run: |
          node --check arvexq/ui/static/app.js
          node scripts/arvexq_race_source_integrity_smoke.js
          node scripts/arvexq_static_racecard_open_smoke.js
          node scripts/arvexq_horse_portal_smoke.js
