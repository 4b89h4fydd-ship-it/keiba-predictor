name: ARVEXQ v328 Build Bump

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_bump_build_v328.py'
      - '.github/workflows/arvexq-v328-bump.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arvexq-v328-build-bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply coherent v328 generation
        run: python scripts/arvexq_bump_build_v328.py
      - name: Verify sources and static build
        run: |
          python -m py_compile app.py build_static.py scripts/arvexq_bump_build_v328.py
          node --check arvexq/ui/static/app.js
          python build_static.py
          test "$(tr -d '\r\n' < dist/build-version.txt)" = "v328"
          test -f dist/app-v328.js
          test -f dist/styles-arvexq-v328.css
          test -f dist/sw-v328-reset.js
          test -f dist/sw-v327-reset.js
          grep -q '/app-v328.js' dist/index.html
          grep -q '/styles-arvexq-v328.css' dist/index.html
          grep -q 'r=r||{}' arvexq/ui/static/app.js
          node --check dist/app-v328.js
      - name: Commit v328 generation
        run: |
          TARGETS="app.py build_static.py arvexq/ui/static/index.html arvexq/ui/static/app.js"
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'v328 already applied'
            exit 0
          fi
          git config user.name 'arvexq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'fix: ship Safari runtime guard as v328'
          git pull --rebase origin main
          git push
