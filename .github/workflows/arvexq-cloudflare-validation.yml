name: ARVEXQ Cloudflare Validation

on:
  push:
    branches: [cloudflare]
    paths:
      - worker.js
      - worker-entry.js
      - preoff-evidence.js
      - migrations/**
      - racecard.js
      - public-race.js
      - tests/**
      - wrangler.jsonc
      - package.json
      - .github/workflows/arvexq-cloudflare-validation.yml
  pull_request:
    branches: [cloudflare]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Worker syntax
        run: npm run check
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Verify Safari CORS policy in source
        shell: bash
        run: |
          grep -q 'access-control-allow-origin' worker-entry.js
          grep -q 'access-control-allow-methods' worker-entry.js
          grep -q 'access-control-allow-headers' worker-entry.js
          grep -q 'cache-control, pragma' worker-entry.js
          grep -q 'request.method === "OPTIONS"' worker-entry.js
      - name: Verify production Safari preflight
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          URL='https://kraiz-api.4b89h4fydd.workers.dev/api/day?date=2026-10-06&details=1'
          ok=0
          for i in $(seq 1 30); do
            curl -sS -D /tmp/preflight.h -o /dev/null -X OPTIONS "$URL&probe=$i" \
              -H 'Origin: https://kraizweb1.4b89h4fydd.workers.dev' \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: cache-control,pragma' || true
            tr '[:upper:]' '[:lower:]' </tmp/preflight.h >/tmp/preflight.lower
            cat /tmp/preflight.h
            if grep -q '^access-control-allow-origin: \*' /tmp/preflight.lower \
              && grep -q '^access-control-allow-methods: .*get' /tmp/preflight.lower \
              && grep -q '^access-control-allow-headers: .*cache-control' /tmp/preflight.lower \
              && grep -q '^access-control-allow-headers: .*pragma' /tmp/preflight.lower; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = "1"
          curl -sS -D /tmp/get.h -o /tmp/get.json "$URL" \
            -H 'Origin: https://kraizweb1.4b89h4fydd.workers.dev' \
            -H 'Cache-Control: no-cache'
          tr '[:upper:]' '[:lower:]' </tmp/get.h >/tmp/get.lower
          grep -q '^access-control-allow-origin: \*' /tmp/get.lower
          python - <<'PY'
          import json
          body=json.load(open('/tmp/get.json'))
          assert body.get('ok') is True
          assert isinstance(body.get('races'),list)
          print('SAFARI_CORS_PRODUCTION_OK races',len(body['races']))
          PY

      - name: Verify production career archive read-back
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          const raceId='nar-2026-10-15-名古屋-01';
          const url='https://kraiz-api.4b89h4fydd.workers.dev/api/race/'+encodeURIComponent(raceId)+'?archive-check='+Date.now();
          const response=await fetch(url,{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
          const responseText=await response.text();
          assert.equal(response.status,200,responseText);
          const body=JSON.parse(responseText);
          assert.equal(body.ok,true);
          const detail=body.detail;
          assert.equal(detail?.id,raceId);
          const horse=detail.horses?.find(h=>Number(h.horseNumber)===2);
          assert.ok(horse,'target horse missing from saved race detail');
          const archive=horse.careerArchive;
          assert.ok(archive && typeof archive.payload==='string','career archive missing');
          assert.equal(archive.priorRaceDate,detail.date);
          const raw=gunzipSync(Buffer.from(archive.payload,'base64'));
          assert.equal(createHash('sha256').update(raw).digest('hex'),archive.sha256);
          const runs=JSON.parse(raw.toString('utf8'));
          assert.ok(Array.isArray(runs));
          assert.equal(runs.length,Number(archive.storedRunCount));
          assert.equal(Number(archive.bytes),raw.length);
          console.log('PRODUCTION_CAREER_ARCHIVE_OK',raceId,'horse=2','runs='+runs.length);
          JS
