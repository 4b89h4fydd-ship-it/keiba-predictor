name: ARVEXQ Cloudflare Validation

on:
  push:
    branches: [cloudflare]
    paths:
      - worker.js
      - wrangler.jsonc
      - package.json
      - .github/workflows/arvexq-cloudflare-validation.yml
  pull_request:
    branches: [cloudflare]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Worker syntax
        run: npm run check
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
