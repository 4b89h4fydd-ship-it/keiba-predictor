name: ARVEXQ Saved Forecast Replacement
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arvexq-saved-forecast-replacement.yml'
      - 'scripts/arvexq_rebuild_saved_forecasts.py'
  workflow_run:
    workflows: ['ARVEXQ API Private Storage Audit Deploy', 'ARVEXQ Web Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: arvexq-saved-forecast-production
  cancel-in-progress: false
jobs:
  replace:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      ARVEXQ_DATA_CORE: '0'
      ARVEXQ_BOOTSTRAP_WARM: '0'
      RACEDB_AUTO_UPDATE: '0'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the exact main revision and successful CI and Web deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def read(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          sha=os.environ['TARGET_SHA'];assert read('/branches/main')['commit']['sha']==sha
          required={'ARVEXQ Validation','ARVEXQ Recovery Regression','ARVEXQ Web Deploy'}
          for attempt in range(60):
              runs=read('/actions/runs?head_sha='+sha+'&per_page=100')['workflow_runs']
              passed={r['name'] for r in runs if r['conclusion']=='success' and r['head_branch']=='main'}
              failed=[r['name'] for r in runs if r['name'] in required and r['conclusion'] in ('failure','timed_out')]
              assert not failed,'RELATED_PRODUCTION_CHECK_FAILED: '+str(failed)
              if required<=passed:break
              time.sleep(10)
          else:raise SystemExit('Related main CI/deployment not successful; no data writes')
          print('EXACT_MAIN_CI_AND_WEB_DEPLOY_PASSED',sha)
          PY
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Fresh complete logical backup and verified restore before any revision writes
        run: python -u scripts/arvexq_backup_live_d1.py
      - name: Compress verified rollback backup
        run: |
          python - <<'PY'
          import gzip,json,shutil
          s=json.load(open('/tmp/arvexq-complete-d1-summary.json'));assert s['restore_verified'] and not s['original_sql_writes']
          with open('/tmp/arvexq-complete-d1.sqlite3','rb') as src,gzip.open('/tmp/arvexq-complete-d1.sqlite3.gz','wb') as dst:shutil.copyfileobj(src,dst)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: saved-forecast-original-backup-${{ github.run_id }}
          path: |
            /tmp/arvexq-complete-d1.sqlite3.gz
            /tmp/arvexq-complete-d1-summary.json
          retention-days: 30
      - name: Acquire official monthly and daily NAR archives through the existing route
        env:
          KEIBA_DATA_DIR: /tmp/revision-official-input
        run: |
          python -u - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import app,json,zipfile
          from pathlib import Path
          day=datetime.now(ZoneInfo('Asia/Tokyo')).date();sync=app.NarSync();errors=[]
          print(sync.sync_daily(force=True))
          for year,month in [(day.year,day.month),*app.iter_months_back(day,21)]:
              try:print(year,month,sync.sync_month(year,month,force=True),flush=True)
              except Exception as exc:
                  errors.append({'year':year,'month':month,'error':str(exc)})
                  print('OFFICIAL_MONTH_UNAVAILABLE',year,month,type(exc).__name__,flush=True)
          sync.store.conn.close()
          out=Path('/tmp/forecast-revisions');out.mkdir(exist_ok=True)
          (out/'official-acquisition-errors.json').write_text(json.dumps(errors,indent=2))
          with zipfile.ZipFile(out/'official-nar-inputs.zip','w') as z:
              for path in sorted(app.ARCHIVE_DIR.glob('*_race.zip')):z.write(path,path.name)
          PY
      - name: Recalculate every saved race with strictly earlier date training and official history
        run: python -u scripts/arvexq_rebuild_saved_forecasts.py --source /tmp/arvexq-complete-d1.sqlite3 --output /tmp/forecast-revisions --nar-archives /tmp/revision-official-input/nar/archives/*_race.zip
      - name: Check D1 capacity and add only new revision tables
        run: |
          python - <<'PY'
          import json,os,sqlite3,urllib.request
          from scripts.arvexq_rebuild_saved_forecasts import capacity_preview
          base='https://kraiz-api.4b89h4fydd.workers.dev';headers={'Authorization':'Bearer '+os.environ['SYNC_TOKEN'],'Content-Type':'application/json'}
          def read(path,data=None):
              with urllib.request.urlopen(urllib.request.Request(base+path,data=data,headers=headers),timeout=60) as r:return json.load(r)
          summary=json.load(open('/tmp/forecast-revisions/rebuild-summary.json'));assert summary['allSavedRebuilt']
          audit=read('/api/admin/storage-audit')['queries']
          page_size=audit['page_size']
          size=page_size['results'][0]['page_size']
          counted=audit.get('page_count') or {}
          if counted.get('results'):
              used=counted['results'][0]['page_count']*size
          else:
              # Cloudflare D1 rejects PRAGMA page_count (SQLITE_AUTH). Use its
              # own exact reported SQLite file size, never an assumed free capacity.
              used=(page_size.get('meta') or {}).get('size_after')
              assert type(used) is int and used>0,'Cannot verify D1 size before any write'
          preview=capacity_preview('/tmp/arvexq-complete-d1.sqlite3','/tmp/forecast-revisions/revisions.sqlite3','/tmp/revision-capacity-preview.sqlite3')
          with open('/tmp/forecast-revisions/capacity-preview.json','w') as f:json.dump(preview,f,indent=2)
          assert preview['originalsUnchanged'] and preview['revisionRows']==summary['revisions']
          required=preview['additionalBytes']
          # Conservative free-plan limit; fail before writes rather than guess paid quota.
          assert used+required*1.2+20000000<500000000,'Insufficient verified D1 headroom'
          response=read('/api/admin/forecast-revisions/migrate',b'{}')
          assert response['ok'] and response['original_tables_modified'] is False
          print('ADDITIVE_SCHEMA_READY_ORIGINAL_TABLES_UNCHANGED')
          PY
      - name: Publish all revisions and verify every saved revision by reloading API
        run: |
          python -u - <<'PY'
          import os
          from scripts.arvexq_rebuild_saved_forecasts import publish
          r=publish('/tmp/forecast-revisions/revisions.sqlite3','https://kraiz-api.4b89h4fydd.workers.dev',os.environ['SYNC_TOKEN'])
          print(r)
          assert r['allPublished'] and not r['failures']
          PY
      - name: Catch up races saved during recalculation and verify the complete current roster
        run: |
          python -u - <<'PY'
          import concurrent.futures,gzip,json,os,shutil,sqlite3,urllib.parse,urllib.request
          from pathlib import Path
          from scripts.arvexq_rebuild_saved_forecasts import rebuild,publish
          base='https://kraiz-api.4b89h4fydd.workers.dev';token=os.environ['SYNC_TOKEN']
          out=Path('/tmp/forecast-revisions');ledger=out/'revisions.sqlite3';copy=out/'catchup-source.sqlite3'
          shutil.copyfile('/tmp/arvexq-complete-d1.sqlite3',copy)
          archives=sorted(Path('/tmp/revision-official-input/nar/archives').glob('*_race.zip'))
          def fetch(params):
              req=urllib.request.Request(base+'/api/admin/snapshot-export?'+urllib.parse.urlencode(params),headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          rounds=[]
          for index in range(3):
              manifest=fetch({});assert manifest['ok'] and manifest['sql_writes']==0
              with sqlite3.connect(ledger) as db:known={row[0] for row in db.execute('SELECT race_id FROM revisions')}
              current={r['race_id'] for r in manifest['races']};missing=sorted(current-known)
              rounds.append({'round':index,'currentSavedRaces':len(current),'missing':len(missing)})
              if not missing:
                  report={'allCurrentSavedRacesUpdated':True,'currentSavedRaces':len(current),'rounds':rounds,'originalProductionSqlWrites':0}
                  (out/'all-current-saved-verification.json').write_text(json.dumps(report,indent=2));print(report);break
              def read(rid):
                  response=fetch({'table':'race_details','race_id':rid});assert response['ok'] and len(response['rows'])==1
                  return response['rows'][0]
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:rows=list(pool.map(read,missing))
              # Keep exact new originals before their separate revision is registered.
              with gzip.open(out/('catchup-originals-'+str(index)+'.json.gz'),'wt',encoding='utf-8') as file:json.dump(rows,file,ensure_ascii=False)
              with sqlite3.connect(copy) as db:
                  columns={row[1] for row in db.execute('PRAGMA table_info(race_details)')}
                  for row in rows:
                      assert set(row)<=columns
                      names=list(row)
                      db.execute('INSERT OR REPLACE INTO race_details ('+','.join(names)+') VALUES ('+','.join('?' for _ in names)+')',[row[k] for k in names])
              result=rebuild(copy,out,nar_archives=archives,only_missing=True);assert result['allSavedRebuilt']
              result=publish(ledger,base,token,only_ids=missing);assert result['allPublished'] and not result['failures']
          else:raise SystemExit('New races continued arriving; complete-current-roster verification remains pending')
          copy.unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-forecast-revisions-and-readback-${{ github.run_id }}
          path: /tmp/forecast-revisions
          retention-days: 30
