name: ARVEXQ Saved Forecast Replacement
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['ARVEXQ API Private Storage Audit Deploy']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: arvexq-saved-forecast-production
  cancel-in-progress: false
jobs:
  replace:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      ARVEXQ_DATA_CORE: '0'
      ARVEXQ_BOOTSTRAP_WARM: '0'
      RACEDB_AUTO_UPDATE: '0'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the exact main revision and successful CI and Web deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def read(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          sha=os.environ['TARGET_SHA'];assert read('/branches/main')['commit']['sha']==sha
          required={'ARVEXQ Validation','ARVEXQ Recovery Regression','ARVEXQ Web Deploy'}
          for attempt in range(60):
              runs=read('/actions/runs?head_sha='+sha+'&per_page=100')['workflow_runs']
              passed={r['name'] for r in runs if r['conclusion']=='success' and r['head_branch']=='main'}
              failed=[r['name'] for r in runs if r['name'] in required and r['conclusion'] in ('failure','timed_out')]
              assert not failed,'RELATED_PRODUCTION_CHECK_FAILED: '+str(failed)
              if required<=passed:break
              time.sleep(10)
          else:raise SystemExit('Related main CI/deployment not successful; no data writes')
          print('EXACT_MAIN_CI_AND_WEB_DEPLOY_PASSED',sha)
          PY
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Fresh complete logical backup and verified restore before any revision writes
        run: python -u scripts/arvexq_backup_live_d1.py
      - name: Compress verified rollback backup
        run: |
          python - <<'PY'
          import gzip,json,shutil
          s=json.load(open('/tmp/arvexq-complete-d1-summary.json'));assert s['restore_verified'] and not s['original_sql_writes']
          with open('/tmp/arvexq-complete-d1.sqlite3','rb') as src,gzip.open('/tmp/arvexq-complete-d1.sqlite3.gz','wb') as dst:shutil.copyfileobj(src,dst)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: saved-forecast-original-backup-${{ github.run_id }}
          path: |
            /tmp/arvexq-complete-d1.sqlite3.gz
            /tmp/arvexq-complete-d1-summary.json
          retention-days: 30
      - name: Recalculate every saved race with strictly earlier date training
        run: python -u scripts/arvexq_rebuild_saved_forecasts.py --source /tmp/arvexq-complete-d1.sqlite3 --output /tmp/forecast-revisions
      - name: Check D1 capacity and add only new revision tables
        run: |
          python - <<'PY'
          import json,os,sqlite3,urllib.request
          base='https://kraiz-api.4b89h4fydd.workers.dev';headers={'Authorization':'Bearer '+os.environ['SYNC_TOKEN'],'Content-Type':'application/json'}
          def read(path,data=None):
              with urllib.request.urlopen(urllib.request.Request(base+path,data=data,headers=headers),timeout=60) as r:return json.load(r)
          summary=json.load(open('/tmp/forecast-revisions/rebuild-summary.json'));assert summary['allSavedRebuilt']
          audit=read('/api/admin/storage-audit')['queries']
          pages=audit['page_count']['results'][0]['page_count'];size=audit['page_size']['results'][0]['page_size']
          with sqlite3.connect('/tmp/forecast-revisions/revisions.sqlite3') as db:required=db.execute('SELECT SUM(length(CAST(payload_json AS BLOB))) FROM revisions').fetchone()[0]
          # Conservative free-plan limit; fail before writes rather than guess paid quota.
          assert pages*size+required*2+20000000<500000000,'Insufficient verified D1 headroom'
          response=read('/api/admin/forecast-revisions/migrate',b'{}')
          assert response['ok'] and response['original_tables_modified'] is False
          print('ADDITIVE_SCHEMA_READY_ORIGINAL_TABLES_UNCHANGED')
          PY
      - name: Publish all revisions and verify every saved revision by reloading API
        run: |
          python -u - <<'PY'
          import os
          from scripts.arvexq_rebuild_saved_forecasts import publish
          r=publish('/tmp/forecast-revisions/revisions.sqlite3','https://kraiz-api.4b89h4fydd.workers.dev',os.environ['SYNC_TOKEN'])
          print(r)
          assert r['allPublished'] and not r['failures']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-forecast-revisions-and-readback-${{ github.run_id }}
          path: /tmp/forecast-revisions
          retention-days: 30
