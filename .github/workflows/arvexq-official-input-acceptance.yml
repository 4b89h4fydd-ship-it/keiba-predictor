name: ARVEXQ Official Input Acceptance
on:
  workflow_dispatch:
  push:
    branches: [feature/forecast-reset-20261016]
    paths: ['scripts/arvexq_official_input_acceptance.py', '.github/workflows/arvexq-official-input-acceptance.yml']
permissions:
  contents: read
concurrency:
  group: arvexq-official-input-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARVEXQ_DATA_CORE: '0'
      ARVEXQ_BOOTSTRAP_WARM: '0'
      RACEDB_AUTO_UPDATE: '0'
      KEIBA_DATA_DIR: /tmp/arvexq-official-acceptance/local-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - name: Acquire actual JRA and NAR official racecards through existing routes
        run: |
          TARGET_DATE=$(TZ=Asia/Tokyo date +%F)
          PYTHONPATH=. python -u scripts/arvexq_official_input_acceptance.py \
            --date "$TARGET_DATE" --min-races 30 --nar-months 3 \
            --output /tmp/arvexq-official-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-input-acceptance-${{ github.run_id }}
          path: /tmp/arvexq-official-acceptance
          retention-days: 14
