name: KEIRIN LAB Deploy (independent Worker)
on:
  push:
    branches: [main]
    paths:
      - 'keirin-lab/**'
      - '.github/workflows/keirin-lab-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keirin-lab-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate standalone KEIRIN assets
        run: |
          test -s keirin-lab/public/index.html
          grep -q 'KEIRIN LAB' keirin-lab/public/index.html
          test -s keirin-lab/wrangler.toml
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate KEIRIN model and browser scripts
        run: |
          python -m unittest discover -s keirin-lab/scripts -p 'test_*.py' -v
          node --check keirin-lab/public/engine.js
          node --check keirin-lab/public/app.js
      - name: Deploy standalone Cloudflare Worker
        working-directory: keirin-lab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify public HTTPS endpoint
        run: |
          curl -fsS --retry 8 --retry-delay 5 --max-time 20 https://keirin-lab.4b89h4fydd.workers.dev/ -o /tmp/keirin-page.html
          grep -q 'KEIRIN LAB' /tmp/keirin-page.html
