name: ARVEXQ Feature Domain Split

"on":
  push:
    branches: [main]
    paths:
      - scripts/arvexq_split_feature_domains.py

permissions:
  contents: write

concurrency:
  group: arvexq-feature-domain-split
  cancel-in-progress: true

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply UI migration
        run: python scripts/arvexq_split_feature_domains.py

      - name: Validate Python domains
        run: |
          python -m py_compile \
            arvexq/race_card.py \
            arvexq/history.py \
            arvexq/horse_detail.py \
            arvexq/diagnosis.py \
            arvexq/pace_prediction.py \
            arvexq/odds.py \
            arvexq/race_conditions.py \
            arvexq/services/race_analysis.py
          python - <<'PY'
          from arvexq.services.race_analysis import prepare_race_detail
          sample={
              'id':'smoke-1','track':'大井','surface':'ダート','distance':1200,
              'horses':[{
                  'horseNumber':1,'name':'テストホース','jockey':'騎手A','trainer':'厩舎A',
                  'recentRaces':[{'date':'2026-10-01','track':'大井','distance':1200,'finish':2}],
              }],
          }
          out=prepare_race_detail(sample)
          assert out['horseDetailView'][0]['recentFive'][0]['finish']==2
          assert out['diagnosisView'][0]['horseDetail']['recentFive']
          assert out['raceCardView'][0]['number']==1
          assert 'pacePredictionView' in out and 'oddsView' in out and 'raceConditionsView' in out
          print('ARVEXQ_FEATURE_DOMAIN_SMOKE_OK')
          PY

      - name: Validate frontend
        run: |
          node --check arvexq/ui/static/app.js
          python build_static.py
          grep -q "直近5走・適性・騎手/調教師・血統" arvexq/ui/static/app.js
          if grep -q "tab('詳細','detail')" arvexq/ui/static/app.js; then
            echo "::error::Standalone detail tab still exists"
            exit 1
          fi

      - name: Commit migrated UI
        shell: bash
        run: |
          if git diff --quiet -- arvexq/ui/static/app.js; then
            echo "::error::UI migration produced no diff"
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arvexq/ui/static/app.js
          git commit -m "refactor: fold horse detail and past runs into diagnosis"
          git push origin HEAD:main
