name: ARVEXQ Selection Evidence

on:
  pull_request:
    branches: [main]
    paths: ['rewrite/selection/**', 'scripts/arvexq_selection*', 'scripts/arvexq_separate_targets.py', 'arvexq/ui/static/morning/**', 'arvexq/ui/static/app.js', 'tests/test_selection*', 'tests/test_separate_targets.py', '.github/workflows/arvexq-selection-evidence.yml']
  push:
    branches: [main]
    paths: ['rewrite/selection/**', 'scripts/arvexq_selection*', 'scripts/arvexq_separate_targets.py', 'arvexq/ui/static/morning/**', 'tests/test_selection*', 'tests/test_separate_targets.py', '.github/workflows/arvexq-selection-evidence.yml']
  workflow_run:
    workflows: ['ARVEXQ Realtime Sync']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '3-59/5 0-12,21-23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvexq-selection-evidence-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify independent targets, timestamps, immutable evidence and purchase gating
        run: |
          python -m unittest tests.test_selection_market_policy tests.test_separate_targets -v
          node scripts/arvexq_selection_policy_smoke.js
          node scripts/arvexq_morning_picks_smoke.js
          node scripts/arvexq_morning_picks_runner_smoke.js
          node scripts/arvexq_morning_evidence_smoke.js
          node --check arvexq/ui/static/app.js

  observe:
    needs: contracts
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: day
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: var/selection/market.sqlite3
          key: selection-market-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: selection-market-${{ steps.day.outputs.date }}-
      - name: Record observed prices and independently frozen candidate outputs
        run: python scripts/arvexq_selection_odds.py
      - name: Preserve all run evidence, including unavailable observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/selection/market.jsonl
            var/selection/forward.jsonl
            var/selection/market-report.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: var/selection/market.sqlite3
          key: selection-market-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish per-race purchase records without changing forecasts or past morning archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arvexq/ui/static/selection-decisions/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publish verified per-race purchase records ${{ steps.day.outputs.date }}"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run arvexq-web-deploy.yml --ref main
