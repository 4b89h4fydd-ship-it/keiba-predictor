name: ARVEXQ Full Prefetch

"on":
  workflow_dispatch:
    inputs:
      date:
        description: "Target date YYYY-MM-DD (blank = today JST)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - app.py
      - scripts/arvexq_prefetch.py
      - scripts/arvexq_apply_learned_overlay.py
      - scripts/arvexq_morning_picks.js
      - scripts/arvexq_merge_morning_output.py
      - scripts/arvexq_sync_batches.py
      - scripts/arvexq_fetch_d1_bundle.py
      - scripts/arvexq_protect_sync.py
      - scripts/arvexq_select_prefetch_repairs.py
      - scripts/arvexq_verify_persisted_inputs.py
      - scripts/arvexq_sqlite_health.py
      - arvexq/pipeline/fingerprints.py
      - arvexq/pipeline/persisted_inputs.py
      - arvexq/prediction/**
      - arvexq/ingest/**
      - arvexq/databanks/**
      - .github/workflows/arvexq-prefetch.yml
  schedule:
    # Early discovery plus periodic refreshes while JRA/NAR cards/results change.
    # JST: 05:30 discovery / 06:30 first morning freeze / 07:30 / 08:30 / 11:30 / 12:30 / 14:30 / 16:30 / 18:30 / 20:30
    - cron: "30 20 * * *"
    - cron: "30 21 * * *"
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
    - cron: "30 2 * * *"
    - cron: "30 3,5,7,9,11 * * *"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: arvexq-full-prefetch-${{ github.event.inputs.date || 'today' }}
  # A mid-run code push must not cancel the dawn manifest publication.
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-data
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_COLLECT_ONLY: "1"
      RACEDB_AUTO_UPDATE: "0"
      NAR_ON_DEMAND_HISTORY_MONTHS: "12"
      ARVEXQ_PREFETCH_WORKERS: "1"
      ARVEXQ_PREFETCH_ANALYSIS_WORKERS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Resolve target date
        env:
          REQUESTED_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            TARGET_DATE="$REQUESTED_DATE"
          else
            TARGET_DATE=$(TZ=Asia/Tokyo date +%F)
          fi
          if ! echo "$TARGET_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Invalid date: $TARGET_DATE"
            exit 1
          fi
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"

      - name: Restore ARVEXQ data cache
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-prefetch-${{ runner.os }}-${{ env.TARGET_DATE }}-${{ github.run_id }}
          restore-keys: |
            arvexq-prefetch-${{ runner.os }}-${{ env.TARGET_DATE }}-
            arvexq-data-${{ runner.os }}-${{ env.TARGET_DATE }}-
            arvexq-data-${{ runner.os }}-

      - name: Validate restored SQLite cache
        run: |
          mkdir -p .arvexq-data
          chmod -R u+rwX .arvexq-data || true
          python -m py_compile scripts/arvexq_sqlite_health.py
          python scripts/arvexq_sqlite_health.py --root "$KEIBA_DATA_DIR"
          test -w .arvexq-data

      - name: Start ARVEXQ locally
        run: |
          nohup python -c 'import app,uvicorn; app.last3f=None; uvicorn.run(app.app,host="127.0.0.1",port=8000)' > /tmp/arvexq-prefetch.log 2>&1 &
          echo $! > /tmp/arvexq-prefetch.pid
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/health > /dev/null; then
              echo "ARVEXQ ready"
              exit 0
            fi
            sleep 1
          done
          tail -n 80 /tmp/arvexq-prefetch.log || true
          exit 1

      - name: Discover all officially available races
        run: |
          # Forced refresh is the preferred source. Never overwrite a valid
          # official discovery with a second, possibly stale request.
          rm -f bundle.json
          if curl -fsS --retry 1 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 90 \
            "http://127.0.0.1:8000/api/v1/site-bootstrap?date=$TARGET_DATE&force=1" \
            -o bundle.json && \
            jq -e '(.races | type) == "array" and ((.races | length) > 0)' bundle.json > /dev/null; then
            echo "FULL_PREFETCH forced discovery complete"
          else
            echo "::warning::Forced discovery unavailable or empty; trying existing official cache"
            rm -f bundle.json
            curl -fsS --retry 1 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 45 \
              "http://127.0.0.1:8000/api/v1/site-bootstrap?date=$TARGET_DATE" \
              -o bundle.json || true
          fi
          RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
          echo "FULL_PREFETCH races=$RACES date=$TARGET_DATE"
          if [ "$RACES" -le 0 ]; then
            echo "No officially available races; no fabricated data created."
            exit 0
          fi

      - name: Publish official day summaries before heavy prediction work
        run: |
          # Reorder the existing D1 cold-start sync; no new data acquisition lane.
          RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
          if [ "$RACES" -le 0 ]; then
            echo "D1_EARLY_SUMMARIES_NO_OFFICIAL_RACES date=$TARGET_DATE"
            exit 0
          fi
          # Early D1 failures must not block the independent static rescue step.
          # The later D1 verification still fails the job if publishing is incomplete.
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::D1_EARLY_SUMMARIES_MISSING_SYNC_TOKEN; static rescue continues"
            exit 0
          fi
          if ! curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 35 \
            "$CLOUDFLARE_API_BASE/api/day?date=$TARGET_DATE&details=0" -o initial-d1-day.json; then
            echo "::warning::D1_EARLY_SUMMARIES_READ_FAILED; static rescue continues"
            exit 0
          fi
          if ! jq -e '.ok == true and (.races | type == "array")' initial-d1-day.json >/dev/null; then
            echo "::warning::D1_EARLY_SUMMARIES_INVALID_DAY; static rescue continues"
            exit 0
          fi
          EXISTING=$(jq '.races | length' initial-d1-day.json)
          if [ "$EXISTING" -eq 0 ]; then
            jq -n --slurpfile source bundle.json \
              '{summaries: $source[0].races, details: [], meta: {source: "arvexq-cold-start-race-summaries-v1", sync_batch: true, sync_batch_kind: "summaries"}}' \
              > initial-day-summaries.json
            echo "D1_EARLY_SUMMARIES_WRITE date=$TARGET_DATE races=$RACES"
            if ! python scripts/arvexq_d1_capacity_guard.py \
              --file initial-day-summaries.json --api-base "$CLOUDFLARE_API_BASE" --max-bytes 4000000; then
              echo "::warning::D1_EARLY_SUMMARIES_WRITE_BLOCKED; static rescue continues"
              exit 0
            fi
          else
            echo "D1_EARLY_SUMMARIES_ALREADY_EXISTS date=$TARGET_DATE count=$EXISTING"
          fi
          if ! curl -fsS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 35 \
            "$CLOUDFLARE_API_BASE/api/day?date=$TARGET_DATE&details=0&t=$(date +%s)" -o verified-early-day.json; then
            echo "::warning::D1_EARLY_SUMMARIES_VERIFY_READ_FAILED; static rescue continues"
            exit 0
          fi
          if ! python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path("bundle.json").read_text(encoding="utf-8"))
          remote=json.loads(Path("verified-early-day.json").read_text(encoding="utf-8"))
          expected={str(r["id"]) for r in source["races"] if isinstance(r,dict) and r.get("id")}
          actual={str(r["id"]) for r in remote.get("races",[]) if isinstance(r,dict) and r.get("id")}
          missing=sorted(expected-actual)
          print("D1_EARLY_SUMMARIES_VERIFY", "expected=",len(expected),"actual=",len(actual),"missing=",len(missing))
          if not remote.get("ok") or missing:
              raise SystemExit("D1_EARLY_SUMMARIES_INCOMPLETE: "+",".join(missing[:12]))
          PY
          then
            echo "::warning::D1_EARLY_SUMMARIES_INCOMPLETE; static rescue continues"
          fi

      - name: Stop bootstrap server to release SQLite writers
        run: |
          # Bootstrap HTTP discovery has finished; diagnosis uses app.py directly.
          # A concurrent Uvicorn background writer was locking the same RaceDB.
          if [ -f /tmp/arvexq-prefetch.pid ]; then
            PID=$(cat /tmp/arvexq-prefetch.pid)
            kill "$PID" 2>/dev/null || true
            for i in $(seq 1 12); do
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
              sleep 1
            done
          fi

      - name: Collect racecards and full careers without running predictions
        run: |
          RACES=$(jq '.races // [] | length' bundle.json 2>/dev/null || echo 0)
          if [ "$RACES" -le 0 ]; then
            echo '{"summaries":[],"details":[],"meta":{"race_count":0,"pipeline_stage":"facts_stored_pending_d1"}}' > prefetch-facts.json
            echo '{"races":0,"missing_card":[],"missing_analysis":[],"analysis_errors":{},"card_errors":{}}' > prefetch-facts-report.json
            exit 0
          fi
          python -m py_compile scripts/arvexq_prefetch.py
          if ! python - <<'PY' > prefetch-collect.log 2>&1
          import app, runpy, sys
          app.last3f = None
          sys.argv = [
              'scripts/arvexq_prefetch.py', '--phase', 'collect',
              '--bundle', 'bundle.json',
              '--payload', 'prefetch-facts.json',
              '--report', 'prefetch-facts-report.json',
              '--workers', '1', '--analysis-workers', '1',
          ]
          runpy.run_path('scripts/arvexq_prefetch.py', run_name='__main__')
          PY
          then
            echo "::error::FACT_COLLECTION_FAILED"
            tail -n 70 prefetch-collect.log || true
            exit 1
          fi
          jq '{races,details,cards_ready,missing_card,card_errors}' prefetch-facts-report.json

      - name: Publish lightweight racecards independent of D1 capacity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A D1-full incident must not erase every publicly visible roster.
          # The artifact includes only observed pre-off runner identities;
          # no post-off predictions, results, provisional odds or marks.
          cp prefetch-facts.json /tmp/arvexq-static-racecards-source.json
          git config user.name "ARVEXQ Racecard Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B publish-static-racecards origin/main
            if ! python scripts/arvexq_publish_racecards_static.py \
              --input /tmp/arvexq-static-racecards-source.json; then
              echo "::warning::No verified complete racecards available for static rescue"
              break
            fi
            FILE="arvexq/ui/static/racecards/$TARGET_DATE.json"
            if [ ! -s "$FILE" ]; then
              echo "::warning::Static racecard fallback has no validated archive"
              break
            fi
            git add "$FILE"
            if git diff --cached --quiet; then
              echo "STATIC_RACECARDS_ALREADY_PUBLISHED"
              published=1
              break
            fi
            git commit -m "data: immutable fallback racecards $TARGET_DATE"
            if git push origin HEAD:main; then
              published=1
              gh workflow run arvexq-web-deploy.yml --ref main || \
                echo "::warning::Static racecards committed but deploy dispatch failed"
              echo "STATIC_RACECARDS_PUBLISHED $FILE"
              break
            fi
            echo "::warning::Racecard publish race, retrying on latest main"
          done
          if [ "$published" -ne 1 ]; then
            echo "::warning::Static racecard publication pending; continue original D1 repair"
          fi
          git checkout -B prefetch-continue HEAD

      - name: Persist collected facts using the existing D1 sync pipeline
        run: |
          RACES=$(jq '.meta.race_count // 0' prefetch-facts.json)
          if [ "$RACES" -le 0 ]; then
            echo "D1_FACTS_NO_RACES"
            exit 0
          fi
          python scripts/arvexq_fetch_d1_bundle.py \
            --api-base "$CLOUDFLARE_API_BASE" --date "$TARGET_DATE" \
            --out facts-current-d1.json --report facts-current-d1-report.json \
            --workers 4 --retries 6 --allow-missing-details --allow-empty-day
          python scripts/arvexq_select_prefetch_repairs.py \
            --prepared prefetch-facts.json --current facts-current-d1.json \
            --out facts-sync-payload.json --report facts-sync-selection.json
          python scripts/arvexq_sync_batches.py \
            --input facts-sync-payload.json --out-dir facts-sync-batches
          COUNT=$(find facts-sync-batches -type f -name 'batch-*.json' | wc -l | tr -d ' ')
          test "$COUNT" -gt 0
          for file in facts-sync-batches/batch-*.json; do
            PYTHONPATH=. python scripts/arvexq_protect_sync.py --file "$file" --api-base "$CLOUDFLARE_API_BASE"
            python scripts/arvexq_d1_capacity_guard.py \
              --file "$file" --api-base "$CLOUDFLARE_API_BASE" --max-bytes 4000000
            PYTHONPATH=. python scripts/arvexq_protect_sync.py --verify-post --file "$file" --api-base "$CLOUDFLARE_API_BASE"
          done
          echo "D1_FACTS_SYNC_DONE batches=$COUNT"

      - name: Read D1 facts back and require identical horse/history evidence
        run: |
          RACES=$(jq '.meta.race_count // 0' prefetch-facts.json)
          if [ "$RACES" -le 0 ]; then
            echo '{"races":[],"details":[]}' > persisted-facts.json
            exit 0
          fi
          python scripts/arvexq_fetch_d1_bundle.py \
            --api-base "$CLOUDFLARE_API_BASE" --date "$TARGET_DATE" \
            --out persisted-facts.json --report persisted-facts-report.json \
            --workers 4 --retries 6 --allow-missing-details
          python scripts/arvexq_verify_persisted_inputs.py \
            --source prefetch-facts.json --saved persisted-facts.json \
            --report persisted-evidence-check.json
          echo "D1_STORED_EVIDENCE_VERIFIED"

      - name: Analyze only persisted D1 data and prepare original marks and bets
        run: |
          RACES=$(jq '.races // [] | length' persisted-facts.json)
          if [ "$RACES" -le 0 ]; then
            echo '{"summaries":[],"details":[],"meta":{"race_count":0,"missing_card_count":0,"missing_analysis_count":0}}' > prefetch-payload.json
            echo '{"races":0,"missing_card":[],"missing_analysis":[],"analysis_errors":{},"card_errors":{}}' > prefetch-report.json
            exit 0
          fi
          if ! python - <<'PY' > prefetch-analysis.log 2>&1
          import app, runpy, sys
          app.last3f = None
          sys.argv = [
              'scripts/arvexq_prefetch.py', '--phase', 'analyze',
              '--bundle', 'persisted-facts.json',
              '--payload', 'prefetch-payload.json',
              '--report', 'prefetch-report.json',
              '--workers', '1', '--analysis-workers', '1',
          ]
          runpy.run_path('scripts/arvexq_prefetch.py', run_name='__main__')
          PY
          then
            echo "::error::D1_ONLY_ANALYSIS_FAILED"
            tail -n 70 prefetch-analysis.log || true
            exit 1
          fi
          jq '{races,analysis_ready,analysis_errors}' prefetch-report.json

      - name: Prepare previous-day research training corpus (optional)
        timeout-minutes: 5
        continue-on-error: true
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .arvexq-data
          rm -f .arvexq-data/research-models.json
          # Yesterday normally has NAR; the last preceding weekend is needed
          # to train JRA on Saturdays when Friday has no JRA races.
          python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path
          target = date.fromisoformat(__import__('os').environ['TARGET_DATE'])
          days = [target - timedelta(days=1)]
          for offset in range(2, 9):
              previous = target - timedelta(days=offset)
              if previous.weekday() in (5, 6):
                  days.append(previous)
          Path('research-training-dates.txt').write_text(
              '\n'.join(sorted({d.isoformat() for d in days}, reverse=True)[:3]) + '\n')
          PY
          mkdir -p research-training-inputs
          while IFS= read -r TRAIN_DATE; do
            if python scripts/arvexq_fetch_d1_bundle.py \
              --api-base "$CLOUDFLARE_API_BASE" \
              --date "$TRAIN_DATE" \
              --out "research-training-inputs/$TRAIN_DATE.json" \
              --report "research-training-inputs/$TRAIN_DATE-report.json" \
              --workers 3; then
              echo "RESEARCH_TRAINING_SOURCE_OK $TRAIN_DATE"
            else
              rm -f "research-training-inputs/$TRAIN_DATE.json"
              echo "::warning::RESEARCH_TRAINING_SOURCE_UNAVAILABLE $TRAIN_DATE"
            fi
          done < research-training-dates.txt
          python scripts/arvexq_train_research_models.py \
            --input-dir research-training-inputs \
            --target-date "$TARGET_DATE" \
            --output .arvexq-data/research-models.json \
            --report research-training-model-report.json

      - name: Capture optional preoff research candidates (not production picks)
        timeout-minutes: 5
        continue-on-error: true
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          MODEL_PATH=".arvexq-data/research-models.json"
          if [ ! -s "$MODEL_PATH" ]; then
            echo "RESEARCH_CAPTURE_SKIPPED: earlier trained circuit models unavailable"
            exit 0
          fi
          if [ ! -s prefetch-payload.json ]; then
            echo "RESEARCH_CAPTURE_SKIPPED: no prepared race payload"
            exit 0
          fi
          python scripts/arvexq_capture_batch_research.py \
            --bundle prefetch-payload.json \
            --models "$MODEL_PATH" \
            --receipt-dir research-preoff-receipts \
            --report research-preoff-capture-report.json

      - name: Report research capture operational evidence
        timeout-minutes: 1
        continue-on-error: true
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          trained = Path('research-training-model-report.json')
          capture = Path('research-preoff-capture-report.json')
          output = {
              'version': 'arvexq-research-operations-v1',
              'trainingReportPresent': trained.is_file(),
              'captureReportPresent': capture.is_file(),
              'training': json.loads(trained.read_text()) if trained.is_file() else None,
              'capture': json.loads(capture.read_text()) if capture.is_file() else None,
              'receiptCount': len(list(Path('research-preoff-receipts').glob('*.json'))),
              'productionRecommendedTicketsChanged': False,
          }
          from arvexq.backtest.audit_research_capture import audit_capture
          receipt_audit = audit_capture(
              'research-preoff-receipts',
              output['capture'] if output['captureReportPresent'] else None,
          )
          output['receiptAudit'] = receipt_audit
          output['captureVerified'] = receipt_audit['verified']
          # Surface zero-capture failures in the job summary without exposing cards.
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## ARVEXQ 発走前研究用予想の収集実績\n\n')
              summary.write(f"- 学習結果あり: {output['trainingReportPresent']}\n")
              summary.write(f"- 収集結果あり: {output['captureReportPresent']}\n")
              summary.write(f"- 保存レシート件数: {output['receiptCount']}\n")
              summary.write(f"- 保存レシート整合性確認: {output['captureVerified']}\n")
              summary.write('- 注: 研究用予想であり、本番推奨や的中率80%達成を示さない\n')
          if not output['captureVerified']:
              print('::warning::RESEARCH_PREOFF_CAPTURE_NOT_VERIFIED (see archived operational report)')
          Path('research-operational-report.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + '\n')
          print('RESEARCH_CAPTURE_OPERATIONAL', json.dumps({
              'trained': output['trainingReportPresent'],
              'captured': output['captureVerified'],
              'receipts': output['receiptCount'],
          }))
          PY

      - name: Record research capture result in progress issue
        timeout-minutes: 1
        continue-on-error: true
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report = null;
            try { report = JSON.parse(fs.readFileSync('research-operational-report.json', 'utf8')); }
            catch (error) { core.warning('Research operational report unavailable: ' + error.message); }
            const count = report?.receiptCount ?? 'unknown';
            const audited = report?.captureVerified === true;
            const trained = report?.training?.trainedCircuits ?? [];
            const skipped = report?.capture?.skipped ?? {};
            const failureCounts = {};
            if (skipped && typeof skipped === 'object' && !Array.isArray(skipped)) {
              for (const reason of Object.values(skipped)) {
                const key = String(reason || 'unknown').slice(0, 160);
                failureCounts[key] = (failureCounts[key] || 0) + 1;
              }
            }
            const topFailures = Object.entries(failureCounts)
              .sort((a, b) => b[1] - a[1])
              .slice(0, 5)
              .map(([reason, count]) => count + ' x ' + reason)
              .join('; ') || 'none';
            const body = [
              'ARVEXQ automated research-only capture audit',
              '- workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '- target date (JST): ' + process.env.TARGET_DATE,
              '- trained circuits: ' + (trained.length ? trained.join(', ') : 'none/unknown'),
              '- frozen research receipts: ' + count,
              '- skipped race count: ' + Object.keys(skipped).length,
              '- most frequent skip reasons: ' + topFailures,
              '- receipt integrity verified (local only): ' + audited,
              '- independently proven preoff / held-out: false',
              '- production ticket target 80%: not established'
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo, issue_number: 217, body
            });

      - name: Archive research-only preoff receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-research-preoff-${{ github.run_id }}
          path: |
            research-preoff-receipts/
            research-preoff-capture-report.json
            research-training-model-report.json
            research-training-fetch.json
            research-operational-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Calibrate ticket hit rates from sealed previous-day results
        run: |
          python scripts/arvexq_empirical_ticket_calibration.py \
            --date "$TARGET_DATE" --api-base "$CLOUDFLARE_API_BASE"
          echo "Calibration based only on pre-off saved model-v2 tickets and official results"

      - name: Publish empirical calibration independently of immutable morning originals
        run: |
          set -euo pipefail
          RECORDS=arvexq/ui/static/morning/hit_rate_records.json
          CALIB=arvexq/ui/static/morning/hit_rate_calibration.json
          python - <<'PY'
          import json
          from pathlib import Path
          records=json.loads(Path('arvexq/ui/static/morning/hit_rate_records.json').read_text())
          calibration=json.loads(Path('arvexq/ui/static/morning/hit_rate_calibration.json').read_text())
          if not isinstance(records,dict) or calibration.get('totalVerifiedRaces') != len(records):
              raise SystemExit('EMPIRICAL_CALIBRATION_INVALID: preserve previous originals')
          PY
          cp "$RECORDS" /tmp/arvexq-hit-records.json
          cp "$CALIB" /tmp/arvexq-hit-calibration.json
          git config user.name "ARVEXQ Morning Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add --detach /tmp/arvexq-calibration-publish origin/main
          (
            cd /tmp/arvexq-calibration-publish
            cp /tmp/arvexq-hit-records.json "$RECORDS"
            cp /tmp/arvexq-hit-calibration.json "$CALIB"
            python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          # Never erase already-published evidence from an older checkout.
          previous=subprocess.run(['git','show','HEAD:arvexq/ui/static/morning/hit_rate_records.json'],
                                  capture_output=True,text=True,check=True)
          old=json.loads(previous.stdout)
          fresh=json.loads(Path('arvexq/ui/static/morning/hit_rate_records.json').read_text())
          if any(key not in fresh or fresh[key]!=value for key,value in old.items()):
              raise SystemExit('EMPIRICAL_CALIBRATION_STALE: refusing to overwrite original records')
          PY
            git add "$RECORDS" "$CALIB"
            if git diff --cached --quiet; then
              echo "EMPIRICAL_CALIBRATION_UNCHANGED"
            else
              git commit -m "data: publish independently verified ticket hit calibration $TARGET_DATE"
              for try in 1 2 3 4 5; do
                if git push origin HEAD:main; then break; fi
                git fetch origin main
                git rebase origin/main
                if [ "$try" -eq 5 ]; then exit 1; fi
              done
            fi
          )
          git worktree remove /tmp/arvexq-calibration-publish

      - name: Apply new learned forecast overlay to day predictions
        run: |
          if [ -s .arvexq-data/research-models.json ] && [ -s prefetch-payload.json ]; then
            PYTHONPATH=. python scripts/arvexq_apply_learned_overlay.py \
              --bundle prefetch-payload.json \
              --models .arvexq-data/research-models.json \
              --out prefetch-learned.json \
              --report learned-overlay-report.json
            mv prefetch-learned.json prefetch-payload.json
          else
            echo "::warning::LEARNED_OVERLAY_NOT_APPLIED: no earlier trained model"
          fi

      - name: Freeze morning selected and special predictions for all races
        run: |
          # The same UI analysis logic runs headlessly on the full prepared day.
          # Once the first post has passed we never backfill a new morning pick.
          node --check scripts/arvexq_morning_picks.js
          node scripts/arvexq_morning_picks.js prefetch-payload.json prefetch-morning.json
          # Node rewrites 1.0 as 1 and breaks frozen feature hashes; keep
          # Python bytes and take only the morning-pick fields from Node.
          python scripts/arvexq_merge_morning_output.py \
            --original prefetch-payload.json \
            --node-output prefetch-morning.json \
            --out prefetch-merged.json
          mv prefetch-merged.json prefetch-payload.json
          rm -f prefetch-morning.json

      - name: Publish fixed morning race list as a Cloudflare static asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/arvexq_publish_morning_static.py --input prefetch-payload.json
          FILE="arvexq/ui/static/morning-picks/$TARGET_DATE.json"
          if [ ! -s "$FILE" ]; then
            echo "::warning::Morning decision not ready before first race. No late picks created."
            exit 0
          fi
          cp "$FILE" /tmp/arvexq-morning-picks.json
          git config user.name "ARVEXQ Morning Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git cat-file -e "origin/main:$FILE" 2>/dev/null; then
            echo "MORNING_ARCHIVE_ALREADY_EXISTS first version remains immutable"
            exit 0
          fi
          git checkout -B publish-morning-picks origin/main
          mkdir -p "$(dirname "$FILE")"
          cp /tmp/arvexq-morning-picks.json "$FILE"
          git add "$FILE"
          git commit -m "data: freeze morning picks for $TARGET_DATE"
          done_push=0
          for try in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              done_push=1
              break
            fi
            git fetch origin main
            if git cat-file -e "origin/main:$FILE" 2>/dev/null; then
              echo "MORNING_ARCHIVE_PUBLISHED_BY_ANOTHER_RUN"
              done_push=1
              break
            fi
            git rebase origin/main
          done
          if [ "$done_push" -ne 1 ]; then
            echo "::error::Morning static archive could not be published"
            exit 1
          fi
          # GITHUB_TOKEN push does not automatically trigger push workflows.
          # Explicit dispatch deploys the immutable JSON to the public Worker.
          gh workflow run arvexq-web-deploy.yml --ref main || echo "::warning::Static archive committed; Web Deploy dispatch not accepted"
          echo "STATIC_MORNING_PICKS_ARCHIVED $FILE"

      - name: Preserve lossless prediction originals before D1 writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/arvexq_publish_saved_snapshots.py --root .arvexq-data --input prefetch-payload.json --date "$TARGET_DATE"
          if [ ! -s "arvexq/ui/static/saved-snapshots/$TARGET_DATE.json" ]; then
            echo "::error::No complete snapshots available for verified independent backup"
            exit 1
          fi
          git add arvexq/ui/static/saved-snapshots
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "ARVEXQ Snapshot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: preserve verified original snapshots $TARGET_DATE before D1 sync"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run arvexq-web-deploy.yml --ref main

      - name: Select only missing or thin D1 details
        run: |
          RACES=$(jq '.meta.race_count // 0' prefetch-payload.json)
          if [ "$RACES" -le 0 ]; then
            cp prefetch-payload.json prefetch-sync-payload.json
            exit 0
          fi
          python scripts/arvexq_fetch_d1_bundle.py \
            --api-base "$CLOUDFLARE_API_BASE" \
            --date "$TARGET_DATE" \
            --out current-d1.json \
            --report current-d1-report.json \
            --workers 4 \
            --retries 6 \
            --allow-missing-details \
            --allow-empty-day
          # Day summaries are committed and verified immediately after official discovery.
          python scripts/arvexq_select_prefetch_repairs.py \
            --prepared prefetch-payload.json \
            --current current-d1.json \
            --out prefetch-sync-payload.json \
            --report prefetch-repair-selection.json
          jq '{prepared,existing,existing_rich,repair_count}' prefetch-repair-selection.json

      - name: Push prepared day repairs to D1 in safe batches
        run: |
          RACES=$(jq '.meta.race_count // 0' prefetch-sync-payload.json)
          if [ "$RACES" -le 0 ]; then
            echo "Nothing to sync."
            exit 0
          fi
          python scripts/arvexq_sync_batches.py \
            --input prefetch-sync-payload.json \
            --out-dir prefetch-sync-batches
          COUNT=$(find prefetch-sync-batches -type f -name 'batch-*.json' | wc -l | tr -d ' ')
          echo "D1 prefetch batches=$COUNT"
          # Capacity failure is permanent until storage is redesigned or increased.
          # Never hammer D1 with all remaining batches after a confirmed quota
          # error or Cloudflare Worker resource limit (1102).
          FAILED_BATCHES=0
          for file in prefetch-sync-batches/batch-*.json; do
            PYTHONPATH=. python scripts/arvexq_protect_sync.py --file "$file" --api-base "$CLOUDFLARE_API_BASE"
            if python scripts/arvexq_d1_capacity_guard.py \
              --file "$file" --api-base "$CLOUDFLARE_API_BASE" --max-bytes 4000000; then
              PYTHONPATH=. python scripts/arvexq_protect_sync.py --verify-post --file "$file" --api-base "$CLOUDFLARE_API_BASE"
            else
              status=$?
              FAILED_BATCHES=$((FAILED_BATCHES + 1))
              if [ "$status" -eq 20 ]; then
                echo "::error::D1_STORAGE_OR_WORKER_CAPACITY_BLOCKED; preserving all prepared files and morning seals."
                exit 20
              fi
              if [ "$FAILED_BATCHES" -ge 3 ]; then
                echo "::error::D1_SYNC_THREE_FAILURES; circuit-breaker prevents more write load."
                exit 21
              fi
            fi
          done
          if [ "$FAILED_BATCHES" -gt 0 ]; then
            echo "::error::D1 prefetch incomplete failed_batches=$FAILED_BATCHES"
            exit 21
          fi
          echo "D1 prefetch push verified all batches"

      - name: Verify prepared day and analysis from D1
        run: |
          EXPECTED=$(jq '.meta.race_count // 0' prefetch-payload.json)
          if [ "$EXPECTED" -le 0 ]; then
            exit 0
          fi
          python scripts/arvexq_fetch_d1_bundle.py \
            --api-base "$CLOUDFLARE_API_BASE" \
            --date "$TARGET_DATE" \
            --out verified-day.json \
            --report verified-d1-report.json \
            --workers 4 \
            --retries 6 \
            --allow-missing-details
          ACTUAL=$(jq '.races // [] | length' verified-day.json)
          DETAILS=$(jq '.details // [] | length' verified-day.json)
          MISSING=$(jq '.missing_detail_count // 0' verified-d1-report.json)
          echo "D1 PREFETCH summaries expected=$EXPECTED actual=$ACTUAL details=$DETAILS missing=$MISSING"
          if [ "$ACTUAL" -lt "$EXPECTED" ] || [ "$DETAILS" -lt "$EXPECTED" ] || [ "$MISSING" -gt 0 ]; then
            echo "::error::D1 is missing race summaries or prepared details"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          day=json.loads(Path('verified-day.json').read_text(encoding='utf-8'))
          details=[d for d in (day.get('details') or []) if isinstance(d,dict)]
          prepared=json.loads(Path('prefetch-payload.json').read_text(encoding='utf-8'))
          expected={str(d.get('id')):d for d in (prepared.get('details') or []) if isinstance(d,dict) and d.get('id')}
          returned={str(d.get('id')):d for d in details}
          expected_ids={str(r.get('id')) for r in (prepared.get('summaries') or []) if isinstance(r,dict) and r.get('id')}
          actual_ids={str(r.get('id')) for r in (day.get('races') or []) if isinstance(r,dict) and r.get('id')}
          missing_summary_ids=sorted(expected_ids-actual_ids)
          missing_cards=[(rid,'missing D1 summary') for rid in missing_summary_ids]
          missing_analysis=[]
          for rid,old in expected.items():
              d=returned.get(rid)
              if not d:
                  missing_cards.append((rid,'missing D1 record'))
                  continue
              horses=[h for h in (d.get('horses') or []) if isinstance(h,dict)]
              good=[h for h in horses if str(h.get('name') or '').strip() and int(h.get('horseNumber') or 0)>0]
              prepared_horses=[h for h in (old.get('horses') or []) if isinstance(h,dict) and int(h.get('horseNumber') or 0)>0]
              numbers=[int(h.get('horseNumber') or 0) for h in good]
              expected_numbers={int(h.get('horseNumber') or 0) for h in prepared_horses}
              if len(good)<2 or not expected_numbers.issubset(set(numbers)) or len(numbers)!=len(set(numbers)):
                  missing_cards.append((rid,f'expected_numbers={sorted(expected_numbers)} D1_numbers={sorted(set(numbers))}'))
              pm=d.get('preparedMeta') if isinstance(d.get('preparedMeta'),dict) else {}
              has_analysis=bool(pm.get('diagnosisReady')) or any(d.get(k) not in (None,'',[],{}) for k in ('preRacePrediction','aiEvaluation','pace','pacePrediction','volatility'))
              if not has_analysis:
                  missing_analysis.append(rid)
          # Morning selections are historical commitments, not live predictions.
          # A Worker that strips these fields must fail verification visibly.
          proposed={str(r.get('id')):r for r in (prepared.get('summaries') or []) if isinstance(r,dict) and r.get('id')}
          published={str(r.get('id')):r for r in (day.get('races') or []) if isinstance(r,dict) and r.get('id')}
          def morning(row):
              if not isinstance(row,dict):return None
              for key in ('volatility','environmentMeta'):
                  v=row.get(key) if isinstance(row.get(key),dict) else {}
                  m=v.get('morningPicks')
                  if isinstance(m,dict) and m.get('version')=='v1' and m.get('fixedAt'):
                      return m
              if row.get('morningPickVersion')=='v1' and row.get('morningPickFixedAt'):
                  return dict(version='v1',fixedAt=row['morningPickFixedAt'],
                              selected=row.get('morningSelected') is True,
                              selectedScore=row.get('morningSelectedScore') or 0,
                              special=row.get('morningSpecial') is True)
              return None
          frozen={rid:morning(r) for rid,r in proposed.items() if morning(r)}
          keys=('version','fixedAt','selected','selectedScore','special')
          omitted=[rid for rid in frozen if not morning(published.get(rid))]
          contradictory=[rid for rid,expected_pick in frozen.items()
                         if morning(published.get(rid)) and
                         any(morning(published.get(rid)).get(key)!=expected_pick.get(key) for key in keys)]
          print('D1_MORNING_PROJECTION expected=',len(frozen),
                'schema_omitted=',len(omitted),'contradictory=',len(contradictory))
          if omitted or contradictory:
              # The Worker deliberately drops unknown keys from D1 summaries.
              # The immutable static morning-picks/<date>.json is canonical.
              from pathlib import Path
              date=str(prepared.get('meta',{}).get('sync_date') or day.get('date') or '')
              archive=Path('arvexq/ui/static/morning-picks')/(date+'.json')
              if not archive.is_file():
                  raise SystemExit('D1 stripped morning picks and static archive is missing')
              manifest=json.loads(archive.read_text(encoding='utf-8'))
              original={rid:(r.get('morningSelected'),r.get('morningSpecial'),r.get('morningSelectedScore') or 0)
                        for rid,r in proposed.items() if rid in frozen}
              static={str(r.get('id')):(r.get('selected'),r.get('special'),r.get('selectedScore') or 0)
                      for r in (manifest.get('races') or []) if isinstance(r,dict)}
              if (manifest.get('date')!=date or len(static)!=len(original) or
                  static!=original):
                  raise SystemExit('Static morning archive does not match first morning selection')
              print('D1_MORNING_METADATA_STRIPPED_STATIC_ARCHIVE_CANONICAL',len(static))
              # Do not fail the race card publication. Static archive is separately
              # deployed and verified by the Cloudflare Web Deploy workflow.
          print('D1_PREFETCH_DETAIL_VERIFY expected=',len(expected),'received=',len(returned),'missing_cards=',len(missing_cards),'missing_analysis=',len(missing_analysis))
          if missing_analysis:
              print('::warning::D1 analysis unavailable for '+str(len(missing_analysis))+' races: '+str(missing_analysis[:20]))
          if missing_cards:
              print('D1_MISSING_CARDS',missing_cards[:25])
              raise SystemExit('D1 racecard delivery incomplete: '+str(len(missing_cards))+' races')
          PY
          # A worker-side summary projection may legitimately omit morning
          # fields. Prove static-vs-D1 race identity and record omissions vs
          # contradictions, never rewrite a frozen selection to "fix" it.
          MANIFEST="arvexq/ui/static/morning-picks/$TARGET_DATE.json"
          if [ -f "$MANIFEST" ]; then
            python scripts/arvexq_morning_d1_audit.py \
              --manifest "$MANIFEST" --d1 verified-day.json \
              --report morning-d1-audit.json
          fi

      - name: Stop ARVEXQ
        if: always()
        run: |
          if [ -f /tmp/arvexq-prefetch.pid ]; then
            kill "$(cat /tmp/arvexq-prefetch.pid)" 2>/dev/null || true
          fi

      - name: Recheck SQLite cache before save
        if: always()
        run: python scripts/arvexq_sqlite_health.py --root "$KEIBA_DATA_DIR" || true

      - name: Save ARVEXQ data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .arvexq-data
          key: arvexq-prefetch-${{ runner.os }}-${{ env.TARGET_DATE }}-${{ github.run_id }}

      - name: Show concise failure log
        if: failure()
        run: |
          echo "--- prefetch-run.log ---"
          tail -n 100 prefetch-run.log 2>/dev/null || true
          echo "--- prefetch-repair-selection.json ---"
          cat prefetch-repair-selection.json 2>/dev/null || true
          echo "--- runtime ---"
          tail -n 100 /tmp/arvexq-prefetch.log 2>/dev/null || true
          cp /tmp/arvexq-prefetch.log runtime-prefetch.log 2>/dev/null || true

      - name: Preserve morning D1 consistency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-morning-d1-consistency-${{ github.run_id }}
          path: morning-d1-audit.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload full failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-prefetch-failure-${{ github.run_number }}
          path: |
            prefetch-run.log
            prefetch-report.json
            prefetch-repair-selection.json
            current-d1-report.json
            verified-d1-report.json
            runtime-prefetch.log
          if-no-files-found: ignore
          retention-days: 3
