name: ARVEXQ Inspect Central Evidence Paths

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_inspect_central_evidence_paths.py'
      - '.github/workflows/arvexq-inspect-central-evidence-paths.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect central evidence paths
        run: python scripts/arvexq_inspect_central_evidence_paths.py
