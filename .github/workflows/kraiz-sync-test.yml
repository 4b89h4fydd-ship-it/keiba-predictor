name: KRAIZ Sync Test

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-test:
    runs-on: ubuntu-latest

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

    steps:
      - name: Test Cloudflare sync
        run: |
          curl --fail-with-body \
            -X POST \
            "https://kraiz-api.4b89h4fydd.workers.dev/api/sync" \
            -H "content-type: application/json" \
            -H "x-sync-token: $SYNC_TOKEN" \
            --data '{"meta":{"github_sync_test":"ok"}}'
