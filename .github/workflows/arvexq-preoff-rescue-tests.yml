name: ARVEXQ Preoff Provider Rescue Tests
"on":
  pull_request:
    branches: [main]
    paths:
      - scripts/arvexq_freeze_predictions.py
      - scripts/arvexq_preoff_history_rescue.py
      - tests/test_preoff_history_provider_rescue.py
      - .github/workflows/arvexq-preoff-rescue-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: python -m compileall -q scripts/arvexq_preoff_history_rescue.py scripts/arvexq_freeze_predictions.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_preoff_history_provider_rescue.py tests/test_preoff_d1_display_history.py
