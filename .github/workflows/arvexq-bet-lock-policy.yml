name: ARVEXQ Bet Lock Policy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_patch_bet_lock_policy.py'
      - '.github/workflows/arvexq-bet-lock-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final input lock policy
        run: python scripts/arvexq_patch_bet_lock_policy.py
      - name: Synchronize special-race generator source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/arvexq_patch_special_races.py')
          s=p.read_text(encoding='utf-8')
          start=s.find("new_save = '''function saveStoredAiBet")
          marker="'''\nreplace_once(old_save, new_save, \"saveStoredAiBet\")"
          end=s.find(marker,start)
          if start < 0 or end < 0:
              raise SystemExit('special-race save policy block not found')
          new_block="""new_save = '''function saveStoredAiBet(r,plan){
  try{
    if(!r||!r.id||!plan||isFinal(r))return;
    var st=mins(r.startTime),raceDate=String(r.date||''),todayKey=today(),started=(raceDate===todayKey&&st<9999&&nowMins()>=st);
    if(started||st>=9999||raceDate!==todayKey||loadStoredAiBet(r.id,false))return;
    var rd=plan.dataReadiness||{},central=String(r.circuit||'')==='中央',minReady=central?.68:.60,ready=Number(rd.prediction),remain=st-nowMins(),lockWindow=30,
        cardReady=n(rd.card,0)>=.90,historyReady=n(rd.history,0)>=.70,oddsReady=n(rd.actualOdds,0)>=.65,bodyReady=n(rd.bodyWeight,0)>=.70,environmentReady=n(rd.environment,0)>=1,analysisReady=n(rd.analysis,0)>=.45,
        incomplete=/予想データの充足度が不足|データ充足待ち|予想データ不足|データ不足|準備中|実オッズ待ち/.test(String(plan.reason||'')+' '+String(plan.trifectaReason||''));
    if(remain>lockWindow||remain<0)return;
    if(!isFinite(ready)||ready<minReady)return;
    if(!cardReady||!historyReady||!oddsReady||!bodyReady||!environmentReady||!analysisReady)return;
    if(plan.decision==='見送り'&&incomplete)return;
    plan.fixedAt=new Date().toISOString();plan.fixedBeforePost=true;plan.fixedMinutesBeforePost=Math.max(0,Math.round(remain));
    plan.fixedInputReadiness={prediction:n(rd.prediction,0),card:n(rd.card,0),history:n(rd.history,0),actualOdds:n(rd.actualOdds,0),bodyWeight:n(rd.bodyWeight,0),environment:n(rd.environment,0),analysis:n(rd.analysis,0)};
    plan.lockPolicy='v327-final-input-window-30m';
    localStorage.setItem(aiBetStoreKey(r.id),JSON.stringify(plan))
  }catch(e){}
}
'''
"""
          s=s[:start]+new_block+s[end:]
          p.write_text(s,encoding='utf-8')
          print('special-source-lock-policy-synced')
          PY
      - name: Validate lock policy
        run: |
          python -m py_compile scripts/arvexq_patch_bet_lock_policy.py scripts/arvexq_patch_special_races.py
          node --check arvexq/ui/static/app.js
          python - <<'PY'
          from pathlib import Path
          js=Path('arvexq/ui/static/app.js').read_text(encoding='utf-8')
          src=Path('scripts/arvexq_patch_special_races.py').read_text(encoding='utf-8')
          for text in (js,src):
              assert "lockWindow=30" in text
              assert "actualOdds,0)>=.65" in text
              assert "bodyWeight,0)>=.70" in text
              assert "environment,0)>=1" in text
              assert "raceDate!==todayKey" in text
              assert "v327-final-input-window-30m" in text
          print('bet-lock-policy-validated')
          PY
      - name: Commit synchronized policy
        run: |
          TARGETS="arvexq/ui/static/app.js scripts/arvexq_patch_special_races.py"
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'Bet lock policy already synchronized'
            exit 0
          fi
          git config user.name 'arvexq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'bet: persist final-input lock policy'
          git pull --rebase origin main
          git push
