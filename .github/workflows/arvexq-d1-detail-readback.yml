name: ARVEXQ D1 Persisted Detail Readback
"on":
  pull_request:
    branches: [main]
    paths:
      - scripts/arvexq_fetch_d1_bundle.py
      - tests/test_d1_display_readback.py
      - .github/workflows/arvexq-d1-detail-readback.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - name: Verify D1 persisted detail readback without mixing race identities
        run: |
          python -m py_compile scripts/arvexq_fetch_d1_bundle.py
          PYTHONPATH=. python -m pytest -q tests/test_d1_display_readback.py
