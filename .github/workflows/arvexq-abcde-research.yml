name: ARVEXQ ABCDE Research Comparison
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arvexq-abcde-research.yml
      - scripts/arvexq_sequential_candidate_audit.py
      - arvexq/history.py
      - arvexq/research/mineta_position_proxy.py
      - arvexq/research/mineta_field_proxy.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt
      - name: Verify research candidate tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_margin_abcde_candidate.py -v
      - name: Compare archived horses with verified outcomes
        run: PYTHONPATH=. python scripts/arvexq_sequential_candidate_audit.py /tmp/arvexq-abcde-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arvexq-abcde-research
          path: /tmp/arvexq-abcde-comparison.json
          if-no-files-found: ignore
