name: ARVEXQ Schema Probe

"on":
  push:
    branches: [research/recent-accuracy-20261005]
    paths:
      - research/arvexq_schema_probe.py
      - .github/workflows/arvexq-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install probe dependencies quietly
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q numpy pandas scikit-learn lightgbm catboost
      - name: Probe snapshot schema
        run: python research/arvexq_schema_probe.py
