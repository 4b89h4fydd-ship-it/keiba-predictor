name: ARVEXQ JRA Mineta Margin Comparison
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arvexq-jra-mineta-comparison.yml
      - scripts/arvexq_jra_mineta_observed_comparison.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt
      - name: Compare JRA-only Mineta variants
        run: |
          PYTHONPATH=. python scripts/arvexq_jra_mineta_observed_comparison.py /tmp/jra-mineta.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jra-mineta-comparison
          path: /tmp/jra-mineta.json
