name: ARVEXQ JRA Mineta Margin Comparison
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/arvexq-jra-mineta-comparison.yml
      - scripts/arvexq_jra_mineta_observed_comparison.py
      - scripts/arvexq_jra_margin_audit.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arvexq-jra-margin-verification
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      ARVEXQ_FACTOR_BACKFILL_RACES: "24"
      ARVEXQ_FACTOR_BACKFILL_OFFSET: "0"
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-jra-margin-verification
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -q -r requirements.txt
      - name: Regression tests
        run: python -m unittest tests.test_jra_margin_roundtrip tests.test_jra_prior_result_margin_enrichment tests.test_jra_result_margin_nameerror -v
      - name: Read target day from D1
        run: |
          python scripts/arvexq_fetch_d1_bundle.py --api-base "$API_BASE" --date 2026-10-12 --out before.json --report hydration.json --workers 4
          PYTHONPATH=. python scripts/arvexq_jra_margin_audit.py --input before.json --output audit-before.json
      - name: Repair only JRA prior-run measurements through existing providers
        run: |
          python scripts/arvexq_history_repair.py --bundle before.json --payload repaired.json --report repair-report.json --workers 1 --central-margins-only
          PYTHONPATH=. python scripts/arvexq_jra_margin_audit.py --input repaired.json --output audit-collected.json --require-positive
      - name: Publish protected race-scoped updates to D1
        run: |
          python scripts/arvexq_sync_batches.py --input repaired.json --out-dir batches
          for file in batches/batch-*.json; do
            PYTHONPATH=. python scripts/arvexq_protect_sync.py --file "$file" --api-base "$API_BASE"
            curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 70 --connect-timeout 8 --max-time 35 -X POST "$API_BASE/api/sync" -H 'content-type: application/json' -H "x-sync-token: $SYNC_TOKEN" --data-binary @"$file" > /dev/null
            PYTHONPATH=. python scripts/arvexq_protect_sync.py --verify-post --file "$file" --api-base "$API_BASE"
          done
      - name: Independently reload D1 and verify every proof and frozen original
        run: |
          python scripts/arvexq_fetch_d1_bundle.py --api-base "$API_BASE" --date 2026-10-12 --out reloaded.json --report reload-hydration.json --workers 4
          PYTHONPATH=. python scripts/arvexq_jra_margin_audit.py --input reloaded.json --expected repaired.json --output audit-reloaded.json --require-positive
      - name: Compare all four methods on identical complete JRA inputs
        run: PYTHONPATH=. python scripts/arvexq_jra_mineta_observed_comparison.py comparison.json --bundle reloaded.json --date 2026-10-12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jra-mineta-verification-summary
          path: |
            audit-*.json
            comparison.json
          if-no-files-found: warn
