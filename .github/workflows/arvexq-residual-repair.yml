name: ARVEXQ Residual Repair (bodyweight + data-core health)

# One-off repair lane for the 2026-11-10 residual-defect sweep:
# corrects one officially proven wrong entry bodyweight
# (Saga 2026-11-09 R4 #5) and refreshes stale dataCoreHealth
# stamps on payout-/environment-repaired races.  Triggered by a
# push to the request file; the runner is fail-closed (protect
# runs before any write) and verifies every written race by API
# read-back.
on:
  push:
    paths:
      - arvexq/residual_repair/requests.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvexq-residual-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run residual repair
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: >-
          python scripts/arvexq_residual_repair.py
          arvexq/residual_repair/requests.json
          arvexq/residual_repair/work
      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-residual-repair-report
          path: arvexq/residual_repair/work/report.json
          if-no-files-found: warn
