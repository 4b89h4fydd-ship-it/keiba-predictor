name: ARVEXQ Residual Repair (bodyweight + data-core health)

# One-off repair lane for the 2026-11-10 residual-defect sweep:
# corrects one officially proven wrong entry bodyweight
# (Saga 2026-11-09 R4 #5) and refreshes stale dataCoreHealth
# stamps on payout-/environment-repaired races.  Triggered by a
# push to the request file.  The prepare step patches pristine
# stored forms and passes every patch through protect_detail;
# the push step follows the established history-repair pattern
# (sync_batches -> protect_sync per batch -> POST /api/sync ->
# protect_sync --verify-post); the verify step asserts the
# patched cells and health blocks by API read-back.
on:
  push:
    paths:
      - arvexq/residual_repair/requests.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvexq-residual-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare patches (protect-gated)
        run: >-
          python scripts/arvexq_residual_repair.py
          arvexq/residual_repair/requests.json
          arvexq/residual_repair/work
      - name: Push patched races to D1 in safe batches
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ ! -f arvexq/residual_repair/work/sync-input.json ]; then
            echo "No sync input prepared; skip push."
            exit 0
          fi
          python scripts/arvexq_sync_batches.py \
            --input arvexq/residual_repair/work/sync-input.json \
            --out-dir arvexq/residual_repair/work/sync-batches
          COUNT=$(find arvexq/residual_repair/work/sync-batches -type f -name 'batch-*.json' | wc -l | tr -d ' ')
          echo "D1 residual repair batches=$COUNT"
          FAILED=""
          for file in arvexq/residual_repair/work/sync-batches/batch-*.json; do
            safe=0
            for attempt in 1 2 3; do
              if PYTHONPATH=. python scripts/arvexq_protect_sync.py --file "$file" --api-base "$CLOUDFLARE_API_BASE"; then
                safe=1; break
              fi
              sleep $((attempt * 5))
            done
            if [ "$safe" != 1 ]; then
              echo "PROTECT FAILED for $file; skipping this batch"
              FAILED="$FAILED $file"
              continue
            fi
            BYTES=$(wc -c < "$file" | tr -d ' ')
            echo "POST $(basename "$file") bytes=$BYTES"
            if ! curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
              --connect-timeout 10 --max-time 40 -X POST \
              "$CLOUDFLARE_API_BASE/api/sync" \
              -H "content-type: application/json" \
              -H "x-sync-token: $SYNC_TOKEN" \
              --data-binary @"$file" > /dev/null; then
              echo "POST FAILED for $file"
              FAILED="$FAILED $file"
              continue
            fi
            verified=0
            for attempt in 1 2 3; do
              if PYTHONPATH=. python scripts/arvexq_protect_sync.py --verify-post --file "$file" --api-base "$CLOUDFLARE_API_BASE"; then
                verified=1; break
              fi
              echo "verify-post unavailable; attempt=$attempt retrying"
              sleep $((attempt * 5))
            done
            if [ "$verified" != 1 ]; then
              echo "VERIFY-POST FAILED for $file"
              FAILED="$FAILED $file"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "Batches failed:$FAILED"
            exit 1
          fi
          echo "D1 residual repair batched push OK"
      - name: Verify patched cells by API read-back
        run: >-
          python scripts/arvexq_residual_repair.py
          arvexq/residual_repair/requests.json
          arvexq/residual_repair/work
          --verify
      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-residual-repair-report
          path: arvexq/residual_repair/work/report.json
          if-no-files-found: warn
