name: ARVEXQ Analytics Connection Test

on:
  workflow_dispatch:
  push:
    branches:
      - arvexq-data-integration-test
    paths:
      - .github/workflows/arvexq-analytics-test.yml

permissions:
  contents: read

jobs:
  check-remote-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check credentials without exposing values
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          test -n "$FIRECRAWL_API_KEY" || { echo "::error::FIRECRAWL_API_KEY missing"; exit 1; }
          test -n "$MOTHERDUCK_TOKEN" || { echo "::error::MOTHERDUCK_TOKEN missing"; exit 1; }
          echo "Credential presence OK"

      - name: Install test dependencies
        run: pip install --disable-pip-version-check duckdb

      - name: Test read-only MotherDuck and Firecrawl authentication
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          import duckdb
          # Read-only query; no database schema or rows modified.
          con = duckdb.connect("md:my_db", config={"access_mode": "READ_ONLY"})
          try:
              n = con.execute("SELECT 1").fetchone()[0]
              assert n == 1
              print("MOTHERDUCK_READ_CONNECTION_OK")
          finally:
              con.close()

          req = urllib.request.Request(
              "https://api.firecrawl.dev/v2/search",
              data=json.dumps({"query":"site:firecrawl.dev Firecrawl","limit":1}).encode(),
              headers={"Authorization":"Bearer "+os.environ["FIRECRAWL_API_KEY"],"Content-Type":"application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req,timeout=35) as response:
                  obj=json.load(response)
                  assert obj.get("success") is True, "Firecrawl returned unsuccessful response"
                  print("FIRECRAWL_API_CONNECTION_OK")
          except urllib.error.HTTPError as error:
              print("::error::FIRECRAWL_HTTP_STATUS_"+str(error.code))
              raise SystemExit(1)
          PY
