name: ARVEXQ History Missing Root Cause
"on":
  push:
    branches: [fix/arvexq-new-engine-complete-field-20261022]
    paths:
      - scripts/arvexq_history_missing_rootcause.py
      - .github/workflows/arvexq-history-missing-rootcause.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
      ARVEXQ_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt pytest==9.1.1
      - name: Existing replay chronology tests
        run: PYTHONPATH=. python -m pytest -q tests/test_research_provisional_replay.py
      - name: Diagnose unavailable past starts
        run: |
          set -o pipefail
          PYTHONPATH=. python -u scripts/arvexq_history_missing_rootcause.py | tee history-causes.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arvexq-history-causes-${{ github.run_id }}
          path: history-causes.log
          retention-days: 14
          if-no-files-found: warn
