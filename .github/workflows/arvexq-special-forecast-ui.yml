name: ARVEXQ Special Forecast UI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_special_forecast_ui.py'
      - 'scripts/arvexq_patch_special_races.py'
      - 'scripts/arvexq_reconcile_prediction_paths.py'
      - 'arvexq/ui/static/app.js'
      - 'arvexq/ui/static/styles.css'
      - '.github/workflows/arvexq-special-forecast-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply special forecast scope and fold UI
        run: python scripts/arvexq_special_forecast_ui.py
      - name: Validate special forecast UI
        run: |
          python -m py_compile scripts/arvexq_special_forecast_ui.py
          node --check arvexq/ui/static/app.js
          python - <<'PY'
          from pathlib import Path
          js=Path('arvexq/ui/static/app.js').read_text(encoding='utf-8')
          css=Path('arvexq/ui/static/styles.css').read_text(encoding='utf-8')
          assert 'data-special-fold="1"' in js
          assert "arvexq-special-forecast-open" in js
          assert "Object.keys(groups).forEach(function(k){add(mainRaceForTrack(groups[k]))})" not in js
          assert '<small>メイン・重賞・高知ファイナル</small>' not in js
          assert '本日のメイン・重賞・高知ファイナルなし' not in js
          assert 'ARVEXQ special forecast fold v1' in css
          print('special-forecast-ui-validated')
          PY
      - name: Commit generated UI
        run: |
          TARGETS="arvexq/ui/static/app.js arvexq/ui/static/styles.css"
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'Special forecast UI already synchronized'
            exit 0
          fi
          git config user.name 'arvexq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'ui: fold special forecast and remove main races'
          git pull --rebase origin main
          git push
