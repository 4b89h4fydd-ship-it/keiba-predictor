name: ARVEXQ Special Forecast UI

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'arvexq/ui/static/app.js'
      - 'arvexq/ui/static/styles/**'
      - 'arvexq/ui/static/styles.css'
      - 'arvexq/ui/static/morning/**'
      - '.github/workflows/arvexq-special-forecast-ui.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate special forecasts without regenerating UI
        run: |
          node --check arvexq/ui/static/app.js
          node --check arvexq/ui/static/morning/selection_cut.js
          python - <<'PY'
          from pathlib import Path
          js=Path('arvexq/ui/static/app.js').read_text(encoding='utf-8')
          css='\n'.join(Path(p).read_text(encoding='utf-8') for p in (
            'arvexq/ui/static/styles.css',
            'arvexq/ui/static/styles/legacy_v118_v221.css',
            'arvexq/ui/static/styles/race_v222_plus.css'))
          assert 'data-special-fold="1"' in js
          assert 'arvexq-special-forecast-open' in js
          assert 'ARVEXQ special forecast fold v1' in css
          assert 'function specialForecastRaceCandidates()' in js
          assert "return !!(r&&r.id&&m&&m.special===true)" in js
          assert 'function computeMorningSpecialRaceCandidates()' in js
          assert "isMainForecastRace(r)||raceIsGraded(r)" in js
          print('SPECIAL_FORECAST_READ_ONLY_CI_OK')
          PY
