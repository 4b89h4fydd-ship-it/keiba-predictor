name: ARVEXQ History Repair

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/arvexq_history_repair.py
      - scripts/arvexq_result_repair.py
      - .github/workflows/arvexq-history-sync.yml
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: arvexq-history-repair
  cancel-in-progress: true

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      CLOUDFLARE_SYNC_URL: https://kraiz-api.4b89h4fydd.workers.dev/api/sync
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-data
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      NAR_ON_DEMAND_HISTORY_MONTHS: "12"
      ARVEXQ_HISTORY_DAYS: "7"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Set history date
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            SLOT=1
          else
            SLOT=$(( (GITHUB_RUN_NUMBER - 1) % ARVEXQ_HISTORY_DAYS + 1 ))
          fi
          echo "HISTORY_OFFSET=$SLOT" >> "$GITHUB_ENV"
          echo "HISTORY_DATE=$(TZ=Asia/Tokyo date -d "$SLOT days ago" +%F)" >> "$GITHUB_ENV"
          echo "History target=-${SLOT}d event=$GITHUB_EVENT_NAME"

      - name: Restore ARVEXQ data cache
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-history-${{ runner.os }}-${{ env.HISTORY_DATE }}-${{ github.run_id }}
          restore-keys: |
            arvexq-history-${{ runner.os }}-${{ env.HISTORY_DATE }}-
            arvexq-prefetch-${{ runner.os }}-
            arvexq-data-${{ runner.os }}-

      - name: Start lightweight fallback runtime
        run: |
          # The bootstrap server and repair importer must NEVER write the
          # same restored SQLite cache concurrently.
          mkdir -p "$RUNNER_TEMP/arvexq-history-bootstrap"
          KEIBA_DATA_DIR="$RUNNER_TEMP/arvexq-history-bootstrap" \
            nohup python -c 'import app,uvicorn; app.last3f=None; uvicorn.run(app.app,host="127.0.0.1",port=8000)' > /tmp/arvexq-history.log 2>&1 &
          echo $! > /tmp/arvexq-history.pid
          for i in $(seq 1 25); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/health > /dev/null; then
              echo "ARVEXQ history runtime ready"
              exit 0
            fi
            sleep 1
          done
          tail -n 80 /tmp/arvexq-history.log || true
          exit 1

      - name: Load historical day from D1 first
        run: |
          # details=1 builds an oversized day JSON and intermittently 503s.
          # Fetch small day summaries and hydrate each race separately.
          if ! python scripts/arvexq_fetch_d1_bundle.py \
            --api-base "$CLOUDFLARE_API_BASE" \
            --date "$HISTORY_DATE" \
            --out history-bundle.json \
            --report history-hydration.json \
            --workers 4 --allow-missing-details; then
            echo "D1 history hydration unavailable; checking collector fallback"
          fi
          RACES=$(jq '.races // [] | length' history-bundle.json 2>/dev/null || echo 0)
          echo "D1 history races=$RACES"

          if [ "$RACES" -le 0 ]; then
            echo "Historical D1 day absent; discovering once from source collectors."
            curl -fsS --max-time 120 \
              "http://127.0.0.1:8000/api/v1/site-bootstrap?date=$HISTORY_DATE&force=1" \
              -o history-bootstrap.json || true
            FALLBACK=$(jq '.races // [] | length' history-bootstrap.json 2>/dev/null || echo 0)
            if [ "$FALLBACK" -gt 0 ]; then
              mv history-bootstrap.json history-bundle.json
            fi
            RACES=$(jq '.races // [] | length' history-bundle.json 2>/dev/null || echo 0)
          fi
          echo "History repair source races=$RACES"

      - name: Repair missing fields only
        run: |
          RACES=$(jq '.races // [] | length' history-bundle.json 2>/dev/null || echo 0)
          if [ "$RACES" -le 0 ]; then
            echo '{"summaries":[],"details":[],"meta":{"race_count":0}}' > history-payload.json
            echo '{"races":0,"missing_card":[],"missing_result":[],"missing_payout":[]}' > history-report.json
            exit 0
          fi
          python -m py_compile scripts/arvexq_history_repair.py
          # Install a bounded busy wait before import app. Run a single
          # writer to avoid repeated nested RACEDB write conflicts.
          if ! python - <<'PY' > history-repair.log 2>&1
          from scripts.arvexq_sqlite_runtime_guard import install, install_app_compat
          install()
          import app, runpy, sys
          install_app_compat(app)
          sys.argv = [
              'scripts/arvexq_history_repair.py',
              '--bundle', 'history-bundle.json',
              '--payload', 'history-payload.json',
              '--report', 'history-report.json',
              '--workers', '1',
          ]
          runpy.run_path('scripts/arvexq_history_repair.py', run_name='__main__')
          PY
          then
            echo "::error::History repair failed"
            tail -n 80 history-repair.log || true
            exit 1
          fi
          jq '{races,missingCard:(.missing_card|length),missingResult:(.missing_result|length),missingPayout:(.missing_payout|length)}' history-report.json

      - name: Push repaired historical day to D1
        run: |
          RACES=$(jq '.meta.race_count // 0' history-payload.json)
          if [ "$RACES" -le 0 ]; then
            echo "No races on $HISTORY_DATE; nothing to sync."
            exit 0
          fi
          # Never POST an entire historical day to D1 (HTTP 503/body limit).
          # Split to one detail per request and protect immutable pre-off seals.
          python scripts/arvexq_sync_batches.py \
            --input history-payload.json \
            --out-dir history-sync-batches
          COUNT=$(find history-sync-batches -type f -name 'batch-*.json' | wc -l | tr -d ' ')
          test "$COUNT" -gt 0
          echo "D1 history batches=$COUNT"
          for file in history-sync-batches/batch-*.json; do
            PYTHONPATH=. python scripts/arvexq_protect_sync.py \
              --file "$file" --api-base "$CLOUDFLARE_API_BASE"
            echo "HISTORY_POST $(basename "$file") bytes=$(wc -c < "$file")"
            curl --fail-with-body --retry 4 --retry-all-errors \
              --retry-delay 2 --retry-max-time 70 \
              --connect-timeout 8 --max-time 35 \
              -X POST "$CLOUDFLARE_SYNC_URL" \
              -H "content-type: application/json" \
              -H "x-sync-token: $SYNC_TOKEN" \
              --data-binary @"$file" > /dev/null
            PYTHONPATH=. python scripts/arvexq_protect_sync.py \
              --verify-post --file "$file" --api-base "$CLOUDFLARE_API_BASE"
          done
          echo "D1 history protected batched push OK"

      - name: Verify repaired historical day
        run: |
          EXPECTED=$(jq '.meta.race_count // 0' history-payload.json)
          if [ "$EXPECTED" -le 0 ]; then
            exit 0
          fi
          # Verify via race-scoped D1 reads, not the 45+ race details=1 response.
          python scripts/arvexq_fetch_d1_bundle.py \
            --api-base "$CLOUDFLARE_API_BASE" \
            --date "$HISTORY_DATE" \
            --out history-verified.json \
            --report history-verified-report.json \
            --workers 4
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('history-report.json').read_text(encoding='utf-8'))
          day=json.loads(Path('history-verified.json').read_text(encoding='utf-8'))
          by={str(d.get('id') or ''):d for d in (day.get('details') or []) if isinstance(d,dict)}
          expected=int(report.get('races') or 0)
          if expected and len(by)<expected:
              raise SystemExit(f'D1 historical details short: {len(by)}/{expected}')
          unresolved=set(report.get('missing_card') or [])|set(report.get('missing_result') or [])|set(report.get('missing_payout') or [])
          visible_fail=[]
          for rid,d in by.items():
              if rid in unresolved:continue
              r=d.get('result') or {};status=str(r.get('status') or '')
              if status in {'中止','取止','取消','不成立'}:continue
              ranks={int(x.get('finish') or 0) for x in (r.get('finishers') or []) if isinstance(x,dict)}
              if not all(i in ranks for i in (1,2,3)) or not (r.get('payouts') or []):visible_fail.append(rid)
          print('HISTORY_D1 details=',len(by),'unresolved=',len(unresolved),'unexpectedIncomplete=',len(visible_fail))
          if visible_fail:
              raise SystemExit('D1 lost repaired historical result/payout: '+','.join(visible_fail[:10]))
          PY

      - name: Stop ARVEXQ
        if: always()
        run: |
          if [ -f /tmp/arvexq-history.pid ]; then
            kill "$(cat /tmp/arvexq-history.pid)" 2>/dev/null || true
          fi

      - name: Save ARVEXQ data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .arvexq-data
          key: arvexq-history-${{ runner.os }}-${{ env.HISTORY_DATE }}-${{ github.run_id }}

      - name: Show concise failure log
        if: failure()
        run: |
          tail -n 80 history-repair.log 2>/dev/null || true
          tail -n 80 /tmp/arvexq-history.log 2>/dev/null || true
          cp /tmp/arvexq-history.log runtime-history.log 2>/dev/null || true

      - name: Upload full failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-history-failure-${{ github.run_number }}
          path: |
            history-repair.log
            history-report.json
            runtime-history.log
            history-hydration.json
            history-verified-report.json
            history-sync-batches/*.json
          if-no-files-found: ignore
          retention-days: 3
