name: ARVEXQ Validation

"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - app.py
      - build_static.py
      - arvexq/**
      - scripts/**
      - tests/**
      - .github/workflows/arvexq-*.yml
      - requirements.txt
  push:
    branches: [main]
    paths:
      - app.py
      - build_static.py
      - arvexq/**
      - scripts/**
      - tests/**
      - .github/workflows/arvexq-*.yml
      - requirements.txt

concurrency:
  group: arvexq-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Python syntax
        run: |
          python -m py_compile app.py build_static.py \
            arvexq/prediction/honmei_gate.py \
            arvexq/prediction/final_marks.py \
            arvexq/pipeline/fingerprints.py \
            arvexq/ingest/orchestrator.py \
            arvexq/ingest/fallback_enrichment.py \
            arvexq/databanks/legacy_bridge.py \
            arvexq/databanks/nar_official_csv.py \
            scripts/arvexq_prefetch.py \
            scripts/arvexq_live_sync.py \
            scripts/arvexq_result_repair.py \
            scripts/arvexq_history_repair.py \
            scripts/arvexq_sqlite_health.py

      - name: Lossless full snapshot compression and immutability
        run: |
          python -m unittest tests.test_full_snapshot_codec
          node scripts/arvexq_full_snapshot_smoke.mjs

      - name: Audit mass feature snapshot producers and consumers
        run: |
          git grep -n -F massFeatureSnapshot -- '*.py' '*.js' || true

      - name: Audit giant app.py structure before modularization
        run: python scripts/arvexq_app_structure.py

      - name: Modular API helpers and isolated behavior regressions
        run: |
          python -m py_compile arvexq/ui/icon_assets.py arvexq/prediction/legacy_model_tables.py \
            arvexq/ingest/pure_parsers.py arvexq/prediction/pure_diagnostics.py \
            arvexq/infra/pure_snapshots.py
          python -m unittest discover -s tests -p 'test_app_pure_modules.py' -v

      - name: Static PWA build and version guard
        run: |
          python build_static.py > build-static.log 2>&1
          test -f dist/index.html
          test -f dist/version.json
          test -f dist/sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          version=json.loads(Path('dist/version.json').read_text(encoding='utf-8'))['build']
          files={p.name for p in Path('dist').iterdir() if p.is_file()}
          expected={f'app-{version}.js',f'arvexq-app-{version}.js',f'styles-arvexq-{version}.css',f'sw-{version}-reset.js'}
          missing=sorted(expected-files)
          print('build=',version,'missing=',missing)
          if missing:raise SystemExit('missing current assets: '+','.join(missing))
          PY

      - name: Betting marks and ticket reconciliation regression
        run: |
          node --check arvexq/ui/static/app.js
          node --check arvexq/ui/static/research/research_view.js
          node scripts/arvexq_research_view_smoke.js
          node scripts/arvexq_bet_mark_alignment_smoke.js
          node --check arvexq/ui/static/betting/podium_axis_guard.js
          node scripts/arvexq_podium_axis_guard_smoke.js
          node --check arvexq/ui/static/betting/no_axis_strategy.js
          node scripts/arvexq_three_way_bet_smoke.js
          node scripts/arvexq_scratch_live_smoke.js
          node scripts/arvexq_mark_lock_smoke.js

      - name: Official course revision and morning marks
        run: |
          python -m unittest discover -s tests -p 'test_official_course_revision.py' -v
          python -m unittest discover -s tests -p 'test_user_approved_model_revision.py' -v
          node --check scripts/arvexq_model_mark_revision_smoke.js
          node scripts/arvexq_model_mark_revision_smoke.js
          node --check scripts/arvexq_capture_course_revised_marks.js

      - name: Morning race selection remains immutable
        run: |
          node --check scripts/arvexq_morning_picks.js
          node --check scripts/arvexq_morning_picks_smoke.js
          node scripts/arvexq_morning_picks_smoke.js
          node --check arvexq/ui/static/morning/ticket_lane_classifier.js
          node scripts/arvexq_morning_selection_cut_smoke.js
          node scripts/arvexq_morning_picks_runner_smoke.js
          python -m unittest discover -s tests -p 'test_morning_pick_freeze.py' -v

      - name: Four-stage pace transition regression
        run: |
          node --check scripts/arvexq_pace_transition_smoke.js
          node scripts/arvexq_pace_transition_smoke.js
          node scripts/arvexq_pace_evidence_bet_gate_smoke.js
          node scripts/arvexq_six_pace_metrics_smoke.js

      - name: D1 capacity fail-closed and storage safety regression
        run: |
          python -m py_compile scripts/arvexq_d1_capacity_guard.py
          python -m unittest discover -s tests -p 'test_d1_capacity_guard.py' -v
          python -m unittest discover -s tests -p 'test_d1_storage_audit.py' -v
          python -m unittest discover -s tests -p 'test_detail_size_audit.py' -v
          python -m unittest discover -s tests -p 'test_mass_feature_transport.py' -v
          python -m unittest discover -s tests -p 'test_mass_feature_legacy_guard.py' -v
          python -m unittest discover -s tests -p 'test_d1_archive_delivery.py' -v
          python -m unittest discover -s tests -p 'test_static_racecard_backup.py' -v
          python -m unittest discover -s tests -p 'test_morning_ticket_publisher.py' -v
          node scripts/arvexq_frozen_marks_smoke.js
          python -m unittest discover -s tests -p test_saved_snapshot_recovery.py -v
          node scripts/arvexq_race_identity_smoke.js
          node scripts/arvexq_api_storage_smoke.mjs
          node scripts/arvexq_saved_diagnosis_smoke.js
          node scripts/arvexq_saved_snapshot_smoke.js
          node scripts/arvexq_official_odds_smoke.mjs
          node scripts/arvexq_live_odds_smoke.js
          node scripts/arvexq_static_racecard_smoke.js
          node scripts/arvexq_static_racecard_open_smoke.js
          node scripts/arvexq_morning_evidence_smoke.js
          python -m unittest discover -s tests -p 'test_live_delta_guard.py' -v

      - name: Historical sync SQLite contention and D1 batch regressions
        run: |
          python -m py_compile scripts/arvexq_sqlite_runtime_guard.py scripts/arvexq_history_repair.py scripts/arvexq_sync_batches.py
          python -m unittest discover -s tests -p 'test_arvexq_history_sync_guard.py' -v

      - name: Morning D1 integrity and immutable betting analytics regressions
        run: |
          python -m py_compile scripts/arvexq_bet_funnel.py scripts/arvexq_morning_d1_audit.py arvexq/prediction/career_evidence.py
          node --check scripts/arvexq_capture_prerace_bet.js
          python -m unittest discover -s tests -p 'test_preoff_integrity_monitor.py' -v
          python -m unittest discover -s tests -p 'test_prerace_bet_recovery.py' -v
          python -m unittest discover -s tests -p 'test_career_evidence.py' -v
          python -m unittest discover -s tests -p 'test_prerace_archive.py' -v
          python -m unittest discover -s tests -p 'test_daily_archive_audit.py' -v

      - name: Prefetch racecard delivery regression
        run: |
          python -m unittest discover -s tests -p 'test_prefetch_racecard_delivery.py' -v
          python -m unittest discover -s tests -p 'test_early_pace_enrichment.py' -v
          python -m unittest discover -s tests -p 'test_authorized_history_feeds.py' -v
          python -m unittest discover -s tests -p 'test_nar_official_csv.py' -v
          python -m unittest discover -s tests -p 'test_official_changes.py' -v
          python -m unittest discover -s tests -p 'test_podium_axis_gate.py' -v
          python -m unittest discover -s tests -p 'test_past_performance.py' -v
          python -m unittest discover -s tests -p 'test_full_career.py' -v
          python -m unittest discover -s tests -p 'test_career_transport.py' -v
          python -m unittest discover -s tests -p 'test_honmei_gate_relaxation.py' -v
          python -m unittest discover -s tests -p 'test_honmei_gate_relaxation.py' -v
          python -m unittest discover -s tests -p 'test_prerace_archive.py' -v
          python -m unittest discover -s tests -p 'test_research_shadow.py' -v
          python -m unittest discover -s tests -p 'test_research_evaluation.py' -v
          python -m unittest discover -s tests -p 'test_daily_archive_audit.py' -v
          python -m unittest discover -s tests -p 'test_race_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_factor_weight_calibration.py' -v

      - name: Architecture and operations guard
        run: |
          python - <<'PY'
          from pathlib import Path
          live=Path('.github/workflows/arvexq-sync.yml').read_text(encoding='utf-8')
          result_workflow=Path('.github/workflows/arvexq-result-repair.yml').read_text(encoding='utf-8')
          live_script=Path('scripts/arvexq_live_sync.py').read_text(encoding='utf-8')
          repair=Path('scripts/arvexq_result_repair.py').read_text(encoding='utf-8')
          prefetch=Path('scripts/arvexq_prefetch.py').read_text(encoding='utf-8')
          prefetch_workflow=Path('.github/workflows/arvexq-prefetch.yml').read_text(encoding='utf-8')
          sqlite_health=Path('scripts/arvexq_sqlite_health.py').read_text(encoding='utf-8')

          forbidden=['_prepare_race_snapshot(','_hydrate_fast_card_now(','result_targets = [rid for _, rid in sorted(result_targets, reverse=True)[:24]]']
          bad=[x for x in forbidden if x in live or x in live_script]
          if bad:raise SystemExit('live lane contains heavy/legacy path: '+repr(bad))

          required=['arvexq_live_sync.py','ARVEXQ_DATA_CORE: "0"','cancel-in-progress: true','details=0','CLOUDFLARE_API_BASE']
          missing=[x for x in required if x not in live]
          if missing:raise SystemExit('live workflow guard missing: '+repr(missing))

          if 'actions/cache/save@v4' in live:
              raise SystemExit('five-minute live workflow must not create a new cache every run')
          if 'actions/cache/save@v4' in result_workflow:
              raise SystemExit('five-minute result workflow must not create a new cache every run')
          if 'tail -n 300' in live or 'tail -n 400' in prefetch_workflow:
              raise SystemExit('workflow failure output is too verbose')

          if '[:24]' in repair:raise SystemExit('result repair must not cap pending results at 24')
          prefetch_required=['_build_fast_diagnosis_snapshot(','allow_network=True','deep_context=True','_merge_detail(','memory-authoritative']
          missing=[x for x in prefetch_required if x not in prefetch]
          if missing:raise SystemExit('prefetch must explicitly materialize and retain diagnosis: '+repr(missing))
          workflow_required=['missing_analysis_count','analysisCount','proceeding to D1 repair','D1_MISSING_CARDS','ARVEXQ_PREFETCH_WORKERS: "1"','ARVEXQ_PREFETCH_ANALYSIS_WORKERS: "1"','Validate restored SQLite cache','Stop bootstrap server to release SQLite writers','arvexq_sqlite_health.py']
          missing=[x for x in workflow_required if x not in prefetch_workflow]
          if missing:raise SystemExit('prefetch workflow correctness guard missing: '+repr(missing))
          if 'exit 1' in prefetch_workflow.split('if [ "$MISSING_CARD" -gt 0 ] || [ "$MISSING_ANALYSIS" -gt 0 ]; then',1)[-1].split('fi',1)[0]:
              raise SystemExit('AI diagnosis failures must never block D1 racecard publishing')
          sqlite_required=['PRAGMA quick_check','SQLITE_CACHE_BAD','*-wal','*-shm']
          missing=[x for x in sqlite_required if x not in sqlite_health]
          if missing:raise SystemExit('sqlite health guard missing: '+repr(missing))
          print('architecture and operations guard OK')
          PY

      - name: Merge, hash, result, prefetch and history invariants
        run: |
          python - <<'PY'
          import copy
          import sqlite3
          import tempfile
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          from arvexq.pipeline.fingerprints import analysis_input_hash
          import scripts.arvexq_live_sync as live
          import scripts.arvexq_result_repair as repair
          import scripts.arvexq_prefetch as prefetch
          import scripts.arvexq_history_repair as history
          import scripts.arvexq_sqlite_health as sqlite_health

          base={
            'id':'nar-2026-10-04-園田-01','date':'2026-10-04','track':'園田','circuit':'地方',
            'surface':'ダート','distance':1400,'weather':'晴','condition':'良','fieldSize':3,
            'horses':[{'horseNumber':1,'name':'テスト馬','jockey':'騎手A','trainer':'厩舎A','carriedWeight':54.0,'bodyWeight':480,'bodyWeightChange':0,'recentRaces':[{'date':'2026-09-01','finish':1}]},
                       {'horseNumber':2,'name':'テスト馬2','jockey':'騎手B','carriedWeight':55.0,'recentRaces':[{'finish':2}]},
                       {'horseNumber':3,'name':'テスト馬3','jockey':'騎手C','carriedWeight':56.0,'recentRaces':[{'finish':3}]}],
            'preparedMeta':{'diagnosisReady':True},'preRacePrediction':{'mark':'◎','score':88},'predictionAudit':{'locked':True},
            'predictionModelVersion':prefetch.FOUR_PILLAR_MODEL_VERSION,
          }
          base['preparedMeta']['analysisInputHash']=analysis_input_hash(base)
          fresh={'id':base['id'],'weather':'曇','condition':'稍重','horses':[{'horseNumber':1,'bodyWeight':486,'bodyWeightChange':6,'winOdds':2.8}]}
          market={'horses':[{'horseNumber':1,'winOdds':2.6,'popularity':1,'bodyWeight':486,'bodyWeightChange':6}]}
          merged=live.merge_live(base,fresh,market,False)
          h=merged['horses'][0]
          assert h['name']=='テスト馬' and h['recentRaces'][0]['finish']==1
          assert h['bodyWeight']==486 and h['winOdds']==2.6
          assert merged['preRacePrediction']==base['preRacePrediction'] and merged['predictionAudit']==base['predictionAudit']
          assert analysis_input_hash(merged)!=analysis_input_hash(base)
          odds_only=copy.deepcopy(base);odds_only['horses'][0]['winOdds']=99.9
          assert analysis_input_hash(odds_only)==analysis_input_hash(base)

          # Missing evidence must fan out across all providers. A broken source may
          # not prevent a later source from filling history, and target-day rows
          # must never leak into pre-race evidence.
          from arvexq.databanks.registry import DataBankRegistry, DataSource, SourceCapabilities
          from arvexq.ingest.fallback_enrichment import enrich_race_missing_sync
          reg=DataBankRegistry()
          def broken_history(horse,race,limit=5):
              raise RuntimeError('source down')
          def backup_history(horse,race,limit=5):
              return {'recentRaces':[
                  {'date':'2026-09-20','track':'園田','distance':1400,'finish':2,'fieldSize':10},
                  {'date':'2026-10-04','track':'園田','distance':1400,'finish':1,'fieldSize':10},
              ]}
          reg.register(DataSource('broken','NAR',10,SourceCapabilities(horse_history=True),{'horse_history':broken_history}))
          reg.register(DataSource('backup','NAR',20,SourceCapabilities(horse_history=True),{'horse_history':backup_history}))
          enriched=enrich_race_missing_sync(copy.deepcopy(base),bank_registry=reg,history_limit=5,max_parallel_horses=2)
          eruns=enriched['horses'][0]['recentRaces']
          assert any(r.get('date')=='2026-09-20' for r in eruns)
          assert not any(r.get('date')>='2026-10-04' for r in eruns)
          assert 'backup' in enriched['horses'][0].get('_supplementalSources',[])
          assert enriched['preparedMeta']['supplementalSearch']['failures']
          assert enriched['horses'][0]['name']=='テスト馬'

          # v344: ◎ requires a stable recent top-three history; it is not a
          # synonym for the top-ranked winner. No blanket JRA ban.
          from arvexq.prediction.honmei_gate import evaluate_honmei_gate
          rich_rows=[
              {'horse':{'horseNumber':1,'recentRaces':[{'date':f'2026-09-{i+10:02d}','finish':f,'fieldSize':12}
                for i,f in enumerate([1,8,9,9,8])]},
               'rank':1,'ability':.82,'record':.82,'suitability':.80,'pace':.85,
               'pillarRanks':{'ability':1,'record':1,'suitability':1,'pace':1},'sample':5,
               'evidenceFamilyCounts':{'ability':3,'record':4,'suitability':2,'pace':2},
               'multiHead':{'winRank':1,'strengthRank':1,'strengthScore':.76}},
              {'horse':{'horseNumber':2,'recentRaces':[{'date':f'2026-09-{i+10:02d}','finish':f,'fieldSize':12}
                for i,f in enumerate([2,2,3,2,4])]},
               'rank':2,'ability':.80,'record':.79,'suitability':.78,'pace':.77,
               'pillarRanks':{'ability':2,'record':2,'suitability':2,'pace':2},'sample':5,
               'evidenceFamilyCounts':{'ability':3,'record':4,'suitability':2,'pace':2},
               'multiHead':{'winRank':2,'strengthRank':2,'strengthScore':.75}},
          ]
          rich_summary={'winnerHorseNumber':1,'winnerGap':0.05}
          local_axis=evaluate_honmei_gate(rich_rows,rich_summary,{'circuit':'地方','date':'2026-10-09'})
          assert local_axis['eligible'] and local_axis['horseNumber']==2, local_axis
          central_axis=evaluate_honmei_gate(rich_rows,rich_summary,{'circuit':'中央','date':'2026-10-09'})
          assert central_axis['eligible'] and central_axis['horseNumber']==2, central_axis
          missing=copy.deepcopy(rich_rows)
          missing[1]['horse']['recentRaces']=[]
          assert not evaluate_honmei_gate(missing,rich_summary,{'circuit':'地方','date':'2026-10-09'})['eligible']
          thin=copy.deepcopy(rich_rows)
          thin[1]['evidenceFamilyCounts']['pace']=1
          assert not evaluate_honmei_gate(thin,rich_summary,{'circuit':'中央','date':'2026-10-09'})['eligible']

          old_final={'status':'確定','finishers':[{'finish':1,'horseNumber':1},{'finish':2,'horseNumber':2},{'finish':3,'horseNumber':3}]}
          flash={'status':'速報','finishers':[{'finish':1,'horseNumber':9}]}
          assert live._merge_result(old_final,flash)==old_final
          assert repair._merge_result(old_final,flash)==old_final

          upgraded=repair._merge_detail(base,{'id':base['id'],'horses':[{'horseNumber':1}],'result':{'status':'確定','finishers':old_final['finishers'],'payouts':[{'type':'単勝','amount':500}]}})
          assert upgraded['horses'][0]['name']=='テスト馬' and upgraded['preRacePrediction']==base['preRacePrediction']
          assert upgraded['result']['status']=='確定'

          assert prefetch._analysis_current(base)
          changed=copy.deepcopy(base);changed['horses'][0]['bodyWeight']=488
          assert not prefetch._analysis_current(changed)

          stale=copy.deepcopy(base);stale['preparedMeta']={};stale.pop('preRacePrediction',None);stale.pop('predictionAudit',None)
          orig_raw=prefetch._raw_snapshot
          orig_seed=prefetch._seed_snapshot
          orig_build=prefetch.app._build_fast_diagnosis_snapshot
          calls=[]
          try:
              prefetch._raw_snapshot=lambda rid: copy.deepcopy(stale)
              prefetch._seed_snapshot=lambda d: None
              def build(rid,allow_network=False,deep_context=False):
                  calls.append((allow_network,deep_context))
                  d=copy.deepcopy(stale)
                  d.setdefault('preparedMeta',{})['diagnosisReady']=True
                  d['preRacePrediction']={'mark':'◎','score':91}
                  d['horses'][0]['aiEvaluation']='S'
                  return d
              prefetch.app._build_fast_diagnosis_snapshot=build
              ready,error=prefetch._ensure_analysis(base['id'],stale)
              assert prefetch._analysis_ready(ready), error
              assert ready['preRacePrediction']['score']==91
              assert ready['horses'][0]['name']=='テスト馬'
              assert ready['horses'][0]['aiEvaluation']=='S'
              assert calls==[(False,False)]
              final=prefetch._merge_detail(prefetch._raw_snapshot(base['id']),ready)
              assert prefetch._analysis_ready(final) and final['preRacePrediction']['score']==91
          finally:
              prefetch._raw_snapshot=orig_raw
              prefetch._seed_snapshot=orig_seed
              prefetch.app._build_fast_diagnosis_snapshot=orig_build

          complete=copy.deepcopy(base);complete['result']={'status':'確定','finishers':old_final['finishers'],'payouts':[{'type':'単勝','amount':500}]}
          assert history.card_complete(complete) and history.history_complete(complete)
          no_pay=copy.deepcopy(complete);no_pay['result']['payouts']=[]
          assert not history.history_complete(no_pay)

          jst=timezone(timedelta(hours=9));now=datetime(2026,10,5,8,0,tzinfo=jst)
          assert repair._started({'date':'2026-10-04','startTime':'23:59'},now)
          assert not repair._started({'date':'2026-10-06','startTime':'00:01'},now)

          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              healthy=root/'healthy.sqlite'
              con=sqlite3.connect(healthy);con.execute('create table t(x text)');con.execute("insert into t values ('ok')");con.commit();con.close()
              checked,removed,_=sqlite_health.sanitize(root)
              assert checked==1 and removed==0 and healthy.exists()
              broken=root/'broken.sqlite'
              broken.write_bytes(sqlite_health.SQLITE_MAGIC + b'broken' * 128)
              checked,removed,files=sqlite_health.sanitize(root)
              assert removed==1 and not broken.exists() and any('broken.sqlite' in x for x in files)
          print('pipeline invariants OK')
          PY

      - name: Validate workflow YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('arvexq-*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print('yaml OK',path.name)
          PY

      - name: Show concise build log on failure
        if: failure()
        run: tail -n 80 build-static.log 2>/dev/null || true
