name: Sectional Fix Measurement
on:
  push:
    branches: [codex/arvexq-section-fix-measurement]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_upstream_sectional_casing.py -v
      - run: PYTHONPATH=. python scripts/arvexq_sectional_fix_measurement.py
      - uses: actions/upload-artifact@v4
        with:
          name: sectional-coverage
          path: research-output/sectional-availability.json
