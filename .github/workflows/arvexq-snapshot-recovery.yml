name: ARVEXQ Lossless Saved Snapshot Recovery
on:
  workflow_dispatch:
    inputs:
      date:
        description: Existing cache date to restore without recalculation
        required: true
        default: '2026-10-10'
permissions:
  contents: write
concurrency:
  group: arvexq-snapshot-recovery
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-recovery-${{ github.run_id }}
          restore-keys: |
            arvexq-prefetch-Linux-${{ inputs.date }}-
          fail-on-cache-miss: true
      - name: Export and verify existing originals from read-only SQLite
        env:
          RECOVERY_DATE: ${{ inputs.date }}
        run: |
          bash arvexq/components/item_150/scripts/export_verified_originals.sh
      - name: Commit restored originals only
        env:
          RECOVERY_DATE: ${{ inputs.date }}
        run: |
          bash arvexq/components/item_150/scripts/commit_verified_originals.sh
