name: ARVEXQ Dead Heat Fix

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/arvexq_patch_dead_heat_results.py
      - .github/workflows/arvexq-dead-heat-fix.yml

permissions:
  contents: write

concurrency:
  group: arvexq-dead-heat-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch dead-heat podium acceptance
        run: python scripts/arvexq_patch_dead_heat_results.py
      - name: Compile check
        run: python -m py_compile app.py scripts/arvexq_patch_dead_heat_results.py
      - name: Commit parser fix
        run: |
          if [ -z "$(git status --porcelain -- app.py)" ]; then
            echo "Dead-heat parser already current"
            exit 0
          fi
          git config user.name 'arvexq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git commit -m 'fix: accept NAR dead-heat podium results'
          git pull --rebase origin main
          git push
