name: ARVEXQ Server Pre-Race Seal

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/arvexq_freeze_predictions.py
      - scripts/arvexq_capture_prerace_bet.js
      - scripts/arvexq_prerace_bet_integrity.py
      - arvexq/ui/static/betting/**
      - arvexq/ui/static/morning/ticket_lane_classifier.js
      - arvexq/prediction/prerace_archive.py
      - .github/workflows/arvexq-prerace-freeze.yml
  schedule:
    # Every 5 minutes in the Japanese racing window (JST 07:00-23:59).
    # GitHub scheduling is best effort; alert on incomplete snapshots.
    - cron: "*/5 22-23 * * *"
    - cron: "*/5 0-14 * * *"

concurrency:
  group: arvexq-server-prerace-seal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -q -r requirements.txt
      - name: Server seal unit regressions
        run: |
          node --check scripts/arvexq_capture_prerace_bet.js
          python -m unittest discover -s tests -p 'test_prerace_archive.py' -v
          python -m unittest discover -s tests -p 'test_prerace_bet_recovery.py' -v
      - name: Seal upcoming races into Cloudflare D1
        run: PYTHONPATH=. python scripts/arvexq_freeze_predictions.py --audit prerace-freeze-report.json --ahead-minutes 35
      - name: Upload seal audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-prerace-seal-${{ github.run_id }}
          path: prerace-freeze-report.json
          if-no-files-found: warn
