name: ARVEXQ D1 Capacity Recovery (Verified Backup + Lossless Compress)
# Emergency recovery for storage-capacity-exhausted D1 write blocks.
# Job 1 measures and takes a fresh verified, encrypted full backup.
# Job 2 losslessly compresses every backed-up race_details payload in place
# (server-verified compare-and-swap) and publishes the recovery report.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/arvexq-d1-capacity-recovery.yml', 'scripts/arvexq_d1_compress_recovery.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arvexq-d1-capacity-recovery
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure D1 before any change
        run: |
          python - <<'PY'
          import os, json, urllib.request
          req = urllib.request.Request('https://kraiz-api.4b89h4fydd.workers.dev/api/admin/storage-audit', headers={'Authorization': 'Bearer ' + os.environ['SYNC_TOKEN'], 'User-Agent': 'Mozilla/5.0 ARVEXQ-RecoveryAudit/1.0'})
          with urllib.request.urlopen(req, timeout=60) as response:
              metrics = json.load(response)
          with open('audit-before.json', 'w') as f:
              json.dump(metrics, f, indent=2)
          print(json.dumps(metrics['queries'], indent=2))
          PY
      - name: Export all original application tables and verify reopened SQLite
        run: python scripts/arvexq_backup_live_d1.py
      - name: Encrypt verified backup and publish protected backup branch
        run: |
          python - <<'PY'
          import os, json, gzip, shutil, subprocess, hashlib
          from pathlib import Path
          certificate = Path('/tmp/arvexq-backup-public.pem')
          certificate.write_text(os.environ.get('BACKUP_PUBLIC_CERTIFICATE') or "-----BEGIN CERTIFICATE-----\nMIIEHzCCAoegAwIBAgIUKey76MllZ+4yVZCSguPGKIYY6GEwDQYJKoZIhvcNAQEL\nBQAwHzEdMBsGA1UEAwwUQVJWRVhRIHNvdXJjZSBiYWNrdXAwHhcNMjYxMDEwMDkz\nMDEwWhcNMjYxMDE3MDkzMDEwWjAfMR0wGwYDVQQDDBRBUlZFWFEgc291cmNlIGJh\nY2t1cDCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCCAYoCggGBAJ64fgtu/m05VEBE\nRpUA7uZWo1JQq9npdYSLAjzcnKiJhf1jrroLXXiMbmqEjzLnsgbtZQlrWgScNHqB\nAQpahM2mTQgEyRk+RcaS4sbProjHAboKsNATVaWIl2ifpR7jkmbkITlhtyLBrwKf\nj27lpDdTqHGDRXkyLSjDr8qOn/9dBGQiEyllDOJyzAhlsuaFEENriEnVDngR4Nzx\nQBogJTRtFMIAPmolt4UmnRGzUBxKpU7cDMBcGQQMQsgYCgLXToKaLr+RoPvFoGFI\nbWb9hXys9rLnSCxa9iy88saaSZ3rkBR2ZRcCsSvXojgsk4F5K0fVB+bULgKr3ibW\ngVzcP2pnRhHqcSggrYygFWt87b3yYdzbYWm2hDK76FI4K5JSAF9qa6j3Gbz1R5Pm\nDrgZ5VwCP9hGOHi5+LZP+misNa6w0NiU+U5jYhHXxWir01vb1XVMoHDTpNNN42TZ\nId/5aKvjUk1cUov9Gpv5n55Y0mYUjaiDnvd+6VifL1G6yRfYvQIDAQABo1MwUTAd\nBgNVHQ4EFgQUm0BxiUK4xmknvrD4fEgBuUFLpK4wHwYDVR0jBBgwFoAUm0BxiUK4\nxmknvrD4fEgBuUFLpK4wDwYDVR0TAQH/BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOC\nAYEAZL8ZI7mef+eGfls6CNpOE1m3k17MGL8EYkuexSPGCjgHQjwK4SOuM5IpIR6U\nqQjHTyNT1eOnflfGR25BUBq9AOE+0Y2uUBLn/scPREOx40UiT5tZ01mJ7T6EWo8C\ngHxeIqm9xWr2oT0nlMQjd1K1zJPsFC4nTyxJSbuX430kgK1P2irrPKpUbZaA1TbH\n8CH5mqHwWxq9oqj1U5xn6bqXkbcXYWMbk7pi2EJzK1lhWueaLLUefm0efKfR+A7o\nfm/wR96ivr1BZqG95NBw1E49FVzVjTtUW4MRi/AZBhxOMvu0E+D+D9FIHtfmZqgz\nGScDE+O0KtgybzaFhN2YakwNIDdKfVdMFVKmHURKc2EjHfNoyb6FTE5MN3fb/EXd\n3lXRSml5Cdylkw23DIwMYbk9MworuiwZys7cbIC8i2GCkYV/QA4Xi66SaoM3ajdN\nBvg6ztg2MUEkXeSlosz74lWcTvaOGtJ/o29X1DIQ0qrBPDUIKqg1YgG8d5V36eFk\nAd7z\n-----END CERTIFICATE-----")
          with open('/tmp/arvexq-complete-d1.sqlite3', 'rb') as source, gzip.open('/tmp/arvexq-complete-d1.sqlite3.gz', 'wb', compresslevel=9) as target:
              shutil.copyfileobj(source, target)
          subprocess.run(['openssl', 'cms', '-encrypt', '-binary', '-aes256', '-in', '/tmp/arvexq-complete-d1.sqlite3.gz', '-outform', 'DER', '-out', '/tmp/arvexq-complete-d1.p7m', str(certificate)], check=True)
          root = Path('protected-backups') / ('d1-recovery-' + os.environ['GITHUB_RUN_ID'])
          root.mkdir(parents=True)
          summary = json.load(open('/tmp/arvexq-complete-d1-summary.json'))
          parts = []
          digest = hashlib.sha256()
          with open('/tmp/arvexq-complete-d1.p7m', 'rb') as source:
              while chunk := source.read(20 * 1024 * 1024):
                  name = 'backup.p7m.part' + str(len(parts)).zfill(3)
                  (root / name).write_bytes(chunk)
                  digest.update(chunk)
                  parts.append(name)
          summary['encrypted_parts'] = parts
          summary['encrypted_sha256'] = digest.hexdigest()
          summary['encrypted_bytes'] = sum((root / name).stat().st_size for name in parts)
          (root / 'manifest.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2))
          shutil.copy('audit-before.json', root / 'audit-before.json')
          print('PROTECTED_BACKUP_READY', 'path=' + str(root), 'encrypted_bytes=' + str(summary['encrypted_bytes']), 'restore_verified=' + str(summary['restore_verified']))
          PY
          BRANCH="backup/d1-recovery-$GITHUB_RUN_ID"
          git checkout -b "$BRANCH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add protected-backups
          git commit -m "Verified D1 backup before lossless capacity recovery"
          git push origin "$BRANCH"
  compress:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: backup/d1-recovery-${{ github.run_id }}
          path: verified-backup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify codec roundtrip before writing
        run: python -m unittest tests.test_full_snapshot_codec
      - name: Compress every backed-up original in place and verify every restore
        run: python scripts/arvexq_d1_compress_recovery.py verified-backup/protected-backups/d1-recovery-${{ github.run_id }}/manifest.json
      - name: Publish recovery report to the backup branch
        if: always()
        run: |
          ROOT="verified-backup/protected-backups/d1-recovery-${{ github.run_id }}"
          if [ -f d1-compress-recovery-report.json ]; then cp d1-compress-recovery-report.json "$ROOT/recovery-report.json"; fi
          if [ -s supplementary-originals.jsonl ]; then gzip -9 -c supplementary-originals.jsonl > "$ROOT/supplementary-originals.jsonl.gz"; fi
          cd verified-backup
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "D1 capacity recovery report" || echo "nothing to publish"
          git push origin HEAD:backup/d1-recovery-${{ github.run_id }} || echo "report push failed"
