name: ARVEXQ All-Races Live UI

on:
  push:
    branches: [main]
    paths:
      - 'arvexq/ui/static/app.js'
      - 'arvexq/ui/static/sports/unified-home.js'
      - 'arvexq/ui/static/sports/horse-portal.js'
      - 'arvexq/ui/static/sports/all-races.css'
      - 'arvexq/ui/static/sports/boat-app/**'
      - 'tests/boat_horse_realtime_sync.mjs'
      - 'scripts/arvexq_realtime_navigation_smoke.js'
      - 'scripts/arvexq_dual_sport_ui_smoke.js'
      - '.github/workflows/arvexq-all-races-live-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify all 12 races change status without hiding results
        run: |
          set -euo pipefail
          node --check arvexq/ui/static/sports/unified-home.js
          node --check arvexq/ui/static/sports/horse-portal.js
          node --check arvexq/ui/static/sports/boat-app/app.js
          node tests/boat_horse_realtime_sync.mjs
          node tests/boat_all_races_smoke.mjs
      - name: Install iPhone Chromium and WebKit browsers
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium webkit
      - name: Verify actual production 1R–12R layout and darkening on iPhone
        env:
          ARVEXQ_BASE_URL: https://kraizweb1.4b89h4fydd.workers.dev
        run: |
          set -euo pipefail
          node scripts/arvexq_realtime_navigation_smoke.js
          node scripts/arvexq_dual_sport_ui_smoke.js
          echo "ALL_VENUES_ALL_RACES_REALTIME_PRODUCTION_VERIFIED"
