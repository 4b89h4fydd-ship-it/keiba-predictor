name: ARVEXQ Horse All-Races Live UI

on:
  push:
    branches: [main]
    paths:
      - 'arvexq/ui/static/app.js'
      - 'arvexq/ui/static/sports/unified-home.js'
      - 'arvexq/ui/static/sports/horse-portal.js'
      - 'arvexq/ui/static/sports/all-races.css'
      - 'arvexq/ui/static/styles/race_v222_plus.css'
      - 'arvexq/ui/static/sports/unified-home.css'
      - 'arvexq/ui/static/sports/horse-portal.js'
      - 'tests/horse_realtime_sync.mjs'
      - 'scripts/arvexq_realtime_navigation_smoke.js'
      - 'scripts/arvexq_paper_palette_smoke.js'
      - 'scripts/arvexq_horse_portal_smoke.js'
      - '.github/workflows/arvexq-all-races-live-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify all 12 races change status without hiding results
        run: |
          set -euo pipefail
          node --check arvexq/ui/static/sports/unified-home.js
          node --check arvexq/ui/static/sports/horse-portal.js
          node tests/horse_realtime_sync.mjs
          node scripts/arvexq_horse_portal_smoke.js
      - name: Install iPhone Chromium and WebKit browsers
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium webkit
      - name: Verify local horse-only 1R-12R layout and darkening on iPhone
        env:
          ARVEXQ_BASE_URL: http://127.0.0.1:8790
        run: |
          set -euo pipefail
          python build_static.py
          python -m http.server 8790 --directory dist >/tmp/arvexq-horse-ui.log 2>&1 &
          sleep 2
          node scripts/arvexq_paper_palette_smoke.js
          node scripts/arvexq_realtime_navigation_smoke.js
          echo "HORSE_ALL_VENUES_12R_LOCAL_VERIFIED"
