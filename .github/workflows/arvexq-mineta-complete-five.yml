name: ARVEXQ Mineta Complete Evidence Five
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arvexq-mineta-complete-five.yml
      - scripts/arvexq_mineta_evidence_complete_pilot.py
      - tests/test_mineta_complete_observations.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-five:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt
      - name: Check observed data and identity tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p test_mineta_complete_observations.py -v
      - name: Find five fully comparable NAR races and run all models
        run: |
          mkdir -p research-output
          PYTHONPATH=. python scripts/arvexq_mineta_evidence_complete_pilot.py --out research-output/mineta-complete-five.json --max-candidates 30 --max-requests 280
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mineta-complete-five-results
          path: research-output/mineta-complete-five.json
          if-no-files-found: warn
