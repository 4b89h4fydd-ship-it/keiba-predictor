name: Sectional Storage Roundtrip
on:
  push:
    branches: [codex/arvexq-preserve-sectionals-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_sectional_storage_roundtrip.py -v
      - run: python -m unittest discover -s tests -p test_three_factor_unified.py -v
