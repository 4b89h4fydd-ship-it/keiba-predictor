name: KRAIZ Production Sync

"on":
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      RENDER_BASE_URL: https://keiba-predictor-1qjo.onrender.com
      CLOUDFLARE_SYNC_URL: https://kraiz-api.4b89h4fydd.workers.dev/api/sync
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

    steps:
      - name: Set date
        run: |
          echo "SYNC_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"

      - name: Wake Render
        run: |
          curl -sS -L \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 120 \
            "$RENDER_BASE_URL/health" > /dev/null

      - name: Start KRAIZ preparation
        run: |
          curl -sS -L \
            --retry 4 \
            --retry-all-errors \
            --max-time 120 \
            "$RENDER_BASE_URL/api/v1/site-bootstrap?date=$SYNC_DATE&force=1" \
            -o bundle.json

      - name: Wait for race data
        run: |
          for i in 1 2 3 4 5 6 7 8
          do
            curl -sS -L \
              --retry 3 \
              --retry-all-errors \
              --max-time 120 \
              "$RENDER_BASE_URL/api/v1/site-bootstrap?date=$SYNC_DATE" \
              -o bundle.json

            RACES=$(jq '.races // [] | length' bundle.json)
            DETAILS=$(jq '.details // [] | length' bundle.json)
            COMPLETE=$(jq -r '.displayComplete // .complete // false' bundle.json)

            echo "Attempt $i: races=$RACES details=$DETAILS complete=$COMPLETE"

            if [ "$RACES" -gt 0 ] && [ "$DETAILS" -gt 0 ] && [ "$COMPLETE" = "true" ]; then
              break
            fi

            sleep 15
          done

      - name: Build D1 payload
        run: |
          jq '{
            summaries: (.races // []),
            details: (.details // []),
            meta: {
              source: "render-site-bootstrap",
              sync_date: (.date // ""),
              race_count: ((.races // []) | length),
              detail_count: ((.details // []) | length),
              display_complete: (.displayComplete // .complete // false)
            }
          }' bundle.json > payload.json

          echo "Races:"
          jq '.summaries | length' payload.json

          echo "Details:"
          jq '.details | length' payload.json

      - name: Sync to Cloudflare D1
        run: |
          curl --fail-with-body \
            -X POST \
            "$CLOUDFLARE_SYNC_URL" \
            -H "content-type: application/json" \
            -H "x-sync-token: $SYNC_TOKEN" \
            --data-binary @payload.json
