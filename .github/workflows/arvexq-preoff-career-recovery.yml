name: Preoff Career Recovery
on:
  push:
    branches: [codex/arvexq-career-archive-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_preoff_archive_recovery.py -v
      - run: python -m unittest discover -s tests -p test_past_performance.py -v
      - run: python -m unittest discover -s tests -p test_three_factor_unified.py -v
