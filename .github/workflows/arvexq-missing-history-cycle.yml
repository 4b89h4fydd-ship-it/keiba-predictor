name: ARVEXQ Missing History Full Cycle
"on":
  push:
    branches: [fix/arvexq-new-engine-complete-field-20261022]
    paths:
      - scripts/arvexq_missing_history_cycle.py
      - .github/workflows/arvexq-missing-history-cycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  missing-history-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
      ARVEXQ_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt pytest==9.1.1
      - name: Existing temporal leakage regression
        run: PYTHONPATH=. python -m pytest -q tests/test_research_provisional_replay.py
      - name: Run missing-history gate diagnosis and full walk-forward comparison
        run: |
          set -o pipefail
          PYTHONPATH=. python -u scripts/arvexq_missing_history_cycle.py | tee missing-history-cycle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-history-cycle-${{ github.run_id }}
          path: missing-history-cycle.log
          if-no-files-found: warn
          retention-days: 14
