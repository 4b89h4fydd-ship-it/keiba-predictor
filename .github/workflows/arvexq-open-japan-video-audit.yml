name: ARVEXQ Open Japan Racing Video Source Audit

"on":
  pull_request:
    branches: [main]
    paths:
      - scripts/arvexq_discover_open_japan_video.py
      - tests/test_discover_open_japan_video.py
      - .github/workflows/arvexq-open-japan-video-audit.yml
  workflow_dispatch:
  schedule:
    # Every Tuesday at 10:17 JST (01:17 UTC).
    - cron: "17 1 * * 2"

permissions:
  contents: read

concurrency:
  group: arvexq-japan-open-video-audit
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source-audit failure/no-source contracts
        run: |
          python -m unittest discover -s tests -p 'test_discover_open_japan_video.py' -v
      - name: Inspect Wikimedia Commons metadata (no movie download)
        run: |
          python scripts/arvexq_discover_open_japan_video.py \
            --max-categories 20 --max-items 1500 \
            --output .arvexq-data/open-japan-racing-video-audit.json
      - name: Archive metadata-only rights audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-japan-open-video-audit
          path: .arvexq-data/open-japan-racing-video-audit.json
          if-no-files-found: warn
          retention-days: 30
