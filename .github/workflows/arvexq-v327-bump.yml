name: ARVEXQ v327 Build Bump

on:
  push:
    branches: [main]
    paths:
      - 'scripts/arvexq_bump_build_v327.py'
      - '.github/workflows/arvexq-v327-bump.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arvexq-v327-build-bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply coherent v327 generation
        run: python scripts/arvexq_bump_build_v327.py
      - name: Verify sources and static build
        run: |
          python -m py_compile app.py build_static.py scripts/arvexq_bump_build_v327.py
          node --check arvexq/ui/static/app.js
          python build_static.py
          test "$(tr -d '\r\n' < dist/build-version.txt)" = "v327"
          test -f dist/app-v327.js
          test -f dist/styles-arvexq-v327.css
          test -f dist/sw-v327-reset.js
          test -f dist/sw-v326-reset.js
          grep -q '/app-v327.js' dist/index.html
          grep -q '/styles-arvexq-v327.css' dist/index.html
          node --check dist/app-v327.js
      - name: Commit v327 generation
        run: |
          TARGETS="app.py build_static.py arvexq/ui/static/index.html arvexq/ui/static/app.js"
          if [ -z "$(git status --porcelain -- $TARGETS)" ]; then
            echo 'v327 already applied'
            exit 0
          fi
          git config user.name 'arvexq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'fix: force v327 webapp refresh and race-open recovery'
          git pull --rebase origin main
          git push
