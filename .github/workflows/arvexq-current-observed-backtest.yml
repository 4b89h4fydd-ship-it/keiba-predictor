name: ARVEXQ Historical Current-Model Backtest
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/arvexq_current_observed_backtest.py
      - tests/test_current_observed_backtest.py
      - .github/workflows/arvexq-current-observed-backtest.yml
permissions:
  contents: read
jobs:
  current-observed-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install prediction dependencies
        run: pip install -r requirements.txt
      - name: Test historical replay behavior
        run: python -m unittest tests.test_current_observed_backtest -v
      - name: Fetch past race inputs and evaluate CURRENT model
        run: python -m scripts.arvexq_current_observed_backtest --days 28 --max-races 500 --out research-output/current-observed-6040
      - name: Preserve fetched coverage and comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-observed-6040-report
          path: research-output/current-observed-6040/report.json
          if-no-files-found: warn
