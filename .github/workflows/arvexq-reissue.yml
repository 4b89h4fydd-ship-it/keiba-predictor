name: arvexq-reissue

# Slim reissue path: processes ONLY the races listed in
# arvexq/reissue_requests/requests.json through the publish lane's
# per-race machinery (build -> protect -> POST /api/sync ->
# read-back), instead of re-evaluating a whole date the way
# arvexq-rewrite-publish does. Publishing still happens only inside
# GitHub Actions with the existing SYNC_TOKEN secret; there is no
# new credential and the protect seam is untouched.
#
# The results commit touches only results.json, which is outside
# this workflow's path filter (and outside the publish workflow's),
# so it cannot retrigger either workflow.
#
# Shares its concurrency group with arvexq-rewrite-publish so a
# slim reissue can never write the same race concurrently with a
# full publish run.

on:
  push:
    branches: [main]
    paths:
      - 'arvexq/reissue_requests/requests.json'
  workflow_dispatch:
    inputs:
      dry_run_all:
        description: 'Evaluate every pending request in dry-run mode (build only, never post)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: arvexq-rewrite-publish
  cancel-in-progress: false

jobs:
  reissue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Process reissue requests
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          args=""
          if [ "${{ inputs.dry_run_all }}" = "true" ]; then args="--dry-run-all"; fi
          python3 scripts/arvexq_reissue_process.py $args

      - name: Commit reissue results
        if: always()
        run: |
          # The ledger is shared state: another run may have
          # committed results while this one processed (every run
          # drains the whole pending queue, so overlapping runs are
          # expected and harmless). Merge this run's output over the
          # CURRENT main version (outcomes union; observations
          # appended, deduplicated) and build the commit with
          # plumbing directly on top of the current tip, so the
          # push is a fast-forward by construction. Fail visibly if
          # the results cannot be landed after several attempts.
          cp arvexq/reissue_requests/results.json /tmp/new_results.json
          git config user.name "ARVEXQ Reissue Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          landed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git show origin/main:arvexq/reissue_requests/results.json > /tmp/base_results.json 2>/dev/null \
              || echo '{"version": 1, "results": {}, "observations": {}}' > /tmp/base_results.json
            python3 - <<'PYEOF'
          import json
          with open("/tmp/base_results.json", encoding="utf-8") as fh:
              base = json.load(fh)
          with open("/tmp/new_results.json", encoding="utf-8") as fh:
              new = json.load(fh)
          base.setdefault("results", {}).update(new.get("results") or {})
          observations = base.setdefault("observations", {})
          for race, entries in (new.get("observations") or {}).items():
              existing = observations.setdefault(race, [])
              seen = {(o.get("observed_at"), o.get("request_id"))
                      for o in existing}
              for obs in entries:
                  key = (obs.get("observed_at"), obs.get("request_id"))
                  if key not in seen:
                      existing.append(obs)
          with open("arvexq/reissue_requests/results.json", "w",
                    encoding="utf-8") as fh:
              json.dump(base, fh, ensure_ascii=False, indent=1)
              fh.write("\n")
          PYEOF
            git read-tree origin/main
            git add arvexq/reissue_requests/results.json
            if git diff --cached --quiet origin/main; then
              echo "RESULTS_UNCHANGED"
              landed=1
              break
            fi
            tree=$(git write-tree)
            commit=$(git commit-tree "$tree" -p origin/main -m "data: slim reissue results (run ${{ github.run_id }})")
            if git push origin "$commit:main"; then
              echo "RESULTS_COMMITTED $commit"
              landed=1
              break
            fi
            sleep 3
          done
          if [ "$landed" != "1" ]; then
            echo "RESULTS_COMMIT_FAILED"
            exit 1
          fi
