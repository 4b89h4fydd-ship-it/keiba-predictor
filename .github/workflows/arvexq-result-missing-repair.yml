name: ARVEXQ Result-Missing History Repair (2026-11-10)

# One-off extension of the steady result-repair lane to the stored
# days whose results are still missing entirely (the result_missing
# residuals recorded by the payout-duplicate wave, section 7 of
# hidden_files/nar-payout-duplicate-fix-20261109.md):
#   2026-10-20 (Morioka 01/02), 2026-10-23 (Urawa 03),
#   2026-10-25 (Morioka 02/03/11/12).
# Same production machinery as arvexq-jra-payout-history-repair.yml
# (fetch bundle -> restore -> result repair -> protect-sync -> named
# audit), whole-day with no box filter, environment backfill disabled
# (ARVEXQ_RESULT_ENV_FILL_LIMIT=0). Triggered by a push to
# arvexq/result_missing_repair_requests/requests.json (a PAT cannot
# dispatch workflows); the date list is read from that file.
# Difference from the family lanes: every stage writes a marker and
# the run always commits a compact summary back to
# arvexq/result_missing_repair_requests/results.json, so the outcome
# is readable even when artifact downloads are unavailable. A stage
# failure is recorded per date and the job fails at the end if any
# date failed; it never stops the remaining dates.

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - arvexq/result_missing_repair_requests/requests.json

permissions:
  contents: write

concurrency:
  group: arvexq-result-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-data
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      NAR_ON_DEMAND_HISTORY_MONTHS: "12"
      ARVEXQ_RESULT_WORKERS: "6"
      ARVEXQ_RESULT_RETRY_SLEEP_SEC: "3"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest

      - name: Result repair regression tests
        run: |
          python -m unittest discover -s tests -p 'test_result_stalled_regressions.py' -v
          python -m unittest discover -s tests -p 'test_result_repair_retired_banei.py' -v
          python -m unittest discover -s tests -p 'test_result_repair_env_fill.py' -v
          python -m pytest tests/test_result_repair_bundle_fallback.py -q
          python -m pytest tests/test_payout_payload_shape_stubs.py -q

      - name: Read and validate the requested dates
        run: |
          python - <<'PYEOF'
          import json, re
          req = json.load(open("arvexq/result_missing_repair_requests/requests.json", encoding="utf-8"))
          dates = req.get("dates") or []
          assert dates, "request file carries no dates"
          for d in dates:
              assert re.fullmatch(r"2026-\d{2}-\d{2}", str(d)), f"bad date: {d}"
          with open("repair-dates.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(str(d) for d in dates) + "\n")
          print(f"dates={len(dates)}: {dates}")
          PYEOF

      - name: Restore warm cache read-only
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-result-readonly-${{ runner.os }}-missing-${{ github.run_id }}
          restore-keys: |
            arvexq-prefetch-${{ runner.os }}-
            arvexq-data-${{ runner.os }}-

      - name: Repair every requested date (fetch -> repair -> protect-sync -> audit)
        env:
          # Step-scoped on purpose: repair() reads this limit from the
          # process env, and the regression tests above exercise
          # repair() with the default limit.
          ARVEXQ_RESULT_ENV_FILL_LIMIT: "0"
        run: |
          set -u
          mkdir -p stage-marks
          FAILED=""
          : > repair-summary.txt
          while read -r DATE; do
            [ -n "$DATE" ] || continue
            echo "================ $DATE ================"
            ok=1
            python scripts/arvexq_fetch_d1_bundle.py \
              --api-base "$CLOUDFLARE_API_BASE" \
              --date "$DATE" \
              --out "bundle-$DATE.json" \
              --report "d1-bundle-report-$DATE.json" \
              --workers 8 \
              --allow-missing-details --allow-empty-day || ok=0
            if [ "$ok" = 1 ]; then echo fetch-ok > "stage-marks/$DATE.fetch"; else echo fetch-FAILED > "stage-marks/$DATE.fetch"; fi
            if [ "$ok" = 1 ]; then
              python scripts/arvexq_restore_result_day.py \
                --bundle "bundle-$DATE.json" --date "$DATE" \
                --report "result-day-index-$DATE.json" || ok=0
              if [ "$ok" = 1 ]; then echo restore-ok > "stage-marks/$DATE.restore"; else echo restore-FAILED > "stage-marks/$DATE.restore"; fi
            fi
            if [ "$ok" = 1 ]; then
              if ! PYTHONPATH=. python scripts/arvexq_result_repair.py \
                  --bundle "bundle-$DATE.json" \
                  --payload "result-repair-payload-$DATE.json" \
                  --report "result-repair-report-$DATE.json" \
                  > "result-repair-$DATE.log" 2>&1
              then
                echo "::error::Result repair failed for $DATE"
                tail -n 60 "result-repair-$DATE.log" || true
                echo repair-FAILED > "stage-marks/$DATE.repair"
                ok=0
              else
                echo repair-ok > "stage-marks/$DATE.repair"
              fi
            fi
            if [ "$ok" = 1 ]; then
              jq -c '{date, started, pending_before, repairedCount:(.repaired|length), resultMissing:(.result_missing|length), payoutMissing:(.payout_missing|length)}' \
                "result-repair-report-$DATE.json" >> repair-summary.txt || true
              PYTHONPATH=. python scripts/arvexq_payout_payload_sanitize.py \
                --payload "result-repair-payload-$DATE.json" || ok=0
              PYTHONPATH=. python scripts/arvexq_payout_payload_shape_stubs.py \
                --payload "result-repair-payload-$DATE.json" \
                --api-base "$CLOUDFLARE_API_BASE" \
                || echo "::warning::stub shaping failed for $DATE"
              if [ "$ok" = 1 ]; then echo sanitize-ok > "stage-marks/$DATE.sanitize"; else echo sanitize-FAILED > "stage-marks/$DATE.sanitize"; fi
            fi
            if [ "$ok" = 1 ]; then
              STARTED=$(jq '.meta.started_race_count // 0' "result-repair-payload-$DATE.json")
              if [ "$STARTED" -gt 0 ]; then
                python scripts/arvexq_sync_batches.py \
                  --input "result-repair-payload-$DATE.json" \
                  --out-dir "result-sync-batches-$DATE" || ok=0
                if [ "$ok" = 1 ]; then
                  for file in result-sync-batches-$DATE/batch-*.json; do
                    safe=0
                    for attempt in 1 2 3; do
                      if PYTHONPATH=. python scripts/arvexq_protect_sync.py --file "$file" --api-base "$CLOUDFLARE_API_BASE"; then
                        safe=1; break
                      fi
                      sleep $((attempt * 5))
                    done
                    test "$safe" = 1 || { ok=0; break; }
                    curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
                      --connect-timeout 10 --max-time 40 -X POST \
                      "$CLOUDFLARE_API_BASE/api/sync" \
                      -H "content-type: application/json" \
                      -H "x-sync-token: $SYNC_TOKEN" \
                      --data-binary @"$file" > /dev/null || { ok=0; break; }
                    verified=0
                    for attempt in 1 2 3; do
                      if PYTHONPATH=. python scripts/arvexq_protect_sync.py --verify-post --file "$file" --api-base "$CLOUDFLARE_API_BASE"; then
                        verified=1; break
                      fi
                      sleep $((attempt * 5))
                    done
                    test "$verified" = 1 || { ok=0; break; }
                  done
                fi
              else
                echo "No started races for $DATE; skip sync."
              fi
              if [ "$ok" = 1 ]; then echo sync-ok > "stage-marks/$DATE.sync"; else echo sync-FAILED > "stage-marks/$DATE.sync"; fi
            fi
            if [ "$ok" = 1 ]; then
              PYTHONPATH=. python scripts/arvexq_result_audit.py \
                --bundle "bundle-$DATE.json" \
                --report "result-repair-report-$DATE.json" \
                --payload "result-repair-payload-$DATE.json" \
                --api-base "$CLOUDFLARE_API_BASE" \
                --out "result-audit-report-$DATE.json" || ok=0
              cat "result-audit-report-$DATE.json" || true
              if [ "$ok" = 1 ]; then echo audit-ok > "stage-marks/$DATE.audit"; else echo audit-FAILED > "stage-marks/$DATE.audit"; fi
            fi
            if [ "$ok" != 1 ]; then
              FAILED="$FAILED $DATE"
              echo "$DATE FAILED" >> repair-summary.txt
            fi
          done < repair-dates.txt
          echo "----- summary -----"
          cat repair-summary.txt
          if [ -n "$FAILED" ]; then
            echo "::error::dates failed:$FAILED"
            exit 1
          fi

      - name: Commit compact results back to the repo
        if: always()
        run: |
          python - <<'PYEOF'
          import glob, json, os
          out = {"run_id": os.environ.get("GITHUB_RUN_ID"),
                 "dates": {}}
          dates = []
          if os.path.exists("repair-dates.txt"):
              dates = [d.strip() for d in open("repair-dates.txt")
                       if d.strip()]
          for date in dates:
              entry = {"stages": {}}
              for mark in glob.glob(f"stage-marks/{date}.*"):
                  stage = mark.rsplit(".", 1)[-1]
                  entry["stages"][stage] = open(mark).read().strip()
              rep_path = f"result-repair-report-{date}.json"
              if os.path.exists(rep_path):
                  try:
                      rep = json.load(open(rep_path, encoding="utf-8"))
                      entry["repaired"] = [r.get("race_id") or r.get("id")
                                           for r in rep.get("repaired") or []]
                      entry["result_missing"] = rep.get("result_missing")
                      entry["payout_missing"] = rep.get("payout_missing")
                      entry["audit_failures"] = rep.get("audit_failures")
                  except Exception as e:
                      entry["report_error"] = str(e)
              log_path = f"result-repair-{date}.log"
              if os.path.exists(log_path):
                  lines = open(log_path, encoding="utf-8",
                               errors="replace").read().splitlines()
                  entry["repair_log_tail"] = lines[-25:]
              aud_path = f"result-audit-report-{date}.json"
              if os.path.exists(aud_path):
                  try:
                      entry["audit_report"] = json.load(
                          open(aud_path, encoding="utf-8"))
                  except Exception as e:
                      entry["audit_error"] = str(e)
              out["dates"][date] = entry
          path = "arvexq/result_missing_repair_requests/results.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          print(json.dumps(out, ensure_ascii=False)[:2000])
          PYEOF
          git config user.name "arvexq-result-missing-repair"
          git config user.email "actions@github.com"
          git add arvexq/result_missing_repair_requests/results.json
          if git diff --cached --quiet; then
            echo "results unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "repair(result-missing): run ${GITHUB_RUN_ID} results"
          commit=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            git fetch origin main
            if git push origin "$commit:main"; then
              echo "results pushed"
              exit 0
            fi
            # Someone else landed on main meanwhile: rebase the
            # results-only commit onto the fresh head and retry.
            git rebase origin/main || git rebase --abort
            commit=$(git rev-parse HEAD)
          done
          echo "::warning::results push failed after retries"
          exit 0

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-result-missing-repair-${{ github.run_number }}
          path: |
            repair-dates.txt
            repair-summary.txt
            stage-marks/*
            d1-bundle-report-*.json
            result-repair-*.log
            result-repair-report-*.json
            result-repair-payload-*.json
            result-audit-report-*.json
          if-no-files-found: ignore
          retention-days: 14
