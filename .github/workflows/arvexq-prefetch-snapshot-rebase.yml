name: ARVEXQ Prefetch Snapshot Git Rebase
"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/arvexq-prefetch.yml
      - .github/workflows/arvexq-prefetch-snapshot-rebase.yml
      - tests/test_prefetch_snapshot_autostash.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_prefetch_snapshot_autostash.py
