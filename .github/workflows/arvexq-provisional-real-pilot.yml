name: ARVEXQ Provisional Real-Race Pilot
"on":
  push:
    branches: [fix/arvexq-new-engine-complete-field-20261022]
    paths:
      - scripts/arvexq_provisional_real_pilot.py
      - scripts/arvexq_existing_model_tuning_pilot.py
      - scripts/arvexq_provisional_miss_rootcause.py
      - .github/workflows/arvexq-provisional-real-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ARVEXQ_DATA_CORE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      RACEDB_AUTO_UPDATE: "0"
      ARVEXQ_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt pytest==9.1.1
      - name: Existing replay chronology unit test
        run: PYTHONPATH=. python -m pytest -q tests/test_research_provisional_replay.py
      - name: Actual earlier-data training, original provisional marks and confirmed results
        run: PYTHONPATH=. python -u scripts/arvexq_provisional_real_pilot.py

      - name: Same model regularization comparison on unseen next-day races
        run: PYTHONPATH=. python -u scripts/arvexq_existing_model_tuning_pilot.py

      - name: Diagnose every missed winner using existing fitted feature contributions
        run: PYTHONPATH=. python -u scripts/arvexq_provisional_miss_rootcause.py
