name: ARVEXQ CC-Licensed Real Video Smoke

"on":
  pull_request:
    branches: [main]
    paths:
      - scripts/arvexq_vision_cc_smoke.py
      - scripts/arvexq_fetch_open_vision_model.py
      - arvexq/vision/open_detector.py
      - requirements-vision.txt
      - .github/workflows/arvexq-cc-video-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-video-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open detector runtime
        run: |
          python -m pip install -q -r requirements-vision.txt
      - name: Restore Apache detector model
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data/vision-model
          key: arvexq-apache-rtdetr-r50vd-v1
      - name: Download and verify pinned Apache checkpoint
        run: |
          python scripts/arvexq_fetch_open_vision_model.py --output-dir .arvexq-data/vision-model
      - name: Run real CC BY-SA horse video smoke (no race predictions)
        run: |
          python scripts/arvexq_vision_cc_smoke.py \
            --model-dir .arvexq-data/vision-model \
            --output .arvexq-data/vision-smoke.json
      - name: Preserve non-media audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-cc-vision-smoke
          path: .arvexq-data/vision-smoke.json
          if-no-files-found: warn
          retention-days: 7
