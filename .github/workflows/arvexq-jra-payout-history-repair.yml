name: ARVEXQ JRA Payout History Repair (2026-10-31 / 2026-11-01)

# One-off, dispatch-only extension of the steady result-repair lane to the
# two JRA days whose stored payout combinations still carry the pre-repair
# parser defect (2026-10-31 and 2026-11-01). Same production machinery as
# .github/workflows/arvexq-result-repair.yml (fetch bundle -> repair ->
# protect-sync -> named audit), with three deliberate scopings:
#   * the bundle is filtered to JRA races only (the lane's normal mode
#     would also touch NAR races of the day);
#   * the environment backfill pass is disabled
#     (ARVEXQ_RESULT_ENV_FILL_LIMIT=0) — past environment backfill for old
#     JRA days was decided against on 2026-11-09;
#   * no schedule; triggered by a push to
#     arvexq/payout_repair_requests/requests.json (a PAT cannot dispatch
#     workflows), one date per push, the date read from that file.

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - arvexq/payout_repair_requests/requests.json

concurrency:
  group: arvexq-result-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      CLOUDFLARE_API_BASE: https://kraiz-api.4b89h4fydd.workers.dev
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-data
      ARVEXQ_BOOTSTRAP_WARM: "0"
      ARVEXQ_DATA_CORE: "0"
      RACEDB_AUTO_UPDATE: "0"
      NAR_ON_DEMAND_HISTORY_MONTHS: "12"
      ARVEXQ_RESULT_WORKERS: "6"
      ARVEXQ_RESULT_RETRY_SLEEP_SEC: "3"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Result parser and non-destructive merge regression
        run: |
          python -m unittest discover -s tests -p 'test_result_stalled_regressions.py' -v
          python -m unittest discover -s tests -p 'test_result_repair_retired_banei.py' -v
          python -m unittest discover -s tests -p 'test_result_repair_env_fill.py' -v

      - name: Set sync date
        run: |
          DATE=$(jq -r '.date' arvexq/payout_repair_requests/requests.json)
          case "$DATE" in
            2026-10-31|2026-11-01) ;;
            *) echo "::error::unsupported repair date: $DATE"; exit 1 ;;
          esac
          echo "SYNC_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Restore warm cache read-only
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-data
          key: arvexq-result-readonly-${{ runner.os }}-${{ env.SYNC_DATE }}-${{ github.run_id }}
          restore-keys: |
            arvexq-prefetch-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-${{ env.SYNC_DATE }}-
            arvexq-data-${{ runner.os }}-

      - name: Read the day from D1 race-by-race and keep JRA races only
        run: |
          python scripts/arvexq_fetch_d1_bundle.py \
            --api-base "$CLOUDFLARE_API_BASE" \
            --date "$SYNC_DATE" \
            --out bundle.json \
            --report d1-bundle-report.json \
            --workers 8 \
            --allow-missing-details --allow-empty-day
          python scripts/arvexq_restore_result_day.py \
            --bundle bundle.json --date "$SYNC_DATE" --report result-day-index.json
          python - <<'PYEOF'
          import json
          bundle = json.load(open("bundle.json", encoding="utf-8"))
          races = [r for r in bundle.get("races") or []
                   if str(r.get("id") or "").startswith("jra-")]
          keep = {str(r["id"]) for r in races}
          details = [d for d in bundle.get("details") or []
                     if str(d.get("id") or "") in keep]
          bundle["races"] = races
          bundle["details"] = details
          bundle["raceCount"] = len(races)
          bundle["detailCount"] = len(details)
          json.dump(bundle, open("bundle-jra.json", "w", encoding="utf-8"),
                    ensure_ascii=False)
          print(f"JRA races={len(races)} details={len(details)}")
          assert len(races) == 24 and len(details) == 24, "expected the day's 24 JRA races"
          PYEOF

      - name: Repair started incomplete results (JRA only, env fill off)
        env:
          # Step-scoped on purpose: repair() reads this limit from the
          # process env, and the regression tests above exercise repair()
          # with the default limit — a job-level 0 would fail them.
          ARVEXQ_RESULT_ENV_FILL_LIMIT: "0"
        run: |
          if ! PYTHONPATH=. python scripts/arvexq_result_repair.py \
              --bundle bundle-jra.json --payload result-repair-payload.json \
              --report result-repair-report.json > result-repair.log 2>&1
          then
            echo "::error::Result repair failed"
            tail -n 80 result-repair.log || true
            exit 1
          fi
          jq '{date,started,pending_before,repairedCount:(.repaired|length),resultMissing:(.result_missing|length),payoutMissing:(.payout_missing|length)}' result-repair-report.json
          echo "--- unresolved result detail ---"
          jq '.result_missing // []' result-repair-report.json
          echo "--- payout-missing detail ---"
          jq '.payout_missing // []' result-repair-report.json

      - name: Push repaired snapshots to D1 in safe batches
        run: |
          STARTED=$(jq '.meta.started_race_count // 0' result-repair-payload.json)
          if [ "$STARTED" -le 0 ]; then
            echo "No started races; skip sync."
            exit 0
          fi
          python scripts/arvexq_sync_batches.py \
            --input result-repair-payload.json \
            --out-dir result-sync-batches
          COUNT=$(find result-sync-batches -type f -name 'batch-*.json' | wc -l | tr -d ' ')
          echo "D1 result repair batches=$COUNT"
          for file in result-sync-batches/batch-*.json; do
            safe=0
            for attempt in 1 2 3; do
              if PYTHONPATH=. python scripts/arvexq_protect_sync.py --file "$file" --api-base "$CLOUDFLARE_API_BASE"; then
                safe=1; break
              fi
              sleep $((attempt * 5))
            done
            test "$safe" = 1
            BYTES=$(wc -c < "$file" | tr -d ' ')
            echo "POST $(basename "$file") bytes=$BYTES"
            curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
              --connect-timeout 10 --max-time 40 -X POST \
              "$CLOUDFLARE_API_BASE/api/sync" \
              -H "content-type: application/json" \
              -H "x-sync-token: $SYNC_TOKEN" \
              --data-binary @"$file" > /dev/null
            verified=0
            for attempt in 1 2 3; do
              if PYTHONPATH=. python scripts/arvexq_protect_sync.py --verify-post --file "$file" --api-base "$CLOUDFLARE_API_BASE"; then
                verified=1; break
              fi
              echo "D1 sync verification unavailable; attempt=$attempt retrying"
              sleep $((attempt * 5))
            done
            test "$verified" = 1
          done
          echo "D1 result repair batched push OK"

      - name: Verify repaired results race-by-race from D1 (named checks)
        run: |
          PYTHONPATH=. python scripts/arvexq_result_audit.py \
            --bundle bundle-jra.json \
            --report result-repair-report.json \
            --payload result-repair-payload.json \
            --api-base "$CLOUDFLARE_API_BASE" \
            --out result-audit-report.json
          cat result-audit-report.json

      - name: Show concise failure log
        if: failure()
        run: |
          tail -n 100 result-repair.log 2>/dev/null || true
          cat d1-bundle-report.json 2>/dev/null || true

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvexq-jra-payout-history-repair-${{ env.SYNC_DATE }}-${{ github.run_number }}
          path: |
            bundle-jra.json
            d1-bundle-report.json
            result-repair.log
            result-repair-report.json
            result-repair-payload.json
            result-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
