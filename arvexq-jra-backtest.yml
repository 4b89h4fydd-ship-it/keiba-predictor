name: ARVEXQ JRA Backtest v208

"on":
  workflow_dispatch:
    inputs:
      days:
        description: "中央を何日前まで検証するか"
        required: true
        default: "90"
        type: choice
        options: ["60", "90", "120", "180"]
      max_races:
        description: "最大JRAレース数"
        required: true
        default: "360"
        type: choice
        options: ["240", "360", "480", "600"]
      iterations:
        description: "候補モデル探索回数"
        required: true
        default: "2500"
        type: choice
        options: ["1500", "2500", "4000"]

permissions:
  contents: read

concurrency:
  group: arvexq-jra-backtest-v208
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ARVEXQ_API_URL: https://kraiz-api.4b89h4fydd.workers.dev
      KEIBA_DATA_DIR: ${{ github.workspace }}/.arvexq-v208-data
      RACEDB_AUTO_UPDATE: "0"
      ARVEXQ_BOOTSTRAP_WARM: "0"
      JRA_OFFICIAL_TIMEOUT_SEC: "5.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/arvexq-jra-backtest.yml

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            fastapi==0.115.6 "uvicorn[standard]==0.34.0" beautifulsoup4==4.12.3

      - name: Restore JRA research cache
        uses: actions/cache/restore@v4
        with:
          path: .arvexq-v208-data
          key: arvexq-v208-jra-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            arvexq-v208-jra-${{ runner.os }}-

      - name: Resolve v208 inputs
        shell: bash
        run: |
          DAYS="${{ github.event.inputs.days }}"; [ -n "$DAYS" ] || DAYS=90
          MAXR="${{ github.event.inputs.max_races }}"; [ -n "$MAXR" ] || MAXR=360
          ITER="${{ github.event.inputs.iterations }}"; [ -n "$ITER" ] || ITER=2500
          echo "BACKTEST_DAYS=$DAYS" >> "$GITHUB_ENV"
          echo "BACKTEST_MAX_RACES=$MAXR" >> "$GITHUB_ENV"
          echo "BACKTEST_ITERATIONS=$ITER" >> "$GITHUB_ENV"
          echo "ARVEXQ v208 JRA: days=$DAYS max_races=$MAXR iterations=$ITER"

      - name: Run JRA-only leakage-guarded backtest
        run: |
          rm -rf backtest-v208-jra
          python backtest_v208_jra.py \
            --api-url "$ARVEXQ_API_URL" \
            --days "$BACKTEST_DAYS" \
            --max-races "$BACKTEST_MAX_RACES" \
            --iterations "$BACKTEST_ITERATIONS" \
            --workers 6 \
            --out backtest-v208-jra

      - name: Show report in Actions
        if: always()
        shell: bash
        run: |
          if [ -f backtest-v208-jra/report.md ]; then
            cat backtest-v208-jra/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# ARVEXQ v208 JRA" >> "$GITHUB_STEP_SUMMARY"
            echo "report.md was not created" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JRA backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARVEXQ-v208-JRA-${{ github.run_number }}
          path: backtest-v208-jra/
          if-no-files-found: warn
          retention-days: 30

      - name: Save JRA research cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .arvexq-v208-data
          key: arvexq-v208-jra-${{ runner.os }}-${{ github.run_id }}
