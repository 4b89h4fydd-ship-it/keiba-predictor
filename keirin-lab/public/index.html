<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2c"><title>KEIRIN LAB｜競輪予想</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fb;color:#14213a;font:15px system-ui,-apple-system,sans-serif}header{background:#101b2c;color:white;padding:23px 16px}h1{font-size:25px;margin:0}header p{font-size:12px;color:#c4d1df;margin-bottom:0}main{max-width:980px;margin:auto;padding:14px}section{background:white;padding:15px;border-radius:14px;margin:10px 0;box-shadow:0 2px 10px #16283c12}h2{font-size:20px}h3{font-size:16px;margin-top:22px}.sub{font-size:12px;color:#69778a;font-weight:400}label{font-size:12px;display:block;color:#53647b;margin-bottom:5px}input,select{padding:11px;width:100%;font-size:16px;border-radius:9px;border:1px solid #bccbd9;background:white}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end}button{background:#175cb9;color:#fff;border:0;border-radius:9px;min-height:44px;padding:10px 15px;font-size:15px;font-weight:700}button.race{background:#e8eff9;color:#1b4f95;min-width:74px}button.race:hover{background:#c8daf4}.races{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.races small{font-size:11px;color:#62768f;display:block;font-weight:400}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:680px;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid #e4eaf2;text-align:left;white-space:nowrap}th{background:#f3f7fc}td:first-child{font-weight:650}.summary{background:#eff5fe;border-radius:11px;padding:15px;display:flex;flex-direction:column;gap:8px}.summary strong{font-size:22px}.summary span{font-size:14px}.notice{background:#fff4df;border-radius:9px;padding:11px;font-size:12px;line-height:1.7;color:#61502e}.status{font-size:12px;color:#607086;line-height:1.6}@media(max-width:600px){main{padding:9px}section{padding:12px}.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:span 2;width:100%}} 

/* Mobile layout stability: prevent iOS date/select intrinsic widths and box collisions */
html,body{width:100%;max-width:100%;overflow-x:hidden}
main,section,.controls,.controls>div,.summary,#detail{min-width:0;max-width:100%}
.controls{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.controls>div{min-width:0}
.controls input,.controls select{display:block;min-width:0;max-width:100%;height:46px;appearance:auto}
.controls #load{grid-column:1/-1;width:100%;white-space:normal}
.quick-dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.quick-dates button{min-width:0;overflow-wrap:anywhere;padding:10px 6px}
.races{display:grid;grid-template-columns:repeat(auto-fill,minmax(79px,1fr));gap:8px}
button.race{min-width:0;width:100%;overflow-wrap:anywhere;min-height:57px;padding:8px 4px}
.summary,.notice,.status{overflow-wrap:anywhere}
.scroll{width:100%;max-width:100%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
@media(max-width:390px){
 .controls{grid-template-columns:minmax(0,1fr)}
 .controls #load{grid-column:1}
 .races{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.venuesGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.venueCard{display:flex;align-items:center;justify-content:space-between;min-height:78px;width:100%;background:#edf4fd;color:#183f73;border:1px solid #cfdff1;border-radius:13px;text-align:left;padding:12px;font-weight:700;font-size:18px}.venueCard small{display:block;color:#61748b;font-size:12px;margin-top:5px;font-weight:400}.back{background:#ecf0f5;color:#234769;margin:0 0 12px;padding:9px 12px;min-height:40px}.races[hidden],.venuesGrid[hidden],section[hidden],#raceTools[hidden]{display:none!important}#detail{overflow:hidden}.status{overflow-wrap:anywhere}@media(min-width:700px){.venuesGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:390px){.venuesGrid{grid-template-columns:repeat(2,minmax(0,1fr))}} 
/* Date row: fixed alignment on iPhone Safari */
.controls{display:grid;grid-template-columns:minmax(0,1fr);width:100%;gap:10px;align-items:stretch}
.controls>div{display:block;min-width:0;width:100%;max-width:100%}
.controls input[type="date"]{display:block;box-sizing:border-box;inline-size:100%;min-inline-size:0;max-inline-size:100%;width:100%;height:48px;min-height:48px;margin:0;padding:0 12px;border:1px solid #bccbd9;border-radius:9px;background:#fff;color:#14213a;font-size:16px;line-height:normal;-webkit-appearance:none;appearance:none}
.controls input[type="date"]::-webkit-date-and-time-value{text-align:left;min-height:1em}
.controls input[type="date"]::-webkit-datetime-edit{padding:0}
.controls #load{grid-column:1!important;display:block;box-sizing:border-box;width:100%;min-width:0;height:48px;min-height:48px;margin:0}
@media(min-width:700px){.controls{grid-template-columns:minmax(0,1fr) minmax(0,220px)}.controls #load{grid-column:2!important;align-self:end}}
</style></head><body><header><h1>KEIRIN LAB</h1><p>開催場一覧 → レース一覧 → 予想詳細</p></header><main><section><h2 id="listTitle">開催場一覧</h2><div class="controls"><div><label>開催日</label><input type="date" id="date"></div><button id="load">日付を読み込む</button></div><select id="venues" aria-label="開催場" style="display:none"></select><div class="quick-dates"><button id="todayBtn" type="button">今日のレース</button><button id="tomorrowBtn" type="button">明日のレース</button></div><p class="status" id="status" aria-live="polite">読み込み中…</p><div id="raceTools" hidden><button type="button" id="backVenues" class="back">‹ 開催場一覧へ戻る</button><label for="raceFilter">表示区分</label><select id="raceFilter"><option value="all">すべて</option><option value="scheduled">開催予定</option><option value="draft">暫定予想</option><option value="confirmed">予想確定</option><option value="result">結果確定</option><option value="cancelled">中止</option></select></div><div class="venuesGrid" id="venuesGrid"></div><div class="races" id="races" hidden></div></section><section id="detail" hidden><button type="button" id="backRaces" class="back">‹ レース一覧へ戻る</button><p class="sub">開催場とレースを選択してください。</p></section><footer class="status">出走表取得元：公開GitHubデータ（snarfnet/keirin-data）。公式データとは限らず、利用前に正規出走表と照合が必要です。モデル推定は未校正で、確定した購入推奨ではありません。</footer></main><script src="/app.js"></script></body></html>
