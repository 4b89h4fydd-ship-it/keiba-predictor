<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2c"><title>KEIRIN LAB｜競輪予想</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fb;color:#14213a;font:15px system-ui,-apple-system,sans-serif}header{background:#101b2c;color:white;padding:23px 16px}h1{font-size:25px;margin:0}header p{font-size:12px;color:#c4d1df;margin-bottom:0}main{max-width:980px;margin:auto;padding:14px}section{background:white;padding:15px;border-radius:14px;margin:10px 0;box-shadow:0 2px 10px #16283c12}h2{font-size:20px}h3{font-size:16px;margin-top:22px}.sub{font-size:12px;color:#69778a;font-weight:400}label{font-size:12px;display:block;color:#53647b;margin-bottom:5px}input,select{padding:11px;width:100%;font-size:16px;border-radius:9px;border:1px solid #bccbd9;background:white}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end}button{background:#175cb9;color:#fff;border:0;border-radius:9px;min-height:44px;padding:10px 15px;font-size:15px;font-weight:700}button.race{background:#e8eff9;color:#1b4f95;min-width:74px}button.race:hover{background:#c8daf4}.races{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.races small{font-size:11px;color:#62768f;display:block;font-weight:400}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:680px;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid #e4eaf2;text-align:left;white-space:nowrap}th{background:#f3f7fc}td:first-child{font-weight:650}.summary{background:#eff5fe;border-radius:11px;padding:15px;display:flex;flex-direction:column;gap:8px}.summary strong{font-size:22px}.summary span{font-size:14px}.notice{background:#fff4df;border-radius:9px;padding:11px;font-size:12px;line-height:1.7;color:#61502e}.status{font-size:12px;color:#607086;line-height:1.6}@media(max-width:600px){main{padding:9px}section{padding:12px}.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:span 2;width:100%}} 
</style></head><body><header><h1>KEIRIN LAB</h1><p>開催場を選択 → レースをタップ → 自動で予想表示</p></header><main><section><h2>レースを選ぶ</h2><div class="controls"><div><label>開催日</label><input type="date" id="date"></div><div><label>開催場</label><select id="venues" aria-label="開催場"></select></div><button id="load">日付を読み込む</button></div><div style="display:flex;gap:8px;margin:12px 0"><button id="todayBtn" type="button">今日のレース</button><button id="tomorrowBtn" type="button">明日のレース</button></div><p class="status" id="status" aria-live="polite">読み込み中…</p><div class="races" id="races"></div></section><section id="detail"><p class="sub">開催場とレースを選択してください。</p></section><footer class="status">出走表取得元：公開GitHubデータ（snarfnet/keirin-data）。公式データとは限らず、利用前に正規出走表と照合が必要です。モデル推定は未校正で、確定した購入推奨ではありません。</footer></main><script src="/app.js"></script></body></html>
